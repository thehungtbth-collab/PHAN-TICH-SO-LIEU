8px; border-radius: 2px; display: inline-block; width: 100%; font-weight: bold; pointer-events: none; }\n        \n        /* Grading Styles */\n        .correct-answer { background-color: #dcfce7 !important; border-color: #22c55e !important; color: #15803d !important; }\n        .incorrect-answer { background-color: #fee2e2 !important; border-color: #ef4444 !important; color: #b91c1c !important; }\n        .correct-text { color: #15803d; font-weight: bold; }\n        .correct-feedback { display: block; margin-top: 4px; color: #16a34a; font-weight: bold; font-size: 0.875rem; animation: fadeIn 0.5s; }\n        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }\n        \n        .resizer-bar { width: 8px; background-color: #cbd5e1; cursor: col-resize; flex-shrink: 0; z-index: 30; display: flex; justify-content: center; align-items: center; border-left: 1px solid #94a3b8; }\n        .resizer-bar::after { content: \"||\"; color: #475569; font-size: 10px; }\n    </style>\n</head>\n<body class=\"bg-gray-100 h-screen flex flex-col text-gray-800 overflow-hidden\">\n    <header class=\"bg-white shadow-sm p-3 flex justify-between items-center z-10 h-16 shrink-0 border-b border-gray-200\">\n        <div class=\"flex items-center gap-4\">\n            <h1 class=\"text-lg font-bold text-slate-700 flex items-center gap-2\"><i class=\"fa-solid fa-headphones text-blue-600\"></i> Listening</h1>\n            <div class=\"relative\">\n                <select id=\"lesson-selector\" onchange=\"switchLesson(this.value)\" class=\"bg-slate-100 border border-slate-300 rounded px-3 py-1 text-sm font-bold text-slate-700 focus:outline-none focus:ring-2 ring-blue-500\">\n                </select>\n            </div>\n        </div>\n        <div class=\"flex gap-3 items-center\">\n            <div class=\"bg-slate-100 px-3 py-1 rounded-full text-sm font-mono text-slate-600 border border-slate-200\" id=\"timer\">00:00</div>\n            <button onclick=\"checkResults()\" class=\"bg-green-600 hover:bg-green-700 text-white text-sm font-bold px-4 py-1.5 rounded shadow\"><i class=\"fa-solid fa-check mr-1\"></i> Nộp Bài</button>\n        </div>\n    </header>\n    \n    <main class=\"flex-1 flex flex-col md:flex-row overflow-hidden\" id=\"main-container\">\n        <div id=\"pane-transcript\" class=\"w-full md:w-[40%] flex flex-col border-r border-gray-200 bg-white relative z-10 min-w-[250px]\">\n            <div class=\"p-4 bg-slate-900 text-white shadow-md shrink-0\">\n                <audio id=\"audio\" class=\"w-full h-10 mb-2\" controls></audio>\n                <div class=\"flex items-center justify-between\" id=\"trans-btn-container\"></div>\n            </div>\n            <div id=\"transcript-container\" class=\"flex-1 overflow-y-auto p-4 md:p-6 bg-white scroll-smooth\">\n                <div id=\"transcript\" class=\"text-base md:text-lg leading-relaxed max-w-2xl mx-auto\"></div>\n            </div>\n            <div id=\"transcript-placeholder\" class=\"hidden flex-1 flex items-center justify-center bg-slate-50 text-slate-400 p-10 text-center italic\">\n                <div><i class=\"fa-solid fa-eye-slash text-3xl mb-3\"></i><br>Transcript is currently hidden.</div>\n            </div>\n        </div>\n        \n        <div id=\"resizer-1\" class=\"resizer-bar hidden md:flex\"></div>\n\n        <div id=\"pane-right\" class=\"flex-1 flex flex-col md:flex-row overflow-hidden relative bg-slate-50\">\n            <div id=\"pane-questions\" class=\"flex-1 overflow-y-auto p-4 md:p-8 scroll-smooth order-2 md:order-1 min-w-[300px]\">\n                <div class=\"max-w-3xl mx-auto bg-white p-6 md:p-8 rounded-xl shadow-sm border border-gray-100 min-h-full\">\n                    <div id=\"questions-content\"></div>\n                    <div id=\"result-message\" class=\"hidden mt-6 p-4 rounded bg-blue-50 text-blue-800 text-center font-bold border border-blue-200\"></div>\n                </div>\n            </div>\n            <div id=\"resizer-2\" class=\"resizer-bar hidden md:flex\"></div>\n            <div id=\"pane-image\" class=\"w-full md:w-[35%] bg-white p-4 shrink-0 overflow-y-auto order-1 md:order-2 min-w-[200px]\">\n                <div class=\"sticky top-0\">\n                    <p class=\"text-[10px] font-bold text-gray-400 uppercase mb-2 text-center tracking-wider border-b pb-1\">Hình ảnh minh họa</p>\n                    <img id=\"exercise-img\" src=\"\" class=\"w-full h-auto object-contain rounded shadow-sm border border-gray-200 mx-auto\" alt=\"Image\">\n                </div>\n            </div>\n        </div>\n    </main>\n\n    <script>\n        const lessonsData = [{\"name\":\"PRACTICE 1\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2023/06/cam18-test1-part4.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"fences\",\"input-auto-1\":\"family\",\"input-auto-2\":\"helicopters\",\"input-auto-3\":\"stress\",\"input-auto-4\":\"sides\",\"input-auto-5\":\"breathing\",\"input-auto-6\":\"feet\",\"input-auto-7\":\"employment\",\"input-auto-8\":\"weapons\",\"input-auto-9\":\"tourism\"},\"processedTranscript\":\"<p data-time=\\\"0.000\\\">Part 4.</p>\\n<p data-time=\\\"1.800\\\">You will hear a zoology student giving a presentation on the process</p>\\n<p data-time=\\\"6.606\\\">of moving wild elephants to a new reserve known as Translocation.</p>\\n<p data-time=\\\"12.280\\\">First, you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"66.730\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"74.140\\\">For my presentation today, I want to tell you about how groups</p>\\n<p data-time=\\\"79.006\\\">of elephants have been moved and settled in new reserves.</p>\\n<p data-time=\\\"84.520\\\">This is known as Translocation, and has been</p>\\n<p data-time=\\\"87.954\\\">carried out in Malawi in Africa in recent years.</p>\\n<p data-time=\\\"92.580\\\">The reason this is being done is because of overpopulation of elephants in some areas.</p>\\n<p data-time=\\\"100.320\\\">Overpopulation is a good problem to have and</p>\\n<p data-time=\\\"103.643\\\">not one we tend to hear about very often.</p>\\n<p data-time=\\\"107.760\\\">In Malawi\\\\'s Magetti National Park, the elephant population had been</p>\\n<p data-time=\\\"112.666\\\">wiped out by poachers who killed the elephants for their ivory.</p>\\n<p data-time=\\\"118.300\\\">But in 2003, the park was restocked and effective law enforcement was introduced.</p>\\n<p data-time=\\\"125.561\\\">Since then, not a single elephant has been poached.</p>\\n<p data-time=\\\"131.640\\\">In this safe environment, the elephant population boomed.</p>\\n<p data-time=\\\"137.480\\\">Breeding went so well that there were more elephants than the park could support.</p>\\n<p data-time=\\\"144.340\\\">This led to a number of problems.</p>\\n<p data-time=\\\"147.360\\\">Firstly, there was more competition for food, which</p>\\n<p data-time=\\\"151.165\\\">meant that some elephants were suffering from hunger.</p>\\n<p data-time=\\\"156.500\\\">As there was a limit to the amount of food in the National</p>\\n<p data-time=\\\"160.871\\\">Park, some elephants began looking further afield.</p>\\n<p data-time=\\\"165.760\\\">Elephants were routinely knocking down fences around the</p>\\n<p data-time=\\\"170.829\\\">park, which then had to be repaired at a significant cost.</p>\\n<p data-time=\\\"177.160\\\">To solve this problem, the decision was made to move dozens of elephants from</p>\\n<p data-time=\\\"183.107\\\">Magetti National Park to incotticoto wildlife park, where there were no elephants.</p>\\n<p data-time=\\\"190.420\\\">But, obviously, attempting to move significant numbers of</p>\\n<p data-time=\\\"195.260\\\">elephants to a new home 300 km away is quite a challenge.</p>\\n<p data-time=\\\"205.490\\\">So, how did this translocation process work in practice?</p>\\n<p data-time=\\\"211.410\\\">Elephants were moved in groups of between 8 and 20, all belonging to one family.</p>\\n<p data-time=\\\"220.630\\\">Because relationships are very important to</p>\\n<p data-time=\\\"223.846\\\">elephants, they all had to be moved at the same time.</p>\\n<p data-time=\\\"227.811\\\">A team of vets and park ranges flew over the park in helicopters, and targeted</p>\\n<p data-time=\\\"235.359\\\">a group, which were rounded up and directed to a designated open plane.</p>\\n<p data-time=\\\"243.550\\\">The vets then used darts to immobilize the elephants.</p>\\n<p data-time=\\\"248.530\\\">This was a tricky maneuver, as they not only had to select the right dose of tranquilizer for</p>\\n<p data-time=\\\"255.482\\\">different sized elephants, but they had to dart the elephants as they were running around.</p>\\n<p data-time=\\\"263.390\\\">This also had to be done as quickly as</p>\\n<p data-time=\\\"266.602\\\">possible, so as to minimize the stress caused.</p>\\n<p data-time=\\\"272.150\\\">As soon as the elephants began to flop onto the</p>\\n<p data-time=\\\"275.430\\\">ground, the team moved in to take care of them.</p>\\n<p data-time=\\\"278.711\\\">To avoid the risk of suffocation, the team had to make sure none of the elephants</p>\\n<p data-time=\\\"285.022\\\">were lying on their chests, because their lungs could be crushed in this position.</p>\\n<p data-time=\\\"292.330\\\">So, all the elephants had to be placed on their sides.</p>\\n<p data-time=\\\"298.010\\\">One person stayed with each elephant, while they waited for the vets to do checks.</p>\\n<p data-time=\\\"305.170\\\">It was very important to keep an eye on their breathing.</p>\\n<p data-time=\\\"310.150\\\">If there were fewer than six breaths per minute,</p>\\n<p data-time=\\\"313.782\\\">the elephant would need urgent medical attention.</p>\\n<p data-time=\\\"318.430\\\">Colors were fitted to the matriarch in each group, so</p>\\n<p data-time=\\\"322.323\\\">their movements could be tracked in their new home.</p>\\n<p data-time=\\\"327.230\\\">Measurements were taken of each elephant\\\\'s tusks.</p>\\n<p data-time=\\\"331.230\\\">Elephants with large tusks would be at greater</p>\\n<p data-time=\\\"335.506\\\">risk from poachers and also of their feet.</p>\\n<p data-time=\\\"340.410\\\">The elephants were then taken to a recovery area, before</p>\\n<p data-time=\\\"344.987\\\">being loaded onto trucks and transported to their new home.</p>\\n<p data-time=\\\"350.670\\\">The elephants translated to incottacota settled in very well, and the project has</p>\\n<p data-time=\\\"357.415\\\">generally been accepted to have been a huge success, and not just for the elephants.</p>\\n<p data-time=\\\"365.970\\\">Employment prospects have improved enormously, contributing</p>\\n<p data-time=\\\"370.636\\\">to rising living standards for the whole community.</p>\\n<p data-time=\\\"375.830\\\">Poaching is no longer an issue, as former poachers</p>\\n<p data-time=\\\"379.810\\\">are able to find more reliable sources of income.</p>\\n<p data-time=\\\"384.690\\\">In fact, many of them volunteered to give up their</p>\\n<p data-time=\\\"388.225\\\">weapons, as they were no longer of any use to them.</p>\\n<p data-time=\\\"392.830\\\">More than 2,000 elephants have been born at incottacota since relocation.</p>\\n<p data-time=\\\"399.990\\\">With an area of more than 1800 square kilometers, there\\\\'s</p>\\n<p data-time=\\\"404.211\\\">plenty of space for the elephant population to continue to grow.</p>\\n<p data-time=\\\"409.850\\\">Their presence is also helping to rebalance incottacota\\\\'s damaged ecosystem, and</p>\\n<p data-time=\\\"416.357\\\">providing a sustainable conservation model, which could be replicated in other parks.</p>\\n<p data-time=\\\"424.550\\\">All this has been a big draw for tourism, which contributes five times more than</p>\\n<p data-time=\\\"431.101\\\">the illegal wildlife trade to GDP, and this is mainly because of the elephants.</p>\\n<p data-time=\\\"438.810\\\">There\\\\'s also been a dramatic rise in interest.</p>\\n<p data-time=\\\"445.810\\\">That is the end of Part 4.</p>\\n<p data-time=\\\"448.530\\\">You now have one minute to check your answers to Part 4.</p>\\n<p data-time=\\\"512.340\\\">That is the end of the listening test.</p>\\n<p data-time=\\\"516.000\\\">In the Isle\\\\'s test, you would now have 10 minutes to</p>\\n<p data-time=\\\"519.240\\\">transfer your answers to the listening answer sheet.</p>\\n\",\"processedQuestions\":\"<h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Questions 31-40</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Complete the notes below.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Write ONE WORD ONLY for each answer.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Elephant translocation</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Reasons for overpopulation at Majete National Park</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">●   strict enforcement of anti-poaching laws</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">●   successful breeding</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Problems caused by elephant overpopulation</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   greater competition, causing hunger for elephants</p><div id=\\\"q-auto-0\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   damage to <span class=\\\"font-bold text-blue-600 mx-1\\\">31.</span><input type=\\\"text\\\" id=\\\"input-auto-0\\\" class=\\\"mx-1\\\"> in the park</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">The translocation process</h3><div id=\\\"q-auto-1\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   a suitable group of elephants from the same <span class=\\\"font-bold text-blue-600 mx-1\\\">32.</span><input type=\\\"text\\\" id=\\\"input-auto-1\\\" class=\\\"mx-1\\\"> was selected</div></div><div id=\\\"q-auto-2\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   vets and park staff made use of <span class=\\\"font-bold text-blue-600 mx-1\\\">33.</span><input type=\\\"text\\\" id=\\\"input-auto-2\\\" class=\\\"mx-1\\\"> to help guide the elephants into an open plain</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">●   elephants were immobilised with tranquilisers</h3><div id=\\\"q-auto-3\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">–   this process had to be completed quickly to reduce <span class=\\\"font-bold text-blue-600 mx-1\\\">34.</span><input type=\\\"text\\\" id=\\\"input-auto-3\\\" class=\\\"mx-1\\\"></div></div><div id=\\\"q-auto-4\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">–   elephants had to be turned on their <span class=\\\"font-bold text-blue-600 mx-1\\\">35.</span><input type=\\\"text\\\" id=\\\"input-auto-4\\\" class=\\\"mx-1\\\"> to avoid damage to their lungs</div></div><div id=\\\"q-auto-5\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">–   elephants’ <span class=\\\"font-bold text-blue-600 mx-1\\\">36.</span><input type=\\\"text\\\" id=\\\"input-auto-5\\\" class=\\\"mx-1\\\"> had to be monitored constantly</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">–   tracking devices were fitted to the matriarchs</p><div id=\\\"q-auto-6\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">–   data including the size of their tusks and <span class=\\\"font-bold text-blue-600 mx-1\\\">37.</span><input type=\\\"text\\\" id=\\\"input-auto-6\\\" class=\\\"mx-1\\\"> was taken</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   elephants were taken by truck to their new reserve</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Advantages of translocation at Nkhotakota Wildlife Park</p><div id=\\\"q-auto-7\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   <span class=\\\"font-bold text-blue-600 mx-1\\\">38.</span><input type=\\\"text\\\" id=\\\"input-auto-7\\\" class=\\\"mx-1\\\"> opportunities</div></div><div id=\\\"q-auto-8\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   a reduction in the number of poachers and <span class=\\\"font-bold text-blue-600 mx-1\\\">39.</span><input type=\\\"text\\\" id=\\\"input-auto-8\\\" class=\\\"mx-1\\\"></div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   an example of conservation that other parks can follow</p><div id=\\\"q-auto-9\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   an increase in <span class=\\\"font-bold text-blue-600 mx-1\\\">40.</span><input type=\\\"text\\\" id=\\\"input-auto-9\\\" class=\\\"mx-1\\\"> as a contributor to GDP</div></div>\"},{\"name\":\"PRACTICE 2\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2023/06/cam18-test2-part4.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"convenient\",\"input-auto-1\":\"suits\",\"input-auto-2\":\"tailor\",\"input-auto-3\":\"profession\",\"input-auto-4\":\"visible\",\"input-auto-5\":\"string/ strings\",\"input-auto-6\":\"waist/ waists\",\"input-auto-7\":\"perfume\",\"input-auto-8\":\"image\",\"input-auto-9\":\"handbag\"},\"processedTranscript\":\"<p data-time=\\\"0.000\\\">Part 4.</p>\\n<p data-time=\\\"1.900\\\">You will hear a student on a fashion design</p>\\n<p data-time=\\\"4.508\\\">course giving a talk about the history of pockets.</p>\\n<p data-time=\\\"9.020\\\">First, you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"63.470\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"71.540\\\">Good morning.</p>\\n<p data-time=\\\"72.940\\\">Now we\\\\'ve been asked to choose an aspect of European clothing</p>\\n<p data-time=\\\"76.882\\\">or fashion, and to talk about its development over time.</p>\\n<p data-time=\\\"81.540\\\">I decided to focus on a rather small area of clothing, and that\\\\'s pockets.</p>\\n<p data-time=\\\"87.600\\\">I chose pockets for two reasons really.</p>\\n<p data-time=\\\"91.040\\\">We all have them in jeans, jackets, coats, for example.</p>\\n<p data-time=\\\"95.800\\\">And even though we often carry bags or briefcases as well, nothing is quite</p>\\n<p data-time=\\\"101.016\\\">as convenient as being able to pop your phone or credit card into your pocket.</p>\\n<p data-time=\\\"107.400\\\">Yet, I suspect that other than that, people don\\\\'t really think about</p>\\n<p data-time=\\\"112.016\\\">pockets too much, and their rather overlooked as a fashion item.</p>\\n<p data-time=\\\"117.700\\\">It\\\\'s certainly very interesting to go back in time</p>\\n<p data-time=\\\"120.802\\\">and see how pockets developed for men and women.</p>\\n<p data-time=\\\"124.640\\\">In the 18th century, fashions were quite different</p>\\n<p data-time=\\\"128.038\\\">from the way they are now, and pockets were too.</p>\\n<p data-time=\\\"132.320\\\">If we think about male fashion first, that was the time when suits became popular.</p>\\n<p data-time=\\\"140.400\\\">Trollsers were knee length only, and referred to as breaches.</p>\\n<p data-time=\\\"145.600\\\">The waist coats were short, and the jackets were long.</p>\\n<p data-time=\\\"149.820\\\">But all three garments were lined with material, and pockets</p>\\n<p data-time=\\\"154.030\\\">were sewn into this cloth by whichever tailor the customer used.</p>\\n<p data-time=\\\"159.400\\\">The wearer could then carry small objects such as pencils or</p>\\n<p data-time=\\\"163.743\\\">coins on their person, and reach them through a gap in the lining.</p>\\n<p data-time=\\\"169.920\\\">Codepockets became increasingly decorative on</p>\\n<p data-time=\\\"172.737\\\">the outside for men who wanted to look stylish.</p>\\n<p data-time=\\\"176.500\\\">But they were often larger, but plainer, if the wearer was</p>\\n<p data-time=\\\"180.111\\\">someone with a profession who needed to carry medical instruments.</p>\\n<p data-time=\\\"184.221\\\">A doctor or physician, for example.</p>\\n<p data-time=\\\"193.180\\\">The development of women\\\\'s pockets was a little different.</p>\\n<p data-time=\\\"198.200\\\">For one thing, they weren\\\\'t nearly as visible or as easy to reach as men\\\\'s.</p>\\n<p data-time=\\\"204.260\\\">In the 18th and 19th centuries, women carried numerous possessions</p>\\n<p data-time=\\\"209.157\\\">on their person, and some of these could be worth a lot of money.</p>\\n<p data-time=\\\"214.880\\\">Women were more vulnerable to theft, and wealthy women,</p>\\n<p data-time=\\\"218.832\\\">in particular, worried constantly about pick pockets.</p>\\n<p data-time=\\\"224.020\\\">So, what they did was to have a pair of pockets</p>\\n<p data-time=\\\"227.064\\\">made that were tied together with string.</p>\\n<p data-time=\\\"230.600\\\">The pockets were made of fabric, which might be recycled cloth if the</p>\\n<p data-time=\\\"235.395\\\">wearer had little money, or something more expensive, such as linen.</p>\\n<p data-time=\\\"240.121\\\">Sometimes featuring very delicate embroidery.</p>\\n<p data-time=\\\"244.800\\\">Women tied the pockets around their waist, so that they hung beneath their clothes.</p>\\n<p data-time=\\\"250.400\\\">Remember, skirts were long then, and there was plenty of room to hide a whole</p>\\n<p data-time=\\\"255.270\\\">range of small possessions between the layers of peticotes that were commonly worn.</p>\\n<p data-time=\\\"261.400\\\">They would have an opening in the folds of their skirts, through</p>\\n<p data-time=\\\"265.020\\\">which they could reach whatever they needed, like their perfume.</p>\\n<p data-time=\\\"269.860\\\">Working women, of course, also needed to carry around items that</p>\\n<p data-time=\\\"273.922\\\">they might use for whatever job or trade they were involved in.</p>\\n<p data-time=\\\"278.420\\\">But, their pairs of pockets still remained on the inside of their clothing.</p>\\n<p data-time=\\\"284.160\\\">They just got bigger or longer, sometimes reaching down to their knees.</p>\\n<p data-time=\\\"290.480\\\">So, the tie-on pockets went well into the 19th century, and only</p>\\n<p data-time=\\\"295.755\\\">changed when fashion ordered towards the end of that period.</p>\\n<p data-time=\\\"301.720\\\">That\\\\'s when dresses became tighter and less bulky,</p>\\n<p data-time=\\\"304.996\\\">and the pairs of pockets became very noticeable.</p>\\n<p data-time=\\\"309.160\\\">They stood out too much and detracted from the woman\\\\'s image.</p>\\n<p data-time=\\\"314.000\\\">Women who had been used to carrying around a range of personal possessions,</p>\\n<p data-time=\\\"318.853\\\">and still wanted to, needed somewhere to carry these items about their person.</p>\\n<p data-time=\\\"325.060\\\">That was when small bags or pouches, as they were known, came into fashion.</p>\\n<p data-time=\\\"331.600\\\">And, of course, they inevitably led onto the handbag of more</p>\\n<p data-time=\\\"336.126\\\">modern times, particularly when fashion removed pockets altogether.</p>\\n<p data-time=\\\"344.560\\\">That is the end of part four.</p>\\n<p data-time=\\\"346.900\\\">You now have one minute to check your answers to part four.</p>\\n<p data-time=\\\"410.750\\\">That is the end of the listening test.</p>\\n<p data-time=\\\"414.250\\\">In the IELTS test, you would now have ten minutes to</p>\\n<p data-time=\\\"417.540\\\">transfer your answers to the listening answer sheet.</p>\\n\",\"processedQuestions\":\"<h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Questions 31-40</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Complete the notes below.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Write ONE WORD ONLY for each answer.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Pockets</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Reason for choice of subject</h3><div id=\\\"q-auto-0\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   They are <span class=\\\"font-bold text-blue-600 mx-1\\\">31.</span><input type=\\\"text\\\" id=\\\"input-auto-0\\\" class=\\\"mx-1\\\"> but can be overlooked by consumers and designers.</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Pockets in men’s clothes</h3><div id=\\\"q-auto-1\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Men started to wear <span class=\\\"font-bold text-blue-600 mx-1\\\">32.</span><input type=\\\"text\\\" id=\\\"input-auto-1\\\" class=\\\"mx-1\\\"> in the 18th century.</div></div><div id=\\\"q-auto-2\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   A <span class=\\\"font-bold text-blue-600 mx-1\\\">33.</span><input type=\\\"text\\\" id=\\\"input-auto-2\\\" class=\\\"mx-1\\\"> sewed pockets into the lining of the garments.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   The wearer could use the pockets for small items.</p><div id=\\\"q-auto-3\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Bigger pockets might be made for men who belonged to a certain type of <span class=\\\"font-bold text-blue-600 mx-1\\\">34.</span><input type=\\\"text\\\" id=\\\"input-auto-3\\\" class=\\\"mx-1\\\"></div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Pockets in women’s clothes</h3><div id=\\\"q-auto-4\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Women’s pockets were less <span class=\\\"font-bold text-blue-600 mx-1\\\">35.</span><input type=\\\"text\\\" id=\\\"input-auto-4\\\" class=\\\"mx-1\\\"> than men’s.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   Women were very concerned about pickpockets.</p><div id=\\\"q-auto-5\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Pockets were produced in pairs using <span class=\\\"font-bold text-blue-600 mx-1\\\">36.</span><input type=\\\"text\\\" id=\\\"input-auto-5\\\" class=\\\"mx-1\\\"> to link them together.</div></div><div id=\\\"q-auto-6\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Pockets hung from the women’s <span class=\\\"font-bold text-blue-600 mx-1\\\">37.</span><input type=\\\"text\\\" id=\\\"input-auto-6\\\" class=\\\"mx-1\\\"> under skirts and petticoats.</div></div><div id=\\\"q-auto-7\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Items such as <span class=\\\"font-bold text-blue-600 mx-1\\\">38.</span><input type=\\\"text\\\" id=\\\"input-auto-7\\\" class=\\\"mx-1\\\"> could be reached through a gap in the material.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   Pockets, of various sizes, stayed inside clothing for many decades.</p><div id=\\\"q-auto-8\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   When dresses changed shape, hidden pockets had a negative effect on the <span class=\\\"font-bold text-blue-600 mx-1\\\">39.</span><input type=\\\"text\\\" id=\\\"input-auto-8\\\" class=\\\"mx-1\\\"> of women.</div></div><div id=\\\"q-auto-9\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Bags called ‘pouches’ became popular, before women carried a <span class=\\\"font-bold text-blue-600 mx-1\\\">40.</span><input type=\\\"text\\\" id=\\\"input-auto-9\\\" class=\\\"mx-1\\\"></div></div>\"},{\"name\":\"PRACTICE 3\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2023/06/cam18-test3-part4.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"technical\",\"input-auto-1\":\"cheap\",\"input-auto-2\":\"thousands\",\"input-auto-3\":\"identification\",\"input-auto-4\":\"tracking\",\"input-auto-5\":\"military\",\"input-auto-6\":\"location\",\"input-auto-7\":\"prediction\",\"input-auto-8\":\"database\",\"input-auto-9\":\"trust\"},\"processedTranscript\":\"<p data-time=\\\"0.000\\\">Part 4.</p>\\n<p data-time=\\\"1.800\\\">You will hear part of a lecture for astronomy students about the need</p>\\n<p data-time=\\\"6.324\\\">for a system to manage satellites and other objects orbiting the Earth.</p>\\n<p data-time=\\\"11.980\\\">First, you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"66.430\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"73.760\\\">In today\\\\'s astronomy lecture, I\\\\'m going to talk about the need for a system to</p>\\n<p data-time=\\\"79.550\\\">manage the movement of satellites and other objects in orbit around the Earth.</p>\\n<p data-time=\\\"85.980\\\">In other words, a space traffic management system.</p>\\n<p data-time=\\\"90.440\\\">We already have effective air traffic control systems that are used</p>\\n<p data-time=\\\"94.941\\\">internationally to ensure that planes navigate our skies safely.</p>\\n<p data-time=\\\"99.970\\\">Well, space traffic management is a similar</p>\\n<p data-time=\\\"102.856\\\">concept, but focusing on the control of satellites.</p>\\n<p data-time=\\\"107.780\\\">The aim of such a system would be to prevent the danger of</p>\\n<p data-time=\\\"111.737\\\">collisions in space between the objects in orbit around the Earth.</p>\\n<p data-time=\\\"117.100\\\">In order to do this, we\\\\'d need to have a set of legal measures, and we\\\\'d also</p>\\n<p data-time=\\\"122.690\\\">have to develop the technical systems to enable us to prevent such accidents.</p>\\n<p data-time=\\\"129.200\\\">But unfortunately, at present, we don\\\\'t actually</p>\\n<p data-time=\\\"132.678\\\">have a space traffic management system that works.</p>\\n<p data-time=\\\"137.260\\\">So why not?</p>\\n<p data-time=\\\"139.240\\\">What are the problems in developing such a system?</p>\\n<p data-time=\\\"143.260\\\">Well, for one thing, satellites are relatively cheap these days, compared with how</p>\\n<p data-time=\\\"148.710\\\">they were in the past, meaning that more people can afford to put them into space.</p>\\n<p data-time=\\\"154.800\\\">So there\\\\'s a lot more of them out there, and people aren\\\\'t just launching single satellites,</p>\\n<p data-time=\\\"161.146\\\">but whole constellations, consisting of thousands of them designed to work together.</p>\\n<p data-time=\\\"167.520\\\">So space is getting more crowded every day.</p>\\n<p data-time=\\\"171.860\\\">But in spite of this, one thing you may be surprised to learn is that you can launch a satellite into space,</p>\\n<p data-time=\\\"179.525\\\">and once it\\\\'s out there, it doesn\\\\'t have to send back any information to Earth to allow its identification.</p>\\n<p data-time=\\\"188.460\\\">So while we have international systems for ensuring we know where the planes in our skies are, and to prevent them from colliding with</p>\\n<p data-time=\\\"197.316\\\">one another, when it comes to the safety of satellites, at present, we don\\\\'t have anything like enough proper ways of tracking them.</p>\\n<p data-time=\\\"206.960\\\">And it isn\\\\'t just entire satellites that we need to consider.</p>\\n<p data-time=\\\"211.080\\\">A greater threat is the huge amount of space debris in orbit around the</p>\\n<p data-time=\\\"220.557\\\">Earth, broken bits of satellite, and junk from space stations, and so on.</p>\\n<p data-time=\\\"230.301\\\">In addition, some operators may be unwilling to share</p>\\n<p data-time=\\\"234.139\\\">information about the satellites they\\\\'ve launched.</p>\\n<p data-time=\\\"238.560\\\">For example, a satellite may be designed for military purposes, or it may have been launched</p>\\n<p data-time=\\\"244.713\\\">for commercial reasons, and the operators don\\\\'t want competitors to have information about it.</p>\\n<p data-time=\\\"251.001\\\">And even if the operators are willing to provide</p>\\n<p data-time=\\\"254.787\\\">it, the information isn\\\\'t easy to collect.</p>\\n<p data-time=\\\"258.920\\\">Details are needed about the object itself, as</p>\\n<p data-time=\\\"262.013\\\">well as about its location at a particular time.</p>\\n<p data-time=\\\"266.180\\\">And remember that a satellite isn\\\\'t very big, and it\\\\'s</p>\\n<p data-time=\\\"269.955\\\">likely to be moving at thousands of kilometers an hour.</p>\\n<p data-time=\\\"273.801\\\">We don\\\\'t have any sensors that can constantly follow something moving so fast, so all that the</p>\\n<p data-time=\\\"281.131\\\">scientists can do is to put forward a prediction concerning whether satellite is heading next.</p>\\n<p data-time=\\\"293.940\\\">So those are some of the problems that we\\\\'re facing.</p>\\n<p data-time=\\\"297.860\\\">Let\\\\'s consider now some of the solutions that have been suggested.</p>\\n<p data-time=\\\"301.861\\\">One key issue is the way in which information is dealt with.</p>\\n<p data-time=\\\"308.300\\\">We need more information, but it also needs to be accessible at a global level, so we need to</p>\\n<p data-time=\\\"314.943\\\">establish shared standards that we can all agree on for the way in which this information is presented.</p>\\n<p data-time=\\\"322.301\\\">We already do this in other areas of science, so although</p>\\n<p data-time=\\\"327.000\\\">this is a challenge, it\\\\'s not an impossible task.</p>\\n<p data-time=\\\"331.900\\\">Then as all this information is collected, it needs to be put together so it can be</p>\\n<p data-time=\\\"337.806\\\">used, and that will involve creating a single database on which it can be entered.</p>\\n<p data-time=\\\"344.360\\\">As we continue to push forward new developments, congestion</p>\\n<p data-time=\\\"348.576\\\">of the space environment is only going to increase.</p>\\n<p data-time=\\\"352.940\\\">To cope with this, we need to develop a system like the one I\\\\'ve</p>\\n<p data-time=\\\"357.019\\\">described to coordinate the work of the numerous spacecraft operators.</p>\\n<p data-time=\\\"362.280\\\">But it\\\\'s also essential that this system is one that establishes trust</p>\\n<p data-time=\\\"367.102\\\">in the people that use it, both nationally and at a global level.</p>\\n<p data-time=\\\"371.581\\\">One interesting development that I\\\\'ll mention it.</p>\\n<p data-time=\\\"378.370\\\">That is the end of Part 4.</p>\\n<p data-time=\\\"380.650\\\">You now have one minute to check your answers to Part 4.</p>\\n<p data-time=\\\"443.980\\\">That is the end of the listening test.</p>\\n<p data-time=\\\"448.100\\\">In the IELTS test, you would now have ten minutes to</p>\\n<p data-time=\\\"451.340\\\">transfer your answers to the listening answer sheet.</p>\\n\",\"processedQuestions\":\"<h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Questions 31-40</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Complete the notes below.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Write ONE WORD ONLY for each answer.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Space Traffic Management</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Space Traffic Management system</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   is a concept similar to Air Traffic Control, but for satellites rather than planes.</p><div id=\\\"q-auto-0\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   would aim to set up legal and <span class=\\\"font-bold text-blue-600 mx-1\\\">31.</span><input type=\\\"text\\\" id=\\\"input-auto-0\\\" class=\\\"mx-1\\\"> ways of improving safety.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   does not actually exist at present.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Problems in developing effective Space Traffic Management</p><div id=\\\"q-auto-1\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Satellites are now quite <span class=\\\"font-bold text-blue-600 mx-1\\\">32.</span><input type=\\\"text\\\" id=\\\"input-auto-1\\\" class=\\\"mx-1\\\"> and therefore more widespread (e.g. there are constellations made up of <span class=\\\"font-bold text-blue-600 mx-1\\\">33.</span><input type=\\\"text\\\" id=\\\"input-auto-2\\\" class=\\\"mx-1\\\"> of satellites).</div></div><div id=\\\"q-auto-2\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   At present, satellites are not required to transmit information to help with their <span class=\\\"font-bold text-blue-600 mx-1\\\">34.</span><input type=\\\"text\\\" id=\\\"input-auto-3\\\" class=\\\"mx-1\\\"> .</div></div><div id=\\\"q-auto-3\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   There are few systems for <span class=\\\"font-bold text-blue-600 mx-1\\\">35.</span><input type=\\\"text\\\" id=\\\"input-auto-4\\\" class=\\\"mx-1\\\"> satellites.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   Small pieces of debris may be difficult to identify.</p><div id=\\\"q-auto-4\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Operators may be unwilling to share details of satellites used for <span class=\\\"font-bold text-blue-600 mx-1\\\">36.</span><input type=\\\"text\\\" id=\\\"input-auto-5\\\" class=\\\"mx-1\\\"> or commercial reasons.</div></div><div id=\\\"q-auto-5\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   It may be hard to collect details of the object’s <span class=\\\"font-bold text-blue-600 mx-1\\\">37.</span><input type=\\\"text\\\" id=\\\"input-auto-6\\\" class=\\\"mx-1\\\"> at a given time.</div></div><div id=\\\"q-auto-6\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Scientists can only make a <span class=\\\"font-bold text-blue-600 mx-1\\\">38.</span><input type=\\\"text\\\" id=\\\"input-auto-7\\\" class=\\\"mx-1\\\"> about where the satellite will go.</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Solutions</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   Common standards should be agreed on for the presentation of information.</p><div id=\\\"q-auto-7\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   The information should be combined in one <span class=\\\"font-bold text-blue-600 mx-1\\\">39.</span><input type=\\\"text\\\" id=\\\"input-auto-8\\\" class=\\\"mx-1\\\"> .</div></div><div id=\\\"q-auto-8\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   A coordinated system must be designed to create <span class=\\\"font-bold text-blue-600 mx-1\\\">40.</span><input type=\\\"text\\\" id=\\\"input-auto-9\\\" class=\\\"mx-1\\\"> in its users.</div></div>\"},{\"name\":\"PRACTICE 4\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2023/06/cam18-test4-part4.mp3\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"plot\",\"input-auto-1\":\"poverty\",\"input-auto-2\":\"Europe\",\"input-auto-3\":\"poetry\",\"input-auto-4\":\"drawings\",\"input-auto-5\":\"furniture\",\"input-auto-6\":\"lamps\",\"input-auto-7\":\"harbour / harbor\",\"input-auto-8\":\"children\",\"input-auto-9\":\"relatives\"},\"processedTranscript\":\"<p data-time=\\\"0.000\\\">Part 4.</p>\\n<p data-time=\\\"1.840\\\">You will hear a literature student giving a talk about</p>\\n<p data-time=\\\"5.478\\\">Victor Hugo, a famous 19th century French writer.</p>\\n<p data-time=\\\"9.880\\\">First, you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"64.600\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"72.040\\\">The person I\\\\'ve chosen to talk about is the French writer Victor Hugo.</p>\\n<p data-time=\\\"78.560\\\">Many people have heard of him because his novel, Lame is a</p>\\n<p data-time=\\\"82.784\\\">Robler, which he wrote in 1862, is famous around the world.</p>\\n<p data-time=\\\"88.240\\\">It became a stage musical in the 1980s, and a film version was also released in 2012.</p>\\n<p data-time=\\\"95.840\\\">So, some of us, I\\\\'m sure, have a pretty general idea</p>\\n<p data-time=\\\"99.730\\\">of the plot, but we know much less about the author.</p>\\n<p data-time=\\\"104.780\\\">Today, I\\\\'m going to provide a little more insight into this talented man, and I\\\\'m going to talk</p>\\n<p data-time=\\\"110.766\\\">particularly about the home he had on the island of Gernsey in the British Channel Islands.</p>\\n<p data-time=\\\"117.220\\\">But first, his early career.</p>\\n<p data-time=\\\"120.720\\\">As I\\\\'ve said, he was a writer.</p>\\n<p data-time=\\\"123.280\\\">He was at the height of his career in Paris, and</p>\\n<p data-time=\\\"126.119\\\">he was very highly regarded by his colleagues.</p>\\n<p data-time=\\\"129.920\\\">As far as literature was concerned, he was</p>\\n<p data-time=\\\"132.469\\\">the leading figure of the romantic movement.</p>\\n<p data-time=\\\"136.060\\\">However, as well as being a literary genius, he also gave many</p>\\n<p data-time=\\\"140.613\\\">speeches about issues like the level of poverty in his society.</p>\\n<p data-time=\\\"146.110\\\">He felt very strongly about this, and about other</p>\\n<p data-time=\\\"149.870\\\">areas where change was needed, like education.</p>\\n<p data-time=\\\"154.820\\\">This kind of outspoken criticism was not well-liked by the rulers of France, and</p>\\n<p data-time=\\\"161.278\\\">eventually the Emperor, Napoleon III, told Victor Hugo to leave Paris and not return.</p>\\n<p data-time=\\\"168.820\\\">In other words, he sent him into exile.</p>\\n<p data-time=\\\"172.600\\\">So, Victor Hugo was forced to reside in other parts of Europe.</p>\\n<p data-time=\\\"178.960\\\">Gernsey was actually his third place of exile, and he landed there in 1855.</p>\\n<p data-time=\\\"186.240\\\">He produced a lot while on Gernsey, including Lame Zerabla.</p>\\n<p data-time=\\\"191.180\\\">And to do this, he had to spend a great deal of time in the home that he had there.</p>\\n<p data-time=\\\"196.361\\\">This was a property that he bought using the money he\\\\'d made</p>\\n<p data-time=\\\"200.119\\\">in France from the publication of a collection of his poetry.</p>\\n<p data-time=\\\"204.600\\\">It was the only property he ever owned, and he was very proud of it.</p>\\n<p data-time=\\\"214.770\\\">The property Victor Hugo bought on Gernsey was a large five-story house in the capital town of St.</p>\\n<p data-time=\\\"222.378\\\">Peterport, and he lived there for 15 years, returning to France in 1870 when Napoleon\\\\'s empire collapsed.</p>\\n<p data-time=\\\"231.430\\\">He decorated and furnished each level or floor</p>\\n<p data-time=\\\"234.890\\\">of the house in unique and wonderful ways.</p>\\n<p data-time=\\\"238.810\\\">And many people consider the inside of the house to be a work of art.</p>\\n<p data-time=\\\"244.550\\\">Today, it\\\\'s a museum that attracts 200,000 visitors a year.</p>\\n<p data-time=\\\"251.470\\\">He lived in the house with his family, and portraits of its members still hang in rooms on the</p>\\n<p data-time=\\\"258.021\\\">ground floor, along with drawings that he did during his travels that he felt were important to him.</p>\\n<p data-time=\\\"266.450\\\">In other ground floor rooms, there are huge</p>\\n<p data-time=\\\"269.292\\\">tapestries that he would have designed and loved.</p>\\n<p data-time=\\\"273.330\\\">The walls are covered in dark wood paneling that Victor Hugo</p>\\n<p data-time=\\\"277.436\\\">created himself using wooden furniture that he bought in the market.</p>\\n<p data-time=\\\"282.870\\\">The items were relatively inexpensive, and he used them to create intricate carvings.</p>\\n<p data-time=\\\"290.170\\\">They gave an atmosphere on the lower level that was shadowy and rather solemn.</p>\\n<p data-time=\\\"296.170\\\">On the next level of the house, there are two</p>\\n<p data-time=\\\"299.592\\\">impressive lounges where he entertained his guests.</p>\\n<p data-time=\\\"304.590\\\">One lounge has entirely red furnishings, such</p>\\n<p data-time=\\\"308.461\\\">as sofas and wall coverings, and the other blue.</p>\\n<p data-time=\\\"313.930\\\">There\\\\'s a strong Chinese influence in these areas in things like the wallpaper</p>\\n<p data-time=\\\"319.337\\\">pattern and the lamps, which he would have made himself by copying original versions.</p>\\n<p data-time=\\\"327.430\\\">His library, where he left many of his favorite books, forms the hallway to the third</p>\\n<p data-time=\\\"333.385\\\">floor, and was a comfortable area where he could relax and enjoy his afternoons.</p>\\n<p data-time=\\\"340.190\\\">And then, at the very top of the house, there\\\\'s a room called</p>\\n<p data-time=\\\"344.490\\\">The Lookout, called that because it looks out over the harbour.</p>\\n<p data-time=\\\"349.730\\\">In contrast to the rather dark lower levels, it\\\\'s full of light, and was</p>\\n<p data-time=\\\"355.412\\\">like a glass office where he would write until lunchtime, often at his desk.</p>\\n<p data-time=\\\"362.590\\\">So, Victor Hugo was a man of many talents, but he was also true to his values.</p>\\n<p data-time=\\\"370.430\\\">While living in his house on Gunsy, he entertained many other famous writers, but he also invited</p>\\n<p data-time=\\\"377.400\\\">a large group of local children from the deprived areas of the island to dinner once a week.</p>\\n<p data-time=\\\"384.810\\\">What\\\\'s more, he served them their food, which</p>\\n<p data-time=\\\"387.855\\\">was an extraordinary gesture for the time period.</p>\\n<p data-time=\\\"392.990\\\">In 1927, the house was owned by his relatives, and</p>\\n<p data-time=\\\"397.103\\\">they decided to donate it to the city of Paris.</p>\\n<p data-time=\\\"401.970\\\">It has since been restored using photographs from the period, and</p>\\n<p data-time=\\\"407.229\\\">as I mentioned earlier, is now a museum that is open to the public.</p>\\n<p data-time=\\\"416.160\\\">That is the end of Part 4.</p>\\n<p data-time=\\\"418.460\\\">You now have one minute to check your answers to Part 4.</p>\\n<p data-time=\\\"481.730\\\">That is the end of the listening test.</p>\\n<p data-time=\\\"485.150\\\">In the Isle\\\\'s test, you would now have ten minutes to</p>\\n<p data-time=\\\"488.754\\\">transfer your answers to the listening answer sheet.</p>\\n\",\"processedQuestions\":\"<h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Questions 31-40</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Complete the notes below.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Write ONE WORD ONLY for each answer.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Victor Hugo</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">His novel, Les Misérables</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   It has been adapted for theatre and cinema.</p><div id=\\\"q-auto-0\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   We know more about its overall <span class=\\\"font-bold text-blue-600 mx-1\\\">31.</span><input type=\\\"text\\\" id=\\\"input-auto-0\\\" class=\\\"mx-1\\\"> than about its author.</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">His early career</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   In Paris, his career was successful and he led the Romantic movement.</p><div id=\\\"q-auto-1\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   He spoke publicly about social issues, such as <span class=\\\"font-bold text-blue-600 mx-1\\\">32.</span><input type=\\\"text\\\" id=\\\"input-auto-1\\\" class=\\\"mx-1\\\"> and education.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   Napoleon III disliked his views and exiled him.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">His exile from France</h3><div id=\\\"q-auto-2\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Victor Hugo had to live elsewhere in <span class=\\\"font-bold text-blue-600 mx-1\\\">33.</span><input type=\\\"text\\\" id=\\\"input-auto-2\\\" class=\\\"mx-1\\\"></div></div><div id=\\\"q-auto-3\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   He used his income from the sale of some <span class=\\\"font-bold text-blue-600 mx-1\\\">34.</span><input type=\\\"text\\\" id=\\\"input-auto-3\\\" class=\\\"mx-1\\\"> he had written to buy a house on Guernsey.</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">His house on Guernsey</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   Victor Hugo lived in this house until the end of the Empire in France.</p><div id=\\\"q-auto-4\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   The ground floor contains portraits, <span class=\\\"font-bold text-blue-600 mx-1\\\">35.</span><input type=\\\"text\\\" id=\\\"input-auto-4\\\" class=\\\"mx-1\\\"> and tapestries that he valued.</div></div><div id=\\\"q-auto-5\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   He bought cheap <span class=\\\"font-bold text-blue-600 mx-1\\\">36.</span><input type=\\\"text\\\" id=\\\"input-auto-5\\\" class=\\\"mx-1\\\"> made of wood and turned this into beautiful wall carvings.</div></div><div id=\\\"q-auto-6\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   The first floor consists of furnished areas with wallpaper and <span class=\\\"font-bold text-blue-600 mx-1\\\">37.</span><input type=\\\"text\\\" id=\\\"input-auto-6\\\" class=\\\"mx-1\\\"> that have a Chinese design.</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   The library still contains many of his favourite books.</p><div id=\\\"q-auto-7\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   He wrote in a room at the top of the house that had a view of the <span class=\\\"font-bold text-blue-600 mx-1\\\">38.</span><input type=\\\"text\\\" id=\\\"input-auto-7\\\" class=\\\"mx-1\\\"> .</div></div><div id=\\\"q-auto-8\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   He entertained other writers as well as poor <span class=\\\"font-bold text-blue-600 mx-1\\\">39.</span><input type=\\\"text\\\" id=\\\"input-auto-8\\\" class=\\\"mx-1\\\"> in his house.</div></div><div id=\\\"q-auto-9\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Victor Hugo’s <span class=\\\"font-bold text-blue-600 mx-1\\\">40.</span><input type=\\\"text\\\" id=\\\"input-auto-9\\\" class=\\\"mx-1\\\"> gave ownership of the house to the city of Paris in 1927.</div></div>\"},{\"name\":\"PRACTICE 5\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2024/07/cam19-test1-part4.m4a\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"walls\",\"input-auto-1\":\"son\",\"input-auto-2\":\"fuel\",\"input-auto-3\":\"oxygen\",\"input-auto-4\":\"rectangular\",\"input-auto-5\":\"lamps\",\"input-auto-6\":\"family\",\"input-auto-7\":\"winter\",\"input-auto-8\":\"soil\",\"input-auto-9\":\"rain\"},\"processedTranscript\":\"<p data-time=\\\"0.540\\\">At 4, you will hear an archaeology student giving a presentation</p>\\n<p data-time=\\\"6.119\\\">on an important site in Ireland called the KG Fields.</p>\\n<p data-time=\\\"11.760\\\">First you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"81.320\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"88.710\\\">For my presentation today, I\\\\'m going to talk</p>\\n<p data-time=\\\"92.440\\\">about the KG Fields in the northwest of Ireland.</p>\\n<p data-time=\\\"97.190\\\">One of the largest neolithic sites in the world.</p>\\n<p data-time=\\\"101.470\\\">I recently visited this site and observed the work that</p>\\n<p data-time=\\\"104.497\\\">is currently being done by a team of archaeologists there.</p>\\n<p data-time=\\\"108.530\\\">The site was first discovered in the 1930s by a local teacher Patrick Cole Field.</p>\\n<p data-time=\\\"115.510\\\">He noticed that when local people were digging in the bog, they</p>\\n<p data-time=\\\"119.388\\\">were constantly hitting against what seemed to be rows of stones.</p>\\n<p data-time=\\\"124.250\\\">He realized that these must be walls and that there must be thousands of</p>\\n<p data-time=\\\"129.120\\\">years old for them to predate the bog which subsequently grew over them.</p>\\n<p data-time=\\\"133.991\\\">He wrote to the National Museum in Dublin to ask</p>\\n<p data-time=\\\"137.200\\\">them to investigate, but no one took him seriously.</p>\\n<p data-time=\\\"141.350\\\">It wasn\\\\'t until 40 years later when Patrick Cole Field\\\\'s son, Shamus,</p>\\n<p data-time=\\\"146.225\\\">who would become an archaeologist by then, began to explore further.</p>\\n<p data-time=\\\"151.890\\\">He inserted iron probes into the bog to map the formation of the stones, a traditional method</p>\\n<p data-time=\\\"157.930\\\">which local people had always used for finding fuel buried in the bog for thousands of years.</p>\\n<p data-time=\\\"165.210\\\">Carbon dating later proved that the site was over 5,000</p>\\n<p data-time=\\\"169.907\\\">years old and was the largest neolithic site in Ireland.</p>\\n<p data-time=\\\"176.170\\\">Thanks to the bog which covers the area, the remains of the settlement</p>\\n<p data-time=\\\"181.159\\\">at KG Fields which is over 5,000 years old are extremely well preserved.</p>\\n<p data-time=\\\"187.110\\\">A bog is 90% water.</p>\\n<p data-time=\\\"189.890\\\">It\\\\'s soil so saturated that when the grasses and heathers that grow</p>\\n<p data-time=\\\"194.866\\\">on its surface die, they don\\\\'t fully decay, but accumulate in layers.</p>\\n<p data-time=\\\"201.030\\\">Objects remain so well preserved in these conditions because</p>\\n<p data-time=\\\"204.423\\\">of the acidity of the peat and the deficiency of oxygen.</p>\\n<p data-time=\\\"208.670\\\">At least 175 days of rain a year are required for this to happen.</p>\\n<p data-time=\\\"214.051\\\">This part of Ireland gets an average of 225 days.</p>\\n<p data-time=\\\"225.300\\\">The neolithic farmers at KG would have enjoyed</p>\\n<p data-time=\\\"227.945\\\">several centuries of relative peace and stability.</p>\\n<p data-time=\\\"231.900\\\">Neolithic farmers generally lived in larger communities than their</p>\\n<p data-time=\\\"235.667\\\">predecessors with a number of houses built around a community building.</p>\\n<p data-time=\\\"240.800\\\">As they lived in permanent settlements, neolithic</p>\\n<p data-time=\\\"243.871\\\">farmers were able to build bigger houses.</p>\\n<p data-time=\\\"247.170\\\">These weren\\\\'t round as people often assume, but rectangular</p>\\n<p data-time=\\\"251.305\\\">with a small hole in the roof that allowed smoke to escape.</p>\\n<p data-time=\\\"256.640\\\">This is one of many innovations and indicates that the</p>\\n<p data-time=\\\"260.125\\\">neolithic farmers were the first people to cook indoors.</p>\\n<p data-time=\\\"265.220\\\">Another new technology that neolithic settlers brought to Ireland was pottery.</p>\\n<p data-time=\\\"270.400\\\">Fragments of neolithic pots have been found in KG and elsewhere in Ireland.</p>\\n<p data-time=\\\"274.981\\\">The pots were used for many things, as well as for</p>\\n<p data-time=\\\"278.712\\\">storing food, pots were filled with a small amount of fat.</p>\\n<p data-time=\\\"283.660\\\">And when this was set a light, they served as lamps.</p>\\n<p data-time=\\\"287.940\\\">It\\\\'s thought that the KG fields were mainly used as paddocks for animals to graze in.</p>\\n<p data-time=\\\"294.860\\\">Evidence from the KG fields suggests that each plot of</p>\\n<p data-time=\\\"298.100\\\">land was of a suitable size to sustain an extended family.</p>\\n<p data-time=\\\"302.400\\\">They may have used a system of rotational grazing in order to</p>\\n<p data-time=\\\"306.660\\\">prevent overgrazing and to allow for plant recovery and regrowth.</p>\\n<p data-time=\\\"312.280\\\">This must have been a year round activity, as no structures have been</p>\\n<p data-time=\\\"315.578\\\">found, which would have been used to shelter animals in the winter.</p>\\n<p data-time=\\\"320.500\\\">However, archaeologists believe that this way of life at KG ceased abruptly.</p>\\n<p data-time=\\\"327.160\\\">Why was this?</p>\\n<p data-time=\\\"328.880\\\">Well, several factors may have contributed to the changing circumstances.</p>\\n<p data-time=\\\"333.500\\\">The soil would have become less productive and led to the abandonment of farming.</p>\\n<p data-time=\\\"339.100\\\">The crop rotation system was partly responsible for this, as</p>\\n<p data-time=\\\"342.517\\\">it would have been very intensive and was not sustainable.</p>\\n<p data-time=\\\"346.660\\\">But there were also climatic pressures too.</p>\\n<p data-time=\\\"349.720\\\">The farmers at KG would have enjoyed a relatively dry period, but this began</p>\\n<p data-time=\\\"354.732\\\">to change and the conditions became wetter as there was a lot more rain.</p>\\n<p data-time=\\\"360.100\\\">It was these conditions that encouraged the</p>\\n<p data-time=\\\"363.100\\\">bog to form over the area which survives today.</p>\\n<p data-time=\\\"367.260\\\">So now I\\\\'d like to show you some.</p>\\n<p data-time=\\\"372.070\\\">That is the end of Part 4.</p>\\n<p data-time=\\\"375.030\\\">You now have one minute to check your answers to Part 4.</p>\\n\",\"processedQuestions\":\"<h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Questions 31–40</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Complete the notes below.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Write ONE WORD ONLY for each answer.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Céide Fields</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   an important Neolithic archaeological site in the northwest of Ireland</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Discovery</h3><div id=\\\"q-auto-0\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   In the 1930s, a local teacher realised that stones beneath the bog surface were once <span class=\\\"font-bold text-blue-600 mx-1\\\">31.</span><input type=\\\"text\\\" id=\\\"input-auto-0\\\" class=\\\"mx-1\\\"> .</div></div><div id=\\\"q-auto-1\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   His <span class=\\\"font-bold text-blue-600 mx-1\\\">32.</span><input type=\\\"text\\\" id=\\\"input-auto-1\\\" class=\\\"mx-1\\\"> became an archaeologist and undertook an investigation of the site:</div></div><div id=\\\"q-auto-2\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">–   a traditional method used by local people to dig for <span class=\\\"font-bold text-blue-600 mx-1\\\">33.</span><input type=\\\"text\\\" id=\\\"input-auto-2\\\" class=\\\"mx-1\\\"> was used to identify where stones were located</div></div><p class=\\\"mb-2 text-gray-600 text-sm\\\">–   carbon dating later proved the site was Neolithic.</p><div id=\\\"q-auto-3\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Items are well preserved in the bog because of a lack of <span class=\\\"font-bold text-blue-600 mx-1\\\">34.</span><input type=\\\"text\\\" id=\\\"input-auto-3\\\" class=\\\"mx-1\\\"> .</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Neolithic farmers</h3><div id=\\\"q-auto-4\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Houses were <span class=\\\"font-bold text-blue-600 mx-1\\\">35.</span><input type=\\\"text\\\" id=\\\"input-auto-4\\\" class=\\\"mx-1\\\"> in shape and had a hole in the roof.</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">●   Neolithic innovations include:</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">–   cooking indoors</h3><div id=\\\"q-auto-5\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">–   pots used for storage and to make <span class=\\\"font-bold text-blue-600 mx-1\\\">36.</span><input type=\\\"text\\\" id=\\\"input-auto-5\\\" class=\\\"mx-1\\\"> .</div></div><div id=\\\"q-auto-6\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Each field at Céide was large enough to support a big <span class=\\\"font-bold text-blue-600 mx-1\\\">37.</span><input type=\\\"text\\\" id=\\\"input-auto-6\\\" class=\\\"mx-1\\\"> .</div></div><div id=\\\"q-auto-7\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   The fields were probably used to restrict the grazing of animals – no evidence of structurers to house them during <span class=\\\"font-bold text-blue-600 mx-1\\\">38.</span><input type=\\\"text\\\" id=\\\"input-auto-7\\\" class=\\\"mx-1\\\"> .</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Reasons for the decline in farming</h3><div id=\\\"q-auto-8\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   a decline in <span class=\\\"font-bold text-blue-600 mx-1\\\">39.</span><input type=\\\"text\\\" id=\\\"input-auto-8\\\" class=\\\"mx-1\\\"> quality</div></div><div id=\\\"q-auto-9\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   an increase in <span class=\\\"font-bold text-blue-600 mx-1\\\">40.</span><input type=\\\"text\\\" id=\\\"input-auto-9\\\" class=\\\"mx-1\\\"></div></div>\"},{\"name\":\"PRACTICE 6\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2024/07/cam19-test2-part4.m4a\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"move\",\"input-auto-1\":\"short\",\"input-auto-2\":\"discs\",\"input-auto-3\":\"oxygen\",\"input-auto-4\":\"tube\",\"input-auto-5\":\"temperatures\",\"input-auto-6\":\"protein\",\"input-auto-7\":\"space\",\"input-auto-8\":\"seaweed\",\"input-auto-9\":\"endangered\"},\"processedTranscript\":\"<p data-time=\\\"0.440\\\">Part 4.</p>\\n<p data-time=\\\"3.120\\\">You will hear a zoology student giving a</p>\\n<p data-time=\\\"5.583\\\">presentation about an animal called a tardigrade.</p>\\n<p data-time=\\\"9.720\\\">First, you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"64.560\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"72.310\\\">For my project on invertebrates, I chose to study tardigrades.</p>\\n<p data-time=\\\"76.850\\\">These are microscopic, or to be more precise, near microscopic animals.</p>\\n<p data-time=\\\"82.170\\\">There are well over a thousand known species of these</p>\\n<p data-time=\\\"85.600\\\">tiny animals, which belong to the phylum tardigrader.</p>\\n<p data-time=\\\"89.950\\\">Most tardigrades range in length from 0.05 to 1 mm, though</p>\\n<p data-time=\\\"95.887\\\">the largest species can grow to be 1.2 mm in length.</p>\\n<p data-time=\\\"101.211\\\">There are also sometimes called water bears, water because that\\\\'s</p>\\n<p data-time=\\\"105.888\\\">where they thrive best, and bear because of the way they move.</p>\\n<p data-time=\\\"111.070\\\">Most piglet is another name for tardigrades because</p>\\n<p data-time=\\\"114.439\\\">of the way they look when viewed from the front.</p>\\n<p data-time=\\\"118.150\\\">They were first discovered in Germany in 1773 by</p>\\n<p data-time=\\\"122.480\\\">Johann Gertser, who coined the name tardigrader.</p>\\n<p data-time=\\\"127.690\\\">As I say, there are many different species of tardigrader.</p>\\n<p data-time=\\\"132.311\\\">Too many to describe here, but generally speaking,</p>\\n<p data-time=\\\"135.644\\\">the different species share similar physical traits.</p>\\n<p data-time=\\\"139.710\\\">They have a body which is short and also rounded, a bit</p>\\n<p data-time=\\\"144.151\\\">like a barrel, and the body comprises four segments.</p>\\n<p data-time=\\\"148.990\\\">Each segment has a pair of legs, at the end of</p>\\n<p data-time=\\\"152.346\\\">which are between four and eight sharp claws.</p>\\n<p data-time=\\\"155.631\\\">I should also say that some species don\\\\'t have any claws,</p>\\n<p data-time=\\\"160.509\\\">what they have are discs, and these work by means of suction.</p>\\n<p data-time=\\\"166.410\\\">They enable the tardigrader to cling onto surfaces or to grip its prey.</p>\\n<p data-time=\\\"172.190\\\">Within the body, there are no lungs or any organs for breathing at all.</p>\\n<p data-time=\\\"176.731\\\">Instead, oxygen and also blood are transported</p>\\n<p data-time=\\\"180.704\\\">in a fluid that fills the cavity of the body.</p>\\n<p data-time=\\\"185.790\\\">As far as the tardigrades head is concerned, the best way I can</p>\\n<p data-time=\\\"189.977\\\">describe this is that it looks rather strange, a bit squashed even.</p>\\n<p data-time=\\\"195.030\\\">Though many of the websites I looked at described its</p>\\n<p data-time=\\\"198.385\\\">appearance as cute, which isn\\\\'t exactly very scientific.</p>\\n<p data-time=\\\"201.931\\\">The tardigrades mouth is a kind of tube that can open</p>\\n<p data-time=\\\"206.352\\\">outwards to reveal teeth like structures known as stylets.</p>\\n<p data-time=\\\"211.790\\\">These are sharp enough to pierce plant or animal cells.</p>\\n<p data-time=\\\"216.810\\\">So, where are tardigrades found?</p>\\n<p data-time=\\\"219.470\\\">Well, they live in every part of the world, in a variety of habitats, most commonly</p>\\n<p data-time=\\\"225.892\\\">on the bed of a lake, or on many kinds of plants or in very wet environments.</p>\\n<p data-time=\\\"231.851\\\">There\\\\'s been some interesting research, which has found that</p>\\n<p data-time=\\\"236.097\\\">tardigrades are capable of surviving radiation and very high pressure.</p>\\n<p data-time=\\\"241.790\\\">And they\\\\'re also able to withstand temperatures as cold as minus 200 degrees</p>\\n<p data-time=\\\"248.139\\\">centigrade, or highs of more than 148 degrees centigrade, which is incredibly hot.</p>\\n<p data-time=\\\"259.660\\\">It has been said that tardigrades could survive long after human beings</p>\\n<p data-time=\\\"264.486\\\">have been wiped out, even in the event of an asteroid hitting the earth.</p>\\n<p data-time=\\\"270.180\\\">If conditions become too extreme, and tardigrades are at</p>\\n<p data-time=\\\"274.110\\\">risk of drying out, they enter a state called crypto biosis.</p>\\n<p data-time=\\\"278.321\\\">They curl into a ball called a ton, that\\\\'s TUN by retracting their head</p>\\n<p data-time=\\\"284.635\\\">and legs, and their metabolism drops to less than 1% of normal levels.</p>\\n<p data-time=\\\"291.800\\\">They can remain like this until they\\\\'re reintroduced to water,</p>\\n<p data-time=\\\"295.317\\\">when they will come back to life in a matter of a few hours.</p>\\n<p data-time=\\\"299.560\\\">While in a state of crypto biosis, tardigrades</p>\\n<p data-time=\\\"303.230\\\">produce a protein that protects their DNA.</p>\\n<p data-time=\\\"306.581\\\">In 2016, scientists revived two tardigrades that had been TUNs for more than 30 years.</p>\\n<p data-time=\\\"315.140\\\">There was a report that, in 1948, a 120-year-old TUN was</p>\\n<p data-time=\\\"320.041\\\">revived, but this experiment has never been repeated.</p>\\n<p data-time=\\\"325.520\\\">There are currently several tests taking place in space to</p>\\n<p data-time=\\\"329.522\\\">determine how long tardigrades might be able to survive there.</p>\\n<p data-time=\\\"333.801\\\">I believe the record so far is 10 days.</p>\\n<p data-time=\\\"338.720\\\">So, moving on, in terms of their diet,</p>\\n<p data-time=\\\"342.281\\\">tardigrades consume liquids in order to survive.</p>\\n<p data-time=\\\"347.420\\\">Although they have teeth, they don\\\\'t use these for chewing.</p>\\n<p data-time=\\\"351.440\\\">They suck the juices from moss or extract fluid from seaweed, but some</p>\\n<p data-time=\\\"357.069\\\">species prey on other tardigrades from other species or within their own.</p>\\n<p data-time=\\\"362.941\\\">I suppose this isn\\\\'t surprising, given that tardigrades are</p>\\n<p data-time=\\\"367.071\\\">mainly comprised of liquid and are coated with a type of gel.</p>\\n<p data-time=\\\"372.720\\\">Finally, I\\\\'d like to mention the conservation status of tardigrades.</p>\\n<p data-time=\\\"377.420\\\">It is estimated that they have been in existence</p>\\n<p data-time=\\\"380.157\\\">for approximately half a billion years.</p>\\n<p data-time=\\\"382.381\\\">And, in that time, they have survived five mass extinctions.</p>\\n<p data-time=\\\"388.400\\\">So, it will probably come as no surprise to you that tardigrades have not been evaluated</p>\\n<p data-time=\\\"394.570\\\">by the international union for conservation of nature, and are not on any endangered list.</p>\\n<p data-time=\\\"401.420\\\">Some researchers have described them as thriving.</p>\\n<p data-time=\\\"406.260\\\">Does anyone have any questions they\\\\'d like to ask?</p>\\n<p data-time=\\\"412.220\\\">That is the end of part four.</p>\\n<p data-time=\\\"415.080\\\">You now have one minute to check your answers to part four.</p>\\n\",\"processedQuestions\":\"<h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Questions 31–40</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">Complete the notes below.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">Write ONE WORD ONLY for each answer.</p><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Tardigrades</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   more than 1,000 species, 0.05–1.2 millimetres long</p><div id=\\\"q-auto-0\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   also known as water ‘bears’ (due to how they <span class=\\\"font-bold text-blue-600 mx-1\\\">31.</span><input type=\\\"text\\\" id=\\\"input-auto-0\\\" class=\\\"mx-1\\\">) and ‘moss piglets’</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Physical appearance</h3><div id=\\\"q-auto-1\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   a <span class=\\\"font-bold text-blue-600 mx-1\\\">32.</span><input type=\\\"text\\\" id=\\\"input-auto-1\\\" class=\\\"mx-1\\\"> round body and four pairs of legs</div></div><div id=\\\"q-auto-2\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   claws or <span class=\\\"font-bold text-blue-600 mx-1\\\">33.</span><input type=\\\"text\\\" id=\\\"input-auto-2\\\" class=\\\"mx-1\\\"> for gripping</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">●   absence of respiratory organs</h3><div id=\\\"q-auto-3\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   body filled with a liquid that carries both <span class=\\\"font-bold text-blue-600 mx-1\\\">34.</span><input type=\\\"text\\\" id=\\\"input-auto-3\\\" class=\\\"mx-1\\\"> and blood</div></div><div id=\\\"q-auto-4\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   mouth shaped like a <span class=\\\"font-bold text-blue-600 mx-1\\\">35.</span><input type=\\\"text\\\" id=\\\"input-auto-4\\\" class=\\\"mx-1\\\"> with teeth called stylets</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Habitat</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   often found at the bottom of a lake or on plants</p><div id=\\\"q-auto-5\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   very resilient and can exist in very low or high <span class=\\\"font-bold text-blue-600 mx-1\\\">36.</span><input type=\\\"text\\\" id=\\\"input-auto-5\\\" class=\\\"mx-1\\\"></div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Cryptobiosis</h3><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   In dry conditions, they roll into a ball called a ‘tun’.</p><p class=\\\"mb-2 text-gray-600 text-sm\\\">●   They stay alive with a much lower metabolism than usual.</p><div id=\\\"q-auto-6\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   A type of <span class=\\\"font-bold text-blue-600 mx-1\\\">37.</span><input type=\\\"text\\\" id=\\\"input-auto-6\\\" class=\\\"mx-1\\\"> ensures their DNA is not damaged.</div></div><div id=\\\"q-auto-7\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   Research is underway to find out how many days they can stay alive in <span class=\\\"font-bold text-blue-600 mx-1\\\">38.</span><input type=\\\"text\\\" id=\\\"input-auto-7\\\" class=\\\"mx-1\\\"> .</div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Feeing</h3><div id=\\\"q-auto-8\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   consume liquids, e.g., those found in moss or <span class=\\\"font-bold text-blue-600 mx-1\\\">39.</span><input type=\\\"text\\\" id=\\\"input-auto-8\\\" class=\\\"mx-1\\\"></div></div><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">●   may eat other tardigrades</h3><h3 class=\\\"font-bold text-gray-700 mt-4 mb-2 uppercase text-xs border-b pb-1\\\">Conservation status</h3><div id=\\\"q-auto-9\\\" class=\\\"question-block mb-3 p-2 relative\\\"><div class=\\\"flex-1\\\">●   They are not considered to be <span class=\\\"font-bold text-blue-600 mx-1\\\">40.</span><input type=\\\"text\\\" id=\\\"input-auto-9\\\" class=\\\"mx-1\\\"> .</div></div>\"},{\"name\":\"PRACTICE 7\",\"audio\":\"https://ieltstrainingonline.com/wp-content/uploads/2024/07/cam19-test3-part4.m4a\",\"image\":\"\",\"hideTrans\":false,\"removeDragged\":false,\"answerKey\":{\"input-auto-0\":\"clothing\",\"input-auto-1\":\"mouths\",\"input-auto-2\":\"salt\",\"input-auto-3\":\"toothpaste\",\"input-auto-4\":\"fertilisers / fertilizers\",\"input-auto-5\":\"nutrients\",\"input-auto-6\":\"growth\",\"input-auto-7\":\"weight\",\"input-auto-8\":\"acid\",\"input-auto-9\":\"society\"},\"processedTranscript\":\"<p data-time=\\\"0.640\\\">Part 4.</p>\\n<p data-time=\\\"3.260\\\">You will hear part of an environmental science lecture about microplastics.</p>\\n<p data-time=\\\"9.340\\\">First, you have some time to look at questions 31 to 40.</p>\\n<p data-time=\\\"64.510\\\">Now listen carefully and answer questions 31 to 40.</p>\\n<p data-time=\\\"72.490\\\">In today\\\\'s lecture, I\\\\'m going to be talking about microplastics.</p>\\n<p data-time=\\\"78.370\\\">Microplastics are tiny pieces of plastic smaller than 5mm in size.</p>\\n<p data-time=\\\"85.370\\\">Recently, there\\\\'s been a greater awareness that there are large</p>\\n<p data-time=\\\"89.078\\\">quantities of plastic waste began small in the environment.</p>\\n<p data-time=\\\"93.930\\\">The amount of plastic waste in the oceans has received widespread attention.</p>\\n<p data-time=\\\"98.551\\\">But far less is known about the effects of</p>\\n<p data-time=\\\"101.893\\\">microplastics in fresh water and particularly in soil.</p>\\n<p data-time=\\\"108.310\\\">Microplastics can enter the environment via a number of different sources.</p>\\n<p data-time=\\\"114.030\\\">Threads and microfibers detach from synthetic</p>\\n<p data-time=\\\"117.006\\\">clothing every time they\\\\'re put in a washing machine.</p>\\n<p data-time=\\\"121.150\\\">And the ease find their way into the water system.</p>\\n<p data-time=\\\"124.890\\\">Other sources include big pieces of plastic waste that are already in the</p>\\n<p data-time=\\\"130.096\\\">environment, and the ease break down into microscopic particles over a period of time.</p>\\n<p data-time=\\\"137.570\\\">On a larger scale, factory waste is another route, as our tyres, which</p>\\n<p data-time=\\\"142.931\\\">were down as cars, lorries and so on, travel along road surfaces.</p>\\n<p data-time=\\\"149.110\\\">We already understand some of the impacts of microplastics</p>\\n<p data-time=\\\"153.482\\\">from studies involving fish and other animals.</p>\\n<p data-time=\\\"158.090\\\">There is evidence that microplastics harm small creatures in a variety of</p>\\n<p data-time=\\\"163.572\\\">ways, such as by damaging their mouths, or by impairing their ability to feed.</p>\\n<p data-time=\\\"170.030\\\">For example, when microplastics get lodged in their digestive system.</p>\\n<p data-time=\\\"176.490\\\">Surprisingly, perhaps it is likely that humans consume microplastics.</p>\\n<p data-time=\\\"181.470\\\">As these have been detected in a wide range of food and drink products,</p>\\n<p data-time=\\\"185.556\\\">including bottled water, as well as in water that comes direct from the tap.</p>\\n<p data-time=\\\"190.710\\\">What\\\\'s more, salt and many kinds of seafood</p>\\n<p data-time=\\\"193.879\\\">have also been found to contain microplastics.</p>\\n<p data-time=\\\"198.270\\\">However, it\\\\'s important to underline that there is not yet</p>\\n<p data-time=\\\"202.325\\\">conclusive proof that microplastics cause significant harm to people.</p>\\n<p data-time=\\\"208.370\\\">In many countries, including here in the UK, there is legislation which prevents</p>\\n<p data-time=\\\"214.058\\\">manufacturers from adding plastic microbeads to shower gels, facial cleansers and toothpaste.</p>\\n<p data-time=\\\"220.671\\\">It is very difficult to accurately estimate the total amount of</p>\\n<p data-time=\\\"225.612\\\">microplastic particles in the soil as they can be hard to detect.</p>\\n<p data-time=\\\"231.450\\\">But we do know they are carried in the air and deposited in the soil by rain.</p>\\n<p data-time=\\\"237.350\\\">What\\\\'s more, many of the fertilizers used by</p>\\n<p data-time=\\\"240.785\\\">both farmers and gardeners contain microplastics.</p>\\n<p data-time=\\\"249.270\\\">A team from the Anglia Ruskin University in Cambridge has carried out a</p>\\n<p data-time=\\\"254.245\\\">study of the effects of microplastics on the digestive tracks of earthworms.</p>\\n<p data-time=\\\"260.130\\\">These worms, which live in top soil, are an</p>\\n<p data-time=\\\"263.255\\\">essential component of our agricultural system.</p>\\n<p data-time=\\\"267.790\\\">By feeding on soil, they mix nutrients into it, thereby making it more fertile.</p>\\n<p data-time=\\\"274.930\\\">The researchers set out to discover whether the introduction of microplastics into the soil and the</p>\\n<p data-time=\\\"281.536\\\">subsequent ingestion of these by earthworms would impact soil quality and ultimately inhibit plant growth.</p>\\n<p data-time=\\\"289.450\\\">The short answer was yes, it did.</p>\\n<p data-time=\\\"291.770\\\">After placing three different types of microplastic</p>\\n<p data-time=\\\"295.260\\\">particles into the soil, they planted perennial rye grass.</p>\\n<p data-time=\\\"300.070\\\">The particles of microplastic, which included biodegradable PLA and conventional</p>\\n<p data-time=\\\"305.626\\\">high density p
