\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t8\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p8s0\\\" class=\\\"vi-sent\\\">Tuy nhiên, dù nó được sử dụng vào mục đích gì thì nó cũng sẽ không bao giờ tốt bằng đồ thật. \\u003c/span>\\u003cspan id=\\\"p8s1\\\" class=\\\"vi-sent\\\">Ngay cả khi công nghệ biến đổi giọng nói mô phỏng giọng nói của người nói, cử động môi của họ sẽ không khớp và trông giống như đang ở trong một bộ phim lồng tiếng. \\u003c/span>\\u003cspan id=\\\"p8s2\\\" class=\\\"vi-sent\\\">Sự tương phản sẽ nhấn mạnh giá trị của các ngôn ngữ được chia sẻ và giá trị của việc học chúng. \\u003c/span>\\u003cspan id=\\\"p8s3\\\" class=\\\"vi-sent\\\">Việc chia sẻ một ngôn ngữ có thể thúc đẩy cảm giác thân thuộc và cộng đồng, giống như trường hợp các nhà khoa học quốc tế sử dụng tiếng Anh làm ngôn ngữ chung, trong khi những người tiền nhiệm của họ sử dụng tiếng Latin. \\u003c/span>\\u003cspan id=\\\"p8s4\\\" class=\\\"vi-sent\\\">Mặc dù nhu cầu thực tế về một ngôn ngữ chung sẽ giảm đi nhưng giá trị xã hội của việc chia sẻ ngôn ngữ chung sẽ vẫn tồn tại. \\u003c/span>\\u003cspan id=\\\"p8s5\\\" class=\\\"vi-sent\\\">Và phần mềm sẽ không bao giờ có thể thay thế được sự hiểu biết tinh tế nhưng quan trọng đi kèm với kiến ​​thức về một ngôn ngữ. \\u003c/span>\\u003c/div>\\u003c/div>\\u003c/div>\",\"headingsHtml\":\"\",\"qs\":[{\"id\":27,\"type\":\"mcq\",\"text\":\"What does the reader learn about the conversation in the first paragraph?\",\"options\":[\"A   The speakers are communicating in different languages.\",\"B   Neither of the speakers is familiar with their environment.\",\"C   The topic of the conversation is difficult for both speakers.\",\"D   Aspects of the conversation are challenging for both speakers.\"],\"correctAnswer\":\"D\",\"location\":\"\",\"_orderId\":27},{\"id\":28,\"type\":\"mcq\",\"text\":\"What assists the electronic translator during lectures at Karlsruhe Institute of Technology?\",\"options\":[\"A   the repeated content of lectures\",\"B   the students’ reading skills\",\"C   the languages used\",\"D   the lecturers’ technical ability\"],\"correctAnswer\":\"A\",\"location\":\"\",\"_orderId\":28},{\"id\":29,\"type\":\"mcq\",\"text\":\"When referring to The Hitchhiker’s Guide to the Galaxy, the writer suggests that\",\"options\":[\"A   the Babel fish was considered undesirable at the time.\",\"B   this book was not seriously intending to predict the future.\",\"C   artificial speech translation was not a surprising development.\",\"D   some speech translation techniques are better than others.\"],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":29},{\"id\":30,\"type\":\"mcq\",\"text\":\"What does the writer say about sharing earpieces?\",\"options\":[\"A   It is something people will get used to doing.\",\"B   The reluctance to do this is understandable.\",\"C   The equipment will be unnecessary in the future.\",\"D   It is something few people need to worry about.\"],\"correctAnswer\":\"B\",\"location\":\"\",\"_orderId\":30},{\"type\":\"summary\",\"isFeature\":true,\"id\":31,\"text\":\"Speech translation methods are developing fast in Japan 31 ....\\nTV interviews that use translation voiceover methods are successful 32 ...\\nFuture translation systems should address people appropriately 33 ...\\nUsers may be able to maintain their local customs 34 ...\",\"gapIds\":[31,32,33,34],\"options\":[\"A   but there are concerns about this.\",\"B   as systems do not need to conform to standard practices.\",\"C   but they are far from perfect.\",\"D   despite the noise issues.\",\"E   because translation is immediate.\",\"F   and have an awareness of good manners.\"],\"answers\":{\"31\":\"C\",\"32\":\"E\",\"33\":\"F\",\"34\":\"B\"},\"locations\":{},\"_orderId\":31},{\"id\":35,\"type\":\"ynng\",\"text\":\"Language translation systems will be seen as very useful throughout the academic and professional worlds.\",\"options\":[],\"correctAnswer\":\"NO\",\"location\":\"\",\"_orderId\":35},{\"id\":36,\"type\":\"ynng\",\"text\":\"The overall value of automated translation to family life is yet to be shown.\",\"options\":[],\"correctAnswer\":\"YES\",\"location\":\"\",\"_orderId\":36},{\"id\":37,\"type\":\"ynng\",\"text\":\"Automated translation could make life more difficult for immigrant families.\",\"options\":[],\"correctAnswer\":\"NO\",\"location\":\"\",\"_orderId\":37},{\"id\":38,\"type\":\"ynng\",\"text\":\"Visual aspects of language translation are being considered by scientists.\",\"options\":[],\"correctAnswer\":\"NOT GIVEN\",\"location\":\"\",\"_orderId\":38},{\"id\":39,\"type\":\"ynng\",\"text\":\"International scientists have found English easier to translate into other languages than Latin.\",\"options\":[],\"correctAnswer\":\"NOT GIVEN\",\"location\":\"\",\"_orderId\":39},{\"id\":40,\"type\":\"ynng\",\"text\":\"As far as language is concerned, there is a difference between people’s social and practical needs.\",\"options\":[],\"correctAnswer\":\"YES\",\"location\":\"\",\"_orderId\":40}],\"vocab\":[],\"headings\":[],\"headingKey\":{},\"mifRange\":\"\",\"removeOpt\":false,\"removeFeatureOpt\":true,\"pairs\":[],\"pData\":[{\"en\":[\"Noise, Alex Waibel tells me, is one of the major challenges that artificial speech translation has to meet.\",\"A device may be able to recognize speech in a laboratory, or a meeting room, but will struggle to cope with the kind of background noise I can hear in my office surrounding Professor Waibel as he speaks to me from Kyoto station in Japan.\",\"I’m struggling to follow him in English, on a scratchy line that reminds me we are nearly 10,000 kilometers apart – and that distance is still an obstacle to communication even if you’re speaking the same language, as we are.\",\"We haven’t reached the future yet.\",\"If we had, Waibel would have been able to speak more comfortably in his native German and I would have been able to hear his words in English.\"],\"vi\":[\"Tiếng ồn, Alex Waibel nói với tôi, là một trong những thách thức lớn mà dịch thuật giọng nói nhân tạo phải gặp phải.\",\"Một thiết bị có thể nhận dạng giọng nói trong phòng thí nghiệm hoặc phòng họp, nhưng sẽ gặp khó khăn trong việc đối phó với loại tiếng ồn xung quanh mà tôi có thể nghe thấy trong văn phòng xung quanh Giáo sư Waibel khi ông nói chuyện với tôi từ ga Kyoto, Nhật Bản.\",\"Tôi đang cố gắng theo dõi anh ấy bằng tiếng Anh, trên một đường ranh giới khó hiểu khiến tôi nhớ rằng chúng tôi cách nhau gần 10.000 km - và khoảng cách đó vẫn là một trở ngại trong giao tiếp ngay cả khi bạn đang nói cùng một ngôn ngữ như chúng tôi.\",\"Chúng ta vẫn chưa đạt tới tương lai.\",\"Nếu chúng tôi làm vậy, Waibel đã có thể nói thoải mái hơn bằng tiếng Đức mẹ đẻ của anh ấy và tôi đã có thể nghe được những lời anh ấy nói bằng tiếng Anh.\"]},{\"en\":[\"At Karlsruhe Institute of Technology, where he is a professor of computer science, Waibel and his colleagues already give lectures in German that their students can follow in English via an electronic translator.\",\"The system generates text that students can read on their laptops or phones, so the process is somewhat similar to subtitling.\",\"It helps that lecturers speak clearly, don’t have to compete with background chatter, and say much the same thing each year.\"],\"vi\":[\"Tại Viện Công nghệ Karlsruhe, nơi ông là giáo sư khoa học máy tính, Waibel và các đồng nghiệp của ông đã giảng bài bằng tiếng Đức mà sinh viên của họ có thể theo dõi bằng tiếng Anh thông qua một dịch giả điện tử.\",\"Hệ thống tạo ra văn bản mà sinh viên có thể đọc trên máy tính xách tay hoặc điện thoại của họ, vì vậy quá trình này tương tự như phụ đề.\",\"Nó giúp giảng viên nói rõ ràng, không phải cạnh tranh với những câu chuyện phiếm và nói nhiều điều giống nhau mỗi năm.\"]},{\"en\":[\"The idea of artificial speech translation has been around for a long time.\",\"Douglas Adams’ science fiction novel, The Hitchhiker’s Guide to the Galaxy, published in 1979, featured a life form called the ‘Babel fish’ which, when placed in the ear, enabled a listener to understand any language in the universe.\",\"It came to represent one of those devices that technology enthusiasts dream of long before they become practically realizable, like TVs flat enough to hang on walls: objects that we once could only dream of having but that are now commonplace.\",\"Now devices that look like prototype Babel fish have started to appear, riding a wave of advances in artificial translation and voice recognition.\"],\"vi\":[\"Ý tưởng dịch giọng nói nhân tạo đã có từ lâu.\",\"Cuốn tiểu thuyết khoa học viễn tưởng của Douglas Adams, Hướng dẫn về thiên hà của Hitchhiker, xuất bản năm 1979, có một dạng sống gọi là 'cá Babel' mà khi đặt vào tai sẽ giúp người nghe hiểu được bất kỳ ngôn ngữ nào trong vũ trụ.\",\"Nó đại diện cho một trong những thiết bị mà những người đam mê công nghệ mơ ước từ rất lâu trước khi chúng trở thành hiện thực, chẳng hạn như những chiếc TV đủ phẳng để treo trên tường: những đồ vật mà trước đây chúng ta chỉ có thể mơ ước có được nhưng giờ đây chúng đã trở nên phổ biến.\",\"Giờ đây, các thiết bị trông giống nguyên mẫu cá Babel đã bắt đầu xuất hiện, thúc đẩy làn sóng tiến bộ trong dịch thuật nhân tạo và nhận dạng giọng nói.\"]},{\"en\":[\"At this stage, however, they seem to be regarded as eye-catching novelties rather than steps towards what Waibel calls ‘making a language-transparent society.’ They tend to be domestic devices or applications suitable for hotel check-ins, for example, providing a practical alternative to speaking traveler’s English.\",\"The efficiency of the translator is less important than the social function.\",\"However, ‘Professionals are less inclined to be patient in a conversation,’ founder and CEO at Waverly Labs, Andrew Ochoa, observes.\",\"To redress this, Waverly is now preparing a new model for professional applications, which entails performance improvements in speech recognition, translation accuracy and the time it takes to deliver the translated speech.\"],\"vi\":[\"Tuy nhiên, ở giai đoạn này, chúng dường như được coi là những điểm mới lạ bắt mắt hơn là những bước tiến tới cái mà Waibel gọi là 'tạo nên một xã hội minh bạch về ngôn ngữ'. Chúng có xu hướng trở thành các thiết bị hoặc ứng dụng trong nhà phù hợp cho việc đăng ký khách sạn, chẳng hạn như cung cấp giải pháp thay thế thực tế cho việc nói tiếng Anh của khách du lịch.\",\"Hiệu quả của người phiên dịch không quan trọng bằng chức năng xã hội.\",\"Tuy nhiên, Andrew Ochoa, người sáng lập và Giám đốc điều hành tại Waverly Labs, nhận xét: “Các chuyên gia ít có xu hướng kiên nhẫn trong một cuộc trò chuyện”.\",\"Để khắc phục điều này, Waverly hiện đang chuẩn bị một mô hình mới cho các ứng dụng chuyên nghiệp, đòi hỏi phải cải thiện hiệu suất trong nhận dạng giọng nói, độ chính xác của bản dịch và thời gian cần thiết để chuyển lời nói đã dịch.\"]},{\"en\":[\"For a conversation, both speakers need to have devices called Pilots (translator earpieces) in their ears. ‘We find that there’s a barrier with sharing one of the earphones with a stranger,’ says Ochoa.\",\"That can’t have been totally unexpected.\",\"The problem would be solved if earpiece translators became sufficiently prevalent that strangers would be likely to already have their own in their ears.\",\"Whether that happens, and how quickly, will probably depend not so much on the earpieces themselves, but on the prevalence of voice-controlled devices and artificial translation in general.\"],\"vi\":[\"Để trò chuyện, cả hai người nói đều cần có thiết bị gọi là Pilots (tai nghe phiên dịch) trong tai. Ochoa nói: “Chúng tôi nhận thấy rằng có một rào cản khi chia sẻ một trong các tai nghe với người lạ.\",\"Điều đó không thể hoàn toàn bất ngờ được.\",\"Vấn đề sẽ được giải quyết nếu máy dịch tai nghe trở nên phổ biến đến mức những người lạ có thể đã có tai nghe riêng của họ.\",\"Liệu điều đó có xảy ra hay không và nhanh như thế nào, có lẽ sẽ không phụ thuộc nhiều vào bản thân tai nghe mà phụ thuộc vào sự phổ biến của các thiết bị điều khiển bằng giọng nói và dịch thuật nhân tạo nói chung.\"]},{\"en\":[\"Waibel highlights the significance of certain Asian nations, noting that voice translation has really taken off in countries such as Japan with a range of systems.\",\"There is still a long way to go, though.\",\"A translation system needs to be simultaneous, like the translator’s voice speaking over the foreign politician being interviewed on the TV, rather than in sections that oblige speakers to pause after every few remarks and wait for the translation to be delivered.\",\"It needs to work offline, for situations where internet access isn’t possible, and to address apprehensions about the amount of private speech data accumulating in the cloud, having been sent to servers for processing.\"],\"vi\":[\"Waibel nhấn mạnh tầm quan trọng của một số quốc gia châu Á, lưu ý rằng dịch thuật giọng nói đã thực sự phát triển ở các quốc gia như Nhật Bản với nhiều hệ thống khác nhau.\",\"Tuy nhiên, vẫn còn một chặng đường dài để đi.\",\"Hệ thống dịch thuật cần phải diễn ra đồng thời, giống như giọng nói của người phiên dịch nói trong lúc chính trị gia nước ngoài đang được phỏng vấn trên TV, thay vì theo từng phần bắt buộc người nói phải tạm dừng sau mỗi vài nhận xét và chờ bản dịch được chuyển giao.\",\"Nó cần phải hoạt động ngoại tuyến trong các trường hợp không thể truy cập Internet và giải quyết những lo ngại về lượng dữ liệu giọng nói riêng tư tích lũy trên đám mây đã được gửi đến máy chủ để xử lý.\"]},{\"en\":[\"Systems not only need to cope with physical challenges such as noise, they will also need to be socially aware by addressing people in the right way.\",\"Some cultural traditions demand solemn respect for academic status, for example, and it is only polite to respect this.\",\"Etiquette-sensitive artificial translators could relieve people of the need to know these differing cultural norms.\",\"At the same time, they might help to preserve local customs, slowing the spread of habits associated with international English, such as its readiness to get on first-name terms.\"],\"vi\":[\"Các hệ thống không chỉ cần đối phó với những thách thức vật lý như tiếng ồn, mà chúng còn cần phải có nhận thức xã hội bằng cách giải quyết vấn đề với mọi người một cách đúng đắn.\",\"Ví dụ, một số truyền thống văn hóa yêu cầu sự tôn trọng trang trọng đối với địa vị học thuật, và việc tôn trọng điều này là lịch sự.\",\"Các dịch giả nhân tạo nhạy cảm với nghi thức xã giao có thể giúp mọi người không cần phải biết những chuẩn mực văn hóa khác nhau này.\",\"Đồng thời, chúng có thể giúp bảo tồn phong tục địa phương, làm chậm sự lây lan của các thói quen liên quan đến tiếng Anh quốc tế, chẳng hạn như việc sẵn sàng sử dụng tên riêng.\"]},{\"en\":[\"Professors and other professionals will not outsource language awareness to software, though.\",\"If the technology matures into seamless, ubiquitous artificial speech translation, it will actually add value to language skills.\",\"Whether it will help people conduct their family lives or relationships is open to question—though one noteworthy possibility is that it could overcome the language barriers that often arise between generations after migration, leaving children and their grandparents without a shared language.\"],\"vi\":[\"Tuy nhiên, các giáo sư và các chuyên gia khác sẽ không thuê phần mềm nhận thức ngôn ngữ.\",\"Nếu công nghệ này phát triển thành dịch thuật giọng nói nhân tạo liền mạch, phổ biến, nó sẽ thực sự tăng thêm giá trị cho kỹ năng ngôn ngữ.\",\"Liệu nó có giúp mọi người tiến hành cuộc sống gia đình hay các mối quan hệ hay không vẫn còn là một câu hỏi - mặc dù một khả năng đáng chú ý là nó có thể vượt qua các rào cản ngôn ngữ thường nảy sinh giữa các thế hệ sau khi di cư, khiến con cái và ông bà của họ không có ngôn ngữ chung.\"]},{\"en\":[\"Whatever uses it is put to, though, it will never be as good as the real thing.\",\"Even if voice-morphing technology simulates the speaker’s voice, their lip movements won’t match, and they will look like they are in a dubbed movie.\",\"The contrast will underline the value of shared languages, and the value of learning them.\",\"Sharing a language can promote a sense of belonging and community, as with the international scientists who use English as a lingua franca, where their predecessors used Latin.\",\"Though the practical need for a common language will diminish, the social value of sharing one will persist.\",\"And software will never be a substitute for the subtle but vital understanding that comes with knowledge of a language.\"],\"vi\":[\"Tuy nhiên, dù nó được sử dụng vào mục đích gì thì nó cũng sẽ không bao giờ tốt bằng đồ thật.\",\"Ngay cả khi công nghệ biến đổi giọng nói mô phỏng giọng nói của người nói, cử động môi của họ sẽ không khớp và trông giống như đang ở trong một bộ phim lồng tiếng.\",\"Sự tương phản sẽ nhấn mạnh giá trị của các ngôn ngữ được chia sẻ và giá trị của việc học chúng.\",\"Việc chia sẻ một ngôn ngữ có thể thúc đẩy cảm giác thân thuộc và cộng đồng, giống như trường hợp các nhà khoa học quốc tế sử dụng tiếng Anh làm ngôn ngữ chung, trong khi những người tiền nhiệm của họ sử dụng tiếng Latin.\",\"Mặc dù nhu cầu thực tế về một ngôn ngữ chung sẽ giảm đi nhưng giá trị xã hội của việc chia sẻ ngôn ngữ chung sẽ vẫn tồn tại.\",\"Và phần mềm sẽ không bao giờ có thể thay thế được sự hiểu biết tinh tế nhưng quan trọng đi kèm với kiến ​​thức về một ngôn ngữ.\"]}],\"timeLimit\":20},{\"name\":\"CAM 19 TEST 4 (P1)\",\"articleHtml\":\"\\u003cdiv class=\\\"reading-content\\\">\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph A\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s0\\\">According to conservationists, populations of around two thirds of butterfly species have declined in Britain over the past 40 years. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s1\\\">If this trend continues, it might have unpredictable knock-on effects for other species in the ecosystem. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s2\\\">Butterfly eggs develop into caterpillars and these insects, which are the second stage in a new butterfly’s lifecycle, consume vast quantities of plant material, and in turn act as prey for birds as well as bats and other small mammals. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s3\\\">Only by arming themselves with an understanding of why butterfly numbers are down can conservationists hope to halt or reverse the decline. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t0')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t0\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p0s0\\\" class=\\\"vi-sent\\\">Theo các nhà bảo tồn, quần thể khoảng 2/3 số loài bướm đã giảm ở Anh trong 40 năm qua. \\u003c/span>\\u003cspan id=\\\"p0s1\\\" class=\\\"vi-sent\\\">Nếu xu hướng này tiếp tục, nó có thể gây ra những tác động dây chuyền khó lường đối với các loài khác trong hệ sinh thái. \\u003c/span>\\u003cspan id=\\\"p0s2\\\" class=\\\"vi-sent\\\">Trứng bướm phát triển thành sâu bướm và những loài côn trùng này, là giai đoạn thứ hai trong vòng đời của loài bướm mới, tiêu thụ một lượng lớn nguyên liệu thực vật và từ đó trở thành con mồi cho các loài chim cũng như dơi và các động vật có vú nhỏ khác. \\u003c/span>\\u003cspan id=\\\"p0s3\\\" class=\\\"vi-sent\\\">Chỉ bằng cách trang bị cho mình sự hiểu biết về lý do tại sao số lượng bướm lại giảm thì các nhà bảo tồn mới có thể hy vọng ngăn chặn hoặc đảo ngược sự suy giảm này. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph B\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s0\\\">Butterflies prefer outdoor conditions to be ‘just right’, which means neither too hot nor too cold. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s1\\\">Under the conditions of climate change, the temperature at any given time in summer is generally getting warmer, leaving butterflies with the challenge of how to deal with this. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s2\\\">One of the main ways in which species are ensuring conditions suit them is by changing the time of year at which they are active and reproduce. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s3\\\">Scientists refer to the timing of such lifecycle events as ‘phenology’, so when an animal or plant starts to do something earlier in the year than it usually does, it is said to be ‘advancing its phenology’. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t1')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t1\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p1s0\\\" class=\\\"vi-sent\\\">Bướm thích điều kiện ngoài trời ‘vừa phải’, nghĩa là không quá nóng cũng không quá lạnh. \\u003c/span>\\u003cspan id=\\\"p1s1\\\" class=\\\"vi-sent\\\">Trong điều kiện biến đổi khí hậu, nhiệt độ tại bất kỳ thời điểm nào trong mùa hè nhìn chung đều ấm hơn, khiến loài bướm phải đối mặt với thách thức về cách đối phó với điều này. \\u003c/span>\\u003cspan id=\\\"p1s2\\\" class=\\\"vi-sent\\\">Một trong những cách chính để các loài đảm bảo điều kiện phù hợp với chúng là thay đổi thời gian trong năm mà chúng hoạt động và sinh sản. \\u003c/span>\\u003cspan id=\\\"p1s3\\\" class=\\\"vi-sent\\\">Các nhà khoa học gọi thời gian của các sự kiện trong vòng đời như vậy là 'hiện tượng học', vì vậy khi một động vật hoặc thực vật bắt đầu làm điều gì đó sớm hơn trong năm so với thường lệ, điều đó được cho là đang 'tiến bộ hiện tượng học'. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph C\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s0\\\">These advances have been observed already in a wide range of butterflies – indeed, most species are advancing their phenology to some extent. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s1\\\">In Britain, as the average spring temperature has increased by roughly 0.5°C over the past 20 years, species have advanced by between three days and a week on average, to keep in line with cooler temperatures. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s2\\\">Is this a sign that butterflies are well equipped to cope with climate change, and readily adjust to new temperatures? \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s3\\\">Or are these populations under stress, being dragged along unwillingly by unnaturally fast changes? \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s4\\\">The answer is still unknown, but a new study is seeking to answer these questions. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t2')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t2\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p2s0\\\" class=\\\"vi-sent\\\">Những tiến bộ này đã được quan sát thấy ở nhiều loài bướm - thực sự, hầu hết các loài đều đang tiến bộ về hiện tượng học ở một mức độ nào đó. \\u003c/span>\\u003cspan id=\\\"p2s1\\\" class=\\\"vi-sent\\\">Ở Anh, khi nhiệt độ trung bình vào mùa xuân đã tăng khoảng 0,5°C trong 20 năm qua, các loài đã tăng thêm trung bình từ ba ngày đến một tuần để phù hợp với nhiệt độ mát hơn. \\u003c/span>\\u003cspan id=\\\"p2s2\\\" class=\\\"vi-sent\\\">Đây có phải là dấu hiệu cho thấy loài bướm được trang bị tốt để đối phó với biến đổi khí hậu và sẵn sàng thích nghi với nhiệt độ mới? \\u003c/span>\\u003cspan id=\\\"p2s3\\\" class=\\\"vi-sent\\\">Hay những quần thể này đang bị căng thẳng, bị kéo theo một cách bất đắc dĩ bởi những thay đổi nhanh chóng bất thường? \\u003c/span>\\u003cspan id=\\\"p2s4\\\" class=\\\"vi-sent\\\">Câu trả lời vẫn chưa được biết, nhưng một nghiên cứu mới đang tìm cách trả lời những câu hỏi này. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph D\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s0\\\">First, the researchers pulled together data from millions of records that had been submitted by butterfly enthusiasts – people who spend their free time observing the activities of different species. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s1\\\">This provided information on 130 species of butterflies in Great Britain every year for a 20-year period. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s2\\\">They then estimated the abundance and distribution of each species across this time, along with how far north in the country they had moved. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s3\\\">The data also, crucially, allowed researchers to estimate subtle changes in what time of the year each species was changing into an adult butterfly. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t3')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t3\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p3s0\\\" class=\\\"vi-sent\\\">Đầu tiên, các nhà nghiên cứu tập hợp dữ liệu từ hàng triệu hồ sơ được gửi bởi những người đam mê bướm – những người dành thời gian rảnh rỗi để quan sát hoạt động của các loài khác nhau. \\u003c/span>\\u003cspan id=\\\"p3s1\\\" class=\\\"vi-sent\\\">Điều này cung cấp thông tin về 130 loài bướm ở Anh mỗi năm trong khoảng thời gian 20 năm. \\u003c/span>\\u003cspan id=\\\"p3s2\\\" class=\\\"vi-sent\\\">Sau đó, họ ước tính sự phong phú và phân bố của từng loài trong thời gian này, cùng với khoảng cách chúng đã di chuyển về phía bắc của đất nước. \\u003c/span>\\u003cspan id=\\\"p3s3\\\" class=\\\"vi-sent\\\">Điều quan trọng là dữ liệu cũng cho phép các nhà nghiên cứu ước tính những thay đổi tinh tế về thời điểm mỗi loài biến đổi thành bướm trưởng thành trong năm. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph E\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s0\\\">Analyzing the trends in each variable, the researchers discovered that species with more flexible lifecycles were more likely to be able to benefit from an earlier emergence driven by climate change. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s1\\\">Some species are able to go from caterpillar to butterfly twice or more per year, so that the individual butterflies you see flying in the spring are the grandchildren or great-grandchildren of the individuals seen a year previously. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t4')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t4\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p4s0\\\" class=\\\"vi-sent\\\">Phân tích xu hướng của từng biến số, các nhà nghiên cứu phát hiện ra rằng các loài có vòng đời linh hoạt hơn có nhiều khả năng được hưởng lợi từ sự xuất hiện sớm hơn do biến đổi khí hậu. \\u003c/span>\\u003cspan id=\\\"p4s1\\\" class=\\\"vi-sent\\\">Một số loài có thể chuyển từ sâu bướm sang bướm hai lần hoặc nhiều hơn mỗi năm, do đó, những con bướm riêng lẻ mà bạn nhìn thấy bay vào mùa xuân là cháu hoặc chắt của những cá thể được nhìn thấy một năm trước đó. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph F\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s0\\\">Among these species, researchers observed that those which have been advancing their phenology the most over the 20-year study period also had the most positive trends in abundance, distribution and northwards extent. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s1\\\">For these species, such as Britain’s tiniest butterfly, the dainty Small Blue, whose colonies are up to a hundred strong, some develop into butterflies early in spring, allowing their summer generations to complete another reproductive cycle by autumn so that more population growth occurs. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t5')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t5\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p5s0\\\" class=\\\"vi-sent\\\">Trong số các loài này, các nhà nghiên cứu quan sát thấy rằng những loài có tiến bộ về vật hậu học nhiều nhất trong thời gian nghiên cứu 20 năm cũng có xu hướng tích cực nhất về sự phong phú, phân bố và phạm vi tiến về phía bắc. \\u003c/span>\\u003cspan id=\\\"p5s1\\\" class=\\\"vi-sent\\\">Đối với những loài này, chẳng hạn như loài bướm nhỏ nhất nước Anh, loài bướm xanh nhỏ xinh xắn, có đàn lên đến hàng trăm con mạnh mẽ, một số phát triển thành bướm vào đầu mùa xuân, cho phép các thế hệ mùa hè của chúng hoàn thành một chu kỳ sinh sản khác vào mùa thu để số lượng tăng lên nhiều hơn. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph G\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s0\\\">Other species, however, are less flexible and restricted to a single reproductive cycle per year. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s1\\\">For these species, there was no evidence of any benefit to emerging earlier. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s2\\\">Indeed, worryingly, it was found that the species in this group that specialize in very specific habitat types, often related to the caterpillar’s preferred diet, actually tended to be most at harm from advancing phenology. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s3\\\">The beautiful High Brown Fritillary, often described as Britain’s most endangered butterfly, is in this group. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s4\\\">It is found only in coppiced woodland and limestone pavement habitats. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s5\\\">It is also a single-generation butterfly that has advanced its phenology. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s6\\\">This suggests that climate change, while undoubtedly not the sole cause, might have played a part in the downfall of this species. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t6')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t6\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p6s0\\\" class=\\\"vi-sent\\\">Tuy nhiên, các loài khác kém linh hoạt hơn và bị giới hạn trong một chu kỳ sinh sản duy nhất mỗi năm. \\u003c/span>\\u003cspan id=\\\"p6s1\\\" class=\\\"vi-sent\\\">Đối với những loài này, không có bằng chứng nào về lợi ích của việc xuất hiện sớm hơn. \\u003c/span>\\u003cspan id=\\\"p6s2\\\" class=\\\"vi-sent\\\">Thật vậy, điều đáng lo ngại là người ta phát hiện ra rằng các loài trong nhóm này chuyên về các loại môi trường sống rất cụ thể, thường liên quan đến chế độ ăn ưa thích của sâu bướm, thực sự có xu hướng bị tổn hại nhiều nhất từ ​​sự tiến bộ của vật hậu học. \\u003c/span>\\u003cspan id=\\\"p6s3\\\" class=\\\"vi-sent\\\">Loài bướm High Brown Fritillary xinh đẹp, thường được mô tả là loài bướm có nguy cơ tuyệt chủng cao nhất ở Anh, nằm trong nhóm này. \\u003c/span>\\u003cspan id=\\\"p6s4\\\" class=\\\"vi-sent\\\">Nó chỉ được tìm thấy trong môi trường sống rừng thưa và vỉa hè đá vôi. \\u003c/span>\\u003cspan id=\\\"p6s5\\\" class=\\\"vi-sent\\\">Nó cũng là loài bướm một thế hệ đã phát triển hiện tượng học. \\u003c/span>\\u003cspan id=\\\"p6s6\\\" class=\\\"vi-sent\\\">Điều này cho thấy rằng biến đổi khí hậu, mặc dù chắc chắn không phải là nguyên nhân duy nhất, nhưng có thể đã góp phần vào sự suy giảm của loài này. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph H\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s0\\\">All is not lost, however. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s1\\\">Many of Britain’s single-generation species show the capacity, in continental Europe, to add a second generation in years that are sufficiently warm. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s2\\\">Therefore, as the climate continues to warm, species like the Silver-studded Blue might be able to switch to multiple generations in the UK as well, and so begin to extract benefits from the additional warmth, potentially leading to population increases. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t7')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t7\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p7s0\\\" class=\\\"vi-sent\\\">Tuy nhiên, tất cả không bị mất. \\u003c/span>\\u003cspan id=\\\"p7s1\\\" class=\\\"vi-sent\\\">Nhiều loài sinh vật một thế hệ ở Anh cho thấy khả năng ở lục địa châu Âu có thể sinh thêm thế hệ thứ hai trong những năm đủ ấm áp. \\u003c/span>\\u003cspan id=\\\"p7s2\\\" class=\\\"vi-sent\\\">Do đó, khi khí hậu tiếp tục ấm lên, các loài như Cá xanh có đốm bạc cũng có thể chuyển sang nhiều thế hệ ở Anh và do đó bắt đầu thu được lợi ích từ nhiệt độ tăng thêm, có khả năng dẫn đến tăng dân số. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph I\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s0\\\">More immediately, conservationists can arm themselves with all this knowledge to spot the warning signs of species that may be at risk. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s1\\\">The White Admiral of southern England, a much sought-after butterfly, experienced a significant increase in numbers from the 1920s but has shown a considerable decline in the past 20 years. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s2\\\">This may be because the caterpillar exists solely on a diet of a plant called honeysuckle. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s3\\\">But it is also likely to be due to climate change. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t8')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t8\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p8s0\\\" class=\\\"vi-sent\\\">Ngay lập tức hơn, các nhà bảo tồn có thể tự trang bị tất cả kiến ​​thức này để phát hiện các dấu hiệu cảnh báo về các loài có thể gặp nguy hiểm. \\u003c/span>\\u003cspan id=\\\"p8s1\\\" class=\\\"vi-sent\\\">Đô đốc trắng của miền nam nước Anh, loài bướm được nhiều người săn lùng, đã có sự gia tăng đáng kể về số lượng từ những năm 1920 nhưng đã cho thấy sự sụt giảm đáng kể trong 20 năm qua. \\u003c/span>\\u003cspan id=\\\"p8s2\\\" class=\\\"vi-sent\\\">Điều này có thể là do sâu bướm chỉ tồn tại nhờ chế độ ăn của một loại cây có tên là kim ngân hoa. \\u003c/span>\\u003cspan id=\\\"p8s3\\\" class=\\\"vi-sent\\\">Nhưng cũng có khả năng là do biến đổi khí hậu. \\u003c/span>\\u003c/div>\\u003c/div>\\u003c/div>\",\"headingsHtml\":\"\",\"qs\":[{\"id\":1,\"type\":\"tfng\",\"text\":\"Forty years ago, there were fewer butterflies in Britain than at present.\",\"options\":[],\"correctAnswer\":\"FALSE\",\"location\":\"\",\"_orderId\":1},{\"id\":2,\"type\":\"tfng\",\"text\":\"Caterpillars are eaten by a number of different predators.\",\"options\":[],\"correctAnswer\":\"TRUE\",\"location\":\"\",\"_orderId\":2},{\"id\":3,\"type\":\"tfng\",\"text\":\"‘Phenology’ is a term used to describe a creature’s ability to alter the location of a lifecycle event.\",\"options\":[],\"correctAnswer\":\"FALSE\",\"location\":\"\",\"_orderId\":3},{\"id\":4,\"type\":\"tfng\",\"text\":\"Some species of butterfly have a reduced lifespan due to spring temperature increases.\",\"options\":[],\"correctAnswer\":\"NOT GIVEN\",\"location\":\"\",\"_orderId\":4},{\"id\":5,\"type\":\"tfng\",\"text\":\"There is a clear reason for the adaptations that butterflies are making to climate change.\",\"options\":[],\"correctAnswer\":\"FALSE\",\"location\":\"\",\"_orderId\":5},{\"id\":6,\"type\":\"tfng\",\"text\":\"The data used in the study was taken from the work of amateur butterfly watchers.\",\"options\":[],\"correctAnswer\":\"TRUE\",\"location\":\"\",\"_orderId\":6},{\"type\":\"gap-fill-block\",\"id\":7,\"text\":\"Complete the notes below.\\nChoose \\u003cb>ONE WORD ONLY\\u003c/b> from the passage for each answer.\\nWrite your answers in boxes 7–13 on your answer sheet.\\n\\u003cb>Butterflies in the UK\\u003c/b>\\n\\u003cb>The Small Blue\\u003c/b>\\n●   lives in large 7……………….\\n●   first appears at the start of 8……………….\\n●   completes more than one reproductive cycle per year\\n\\u003cb>The High Brown Fritillary\\u003c/b>\\n●   has one reproductive cycle\\n●   is considered to be more 9………………. than other species\\n●   its caterpillars occupy a limited range of 10……………….\\n\\u003cb>The Silver-studded Blue\\u003c/b>\\n●   is already able to reproduce twice a year in warm areas of 11……………….\\nThe White Admiral\\n●   is found in 12………………. areas of England\\n●   both climate change and the 13………………. of the caterpillar are possible reasons for decline\",\"gapIds\":[7,8,9,10,11,12,13],\"answers\":{\"7\":\"colonies\",\"8\":\"spring\",\"9\":\"endangered\",\"10\":\"habitat(s)\",\"11\":\"Europe\",\"12\":\"southern\",\"13\":\"diet\"},\"locations\":{},\"_orderId\":7}],\"vocab\":[],\"headings\":[],\"headingKey\":{},\"mifRange\":\"\",\"removeOpt\":false,\"removeFeatureOpt\":false,\"pairs\":[],\"pData\":[{\"en\":[\"According to conservationists, populations of around two thirds of butterfly species have declined in Britain over the past 40 years.\",\"If this trend continues, it might have unpredictable knock-on effects for other species in the ecosystem.\",\"Butterfly eggs develop into caterpillars and these insects, which are the second stage in a new butterfly’s lifecycle, consume vast quantities of plant material, and in turn act as prey for birds as well as bats and other small mammals.\",\"Only by arming themselves with an understanding of why butterfly numbers are down can conservationists hope to halt or reverse the decline.\"],\"vi\":[\"Theo các nhà bảo tồn, quần thể khoảng 2/3 số loài bướm đã giảm ở Anh trong 40 năm qua.\",\"Nếu xu hướng này tiếp tục, nó có thể gây ra những tác động dây chuyền khó lường đối với các loài khác trong hệ sinh thái.\",\"Trứng bướm phát triển thành sâu bướm và những loài côn trùng này, là giai đoạn thứ hai trong vòng đời của loài bướm mới, tiêu thụ một lượng lớn nguyên liệu thực vật và từ đó trở thành con mồi cho các loài chim cũng như dơi và các động vật có vú nhỏ khác.\",\"Chỉ bằng cách trang bị cho mình sự hiểu biết về lý do tại sao số lượng bướm lại giảm thì các nhà bảo tồn mới có thể hy vọng ngăn chặn hoặc đảo ngược sự suy giảm này.\"]},{\"en\":[\"Butterflies prefer outdoor conditions to be ‘just right’, which means neither too hot nor too cold.\",\"Under the conditions of climate change, the temperature at any given time in summer is generally getting warmer, leaving butterflies with the challenge of how to deal with this.\",\"One of the main ways in which species are ensuring conditions suit them is by changing the time of year at which they are active and reproduce.\",\"Scientists refer to the timing of such lifecycle events as ‘phenology’, so when an animal or plant starts to do something earlier in the year than it usually does, it is said to be ‘advancing its phenology’.\"],\"vi\":[\"Bướm thích điều kiện ngoài trời ‘vừa phải’, nghĩa là không quá nóng cũng không quá lạnh.\",\"Trong điều kiện biến đổi khí hậu, nhiệt độ tại bất kỳ thời điểm nào trong mùa hè nhìn chung đều ấm hơn, khiến loài bướm phải đối mặt với thách thức về cách đối phó với điều này.\",\"Một trong những cách chính để các loài đảm bảo điều kiện phù hợp với chúng là thay đổi thời gian trong năm mà chúng hoạt động và sinh sản.\",\"Các nhà khoa học gọi thời gian của các sự kiện trong vòng đời như vậy là 'hiện tượng học', vì vậy khi một động vật hoặc thực vật bắt đầu làm điều gì đó sớm hơn trong năm so với thường lệ, điều đó được cho là đang 'tiến bộ hiện tượng học'.\"]},{\"en\":[\"These advances have been observed already in a wide range of butterflies – indeed, most species are advancing their phenology to some extent.\",\"In Britain, as the average spring temperature has increased by roughly 0.5°C over the past 20 years, species have advanced by between three days and a week on average, to keep in line with cooler temperatures.\",\"Is this a sign that butterflies are well equipped to cope with climate change, and readily adjust to new temperatures?\",\"Or are these populations under stress, being dragged along unwillingly by unnaturally fast changes?\",\"The answer is still unknown, but a new study is seeking to answer these questions.\"],\"vi\":[\"Những tiến bộ này đã được quan sát thấy ở nhiều loài bướm - thực sự, hầu hết các loài đều đang tiến bộ về hiện tượng học ở một mức độ nào đó.\",\"Ở Anh, khi nhiệt độ trung bình vào mùa xuân đã tăng khoảng 0,5°C trong 20 năm qua, các loài đã tăng thêm trung bình từ ba ngày đến một tuần để phù hợp với nhiệt độ mát hơn.\",\"Đây có phải là dấu hiệu cho thấy loài bướm được trang bị tốt để đối phó với biến đổi khí hậu và sẵn sàng thích nghi với nhiệt độ mới?\",\"Hay những quần thể này đang bị căng thẳng, bị kéo theo một cách bất đắc dĩ bởi những thay đổi nhanh chóng bất thường?\",\"Câu trả lời vẫn chưa được biết, nhưng một nghiên cứu mới đang tìm cách trả lời những câu hỏi này.\"]},{\"en\":[\"First, the researchers pulled together data from millions of records that had been submitted by butterfly enthusiasts – people who spend their free time observing the activities of different species.\",\"This provided information on 130 species of butterflies in Great Britain every year for a 20-year period.\",\"They then estimated the abundance and distribution of each species across this time, along with how far north in the country they had moved.\",\"The data also, crucially, allowed researchers to estimate subtle changes in what time of the year each species was changing into an adult butterfly.\"],\"vi\":[\"Đầu tiên, các nhà nghiên cứu tập hợp dữ liệu từ hàng triệu hồ sơ được gửi bởi những người đam mê bướm – những người dành thời gian rảnh rỗi để quan sát hoạt động của các loài khác nhau.\",\"Điều này cung cấp thông tin về 130 loài bướm ở Anh mỗi năm trong khoảng thời gian 20 năm.\",\"Sau đó, họ ước tính sự phong phú và phân bố của từng loài trong thời gian này, cùng với khoảng cách chúng đã di chuyển về phía bắc của đất nước.\",\"Điều quan trọng là dữ liệu cũng cho phép các nhà nghiên cứu ước tính những thay đổi tinh tế về thời điểm mỗi loài biến đổi thành bướm trưởng thành trong năm.\"]},{\"en\":[\"Analyzing the trends in each variable, the researchers discovered that species with more flexible lifecycles were more likely to be able to benefit from an earlier emergence driven by climate change.\",\"Some species are able to go from caterpillar to butterfly twice or more per year, so that the individual butterflies you see flying in the spring are the grandchildren or great-grandchildren of the individuals seen a year previously.\"],\"vi\":[\"Phân tích xu hướng của từng biến số, các nhà nghiên cứu phát hiện ra rằng các loài có vòng đời linh hoạt hơn có nhiều khả năng được hưởng lợi từ sự xuất hiện sớm hơn do biến đổi khí hậu.\",\"Một số loài có thể chuyển từ sâu bướm sang bướm hai lần hoặc nhiều hơn mỗi năm, do đó, những con bướm riêng lẻ mà bạn nhìn thấy bay vào mùa xuân là cháu hoặc chắt của những cá thể được nhìn thấy một năm trước đó.\"]},{\"en\":[\"Among these species, researchers observed that those which have been advancing their phenology the most over the 20-year study period also had the most positive trends in abundance, distribution and northwards extent.\",\"For these species, such as Britain’s tiniest butterfly, the dainty Small Blue, whose colonies are up to a hundred strong, some develop into butterflies early in spring, allowing their summer generations to complete another reproductive cycle by autumn so that more population growth occurs.\"],\"vi\":[\"Trong số các loài này, các nhà nghiên cứu quan sát thấy rằng những loài có tiến bộ về vật hậu học nhiều nhất trong thời gian nghiên cứu 20 năm cũng có xu hướng tích cực nhất về sự phong phú, phân bố và phạm vi tiến về phía bắc.\",\"Đối với những loài này, chẳng hạn như loài bướm nhỏ nhất nước Anh, loài bướm xanh nhỏ xinh xắn, có đàn lên đến hàng trăm con mạnh mẽ, một số phát triển thành bướm vào đầu mùa xuân, cho phép các thế hệ mùa hè của chúng hoàn thành một chu kỳ sinh sản khác vào mùa thu để số lượng tăng lên nhiều hơn.\"]},{\"en\":[\"Other species, however, are less flexible and restricted to a single reproductive cycle per year.\",\"For these species, there was no evidence of any benefit to emerging earlier.\",\"Indeed, worryingly, it was found that the species in this group that specialize in very specific habitat types, often related to the caterpillar’s preferred diet, actually tended to be most at harm from advancing phenology.\",\"The beautiful High Brown Fritillary, often described as Britain’s most endangered butterfly, is in this group.\",\"It is found only in coppiced woodland and limestone pavement habitats.\",\"It is also a single-generation butterfly that has advanced its phenology.\",\"This suggests that climate change, while undoubtedly not the sole cause, might have played a part in the downfall of this species.\"],\"vi\":[\"Tuy nhiên, các loài khác kém linh hoạt hơn và bị giới hạn trong một chu kỳ sinh sản duy nhất mỗi năm.\",\"Đối với những loài này, không có bằng chứng nào về lợi ích của việc xuất hiện sớm hơn.\",\"Thật vậy, điều đáng lo ngại là người ta phát hiện ra rằng các loài trong nhóm này chuyên về các loại môi trường sống rất cụ thể, thường liên quan đến chế độ ăn ưa thích của sâu bướm, thực sự có xu hướng bị tổn hại nhiều nhất từ ​​sự tiến bộ của vật hậu học.\",\"Loài bướm High Brown Fritillary xinh đẹp, thường được mô tả là loài bướm có nguy cơ tuyệt chủng cao nhất ở Anh, nằm trong nhóm này.\",\"Nó chỉ được tìm thấy trong môi trường sống rừng thưa và vỉa hè đá vôi.\",\"Nó cũng là loài bướm một thế hệ đã phát triển hiện tượng học.\",\"Điều này cho thấy rằng biến đổi khí hậu, mặc dù chắc chắn không phải là nguyên nhân duy nhất, nhưng có thể đã góp phần vào sự suy giảm của loài này.\"]},{\"en\":[\"All is not lost, however.\",\"Many of Britain’s single-generation species show the capacity, in continental Europe, to add a second generation in years that are sufficiently warm.\",\"Therefore, as the climate continues to warm, species like the Silver-studded Blue might be able to switch to multiple generations in the UK as well, and so begin to extract benefits from the additional warmth, potentially leading to population increases.\"],\"vi\":[\"Tuy nhiên, tất cả không bị mất.\",\"Nhiều loài sinh vật một thế hệ ở Anh cho thấy khả năng ở lục địa châu Âu có thể sinh thêm thế hệ thứ hai trong những năm đủ ấm áp.\",\"Do đó, khi khí hậu tiếp tục ấm lên, các loài như Cá xanh có đốm bạc cũng có thể chuyển sang nhiều thế hệ ở Anh và do đó bắt đầu thu được lợi ích từ nhiệt độ tăng thêm, có khả năng dẫn đến tăng dân số.\"]},{\"en\":[\"More immediately, conservationists can arm themselves with all this knowledge to spot the warning signs of species that may be at risk.\",\"The White Admiral of southern England, a much sought-after butterfly, experienced a significant increase in numbers from the 1920s but has shown a considerable decline in the past 20 years.\",\"This may be because the caterpillar exists solely on a diet of a plant called honeysuckle.\",\"But it is also likely to be due to climate change.\"],\"vi\":[\"Ngay lập tức hơn, các nhà bảo tồn có thể tự trang bị tất cả kiến ​​thức này để phát hiện các dấu hiệu cảnh báo về các loài có thể gặp nguy hiểm.\",\"Đô đốc trắng của miền nam nước Anh, loài bướm được nhiều người săn lùng, đã có sự gia tăng đáng kể về số lượng từ những năm 1920 nhưng đã cho thấy sự sụt giảm đáng kể trong 20 năm qua.\",\"Điều này có thể là do sâu bướm chỉ tồn tại nhờ chế độ ăn của một loại cây có tên là kim ngân hoa.\",\"Nhưng cũng có khả năng là do biến đổi khí hậu.\"]}],\"timeLimit\":20},{\"name\":\"CAM 19 TEST 4 (P3)\",\"articleHtml\":\"\\u003cdiv class=\\\"reading-content\\\">\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph A\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s0\\\">There has long been a general assumption that human beings are essentially selfish. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s1\\\">We’re apparently ruthless, with strong impulses to compete against each other for resources and to accumulate power and possessions. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s2\\\">If we are kind to one another, it’s usually because we have ulterior motives. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s3\\\">If we are good, it’s only because we have managed to control and transcend our innate selfishness and brutality. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t0')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t0\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p0s0\\\" class=\\\"vi-sent\\\">Từ lâu đã có một giả định chung rằng con người về bản chất là ích kỷ. \\u003c/span>\\u003cspan id=\\\"p0s1\\\" class=\\\"vi-sent\\\">Rõ ràng chúng ta là những người tàn nhẫn, có động lực mạnh mẽ để cạnh tranh với nhau để giành lấy tài nguyên cũng như tích lũy quyền lực và của cải. \\u003c/span>\\u003cspan id=\\\"p0s2\\\" class=\\\"vi-sent\\\">Nếu chúng ta tử tế với nhau, thường là vì chúng ta có những động cơ thầm kín. \\u003c/span>\\u003cspan id=\\\"p0s3\\\" class=\\\"vi-sent\\\">Nếu chúng ta tốt thì đó chỉ là do chúng ta đã kiểm soát được và vượt qua được tính ích kỷ và tàn bạo bẩm sinh của mình. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph B\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s0\\\">This bleak view of human nature is closely associated with the science writer Richard Dawkins, whose 1976 book The Selfish Gene became popular because it fitted so well with – and helped to justify – the competitive and individualistic ethos that was so prevalent in late 20th-century societies. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s1\\\">Like many others, Dawkins justifies his views with reference to the field of evolutionary psychology. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s2\\\">Evolutionary psychology theorises that present-day human traits developed in prehistoric times, during what is termed the ‘environment of evolutionary adaptedness’. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t1')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t1\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p1s0\\\" class=\\\"vi-sent\\\">Quan điểm ảm đạm này về bản chất con người gắn liền với nhà văn khoa học Richard Dawkins, người có cuốn sách The Selfish Gene năm 1976 trở nên nổi tiếng vì nó rất phù hợp – và giúp biện minh – cho đặc tính cạnh tranh và chủ nghĩa cá nhân vốn rất phổ biến ở các xã hội cuối thế kỷ 20. \\u003c/span>\\u003cspan id=\\\"p1s1\\\" class=\\\"vi-sent\\\">Giống như nhiều người khác, Dawkins biện minh cho quan điểm của mình bằng cách tham khảo lĩnh vực tâm lý học tiến hóa. \\u003c/span>\\u003cspan id=\\\"p1s2\\\" class=\\\"vi-sent\\\">Tâm lý học tiến hóa đưa ra giả thuyết rằng những đặc điểm của con người ngày nay đã phát triển từ thời tiền sử, trong thời kỳ được gọi là “môi trường thích nghi tiến hóa”. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph C\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s0\\\">Prehistory is usually seen as a period of intense competition, when life was such a brutal battle that only those with traits such as selfishness, aggression and ruthlessness survived. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s1\\\">And because survival depended on access to resources – such as rivers, forests and animals – there was bound to be conflict between rival groups, which led to the development of traits such as racism and warfare. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s2\\\">This seems logical. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s3\\\">But, in fact, the assumption on which this all rests – that prehistoric life was a desperate struggle for survival – is false. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t2')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t2\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p2s0\\\" class=\\\"vi-sent\\\">Thời tiền sử thường được coi là thời kỳ cạnh tranh khốc liệt, khi cuộc sống là một trận chiến tàn khốc đến mức chỉ những người có những đặc điểm như ích kỷ, hung hãn và tàn nhẫn mới sống sót. \\u003c/span>\\u003cspan id=\\\"p2s1\\\" class=\\\"vi-sent\\\">Và bởi vì sự sống còn phụ thuộc vào khả năng tiếp cận các nguồn tài nguyên - như sông, rừng và động vật - nên chắc chắn sẽ xảy ra xung đột giữa các nhóm đối thủ, dẫn đến sự phát triển các đặc điểm như phân biệt chủng tộc và chiến tranh. \\u003c/span>\\u003cspan id=\\\"p2s2\\\" class=\\\"vi-sent\\\">Điều này có vẻ hợp lý. \\u003c/span>\\u003cspan id=\\\"p2s3\\\" class=\\\"vi-sent\\\">Nhưng trên thực tế, giả định làm cơ sở cho tất cả những điều này - rằng cuộc sống thời tiền sử là một cuộc đấu tranh tuyệt vọng để sinh tồn - là sai lầm. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph D\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s0\\\">It’s important to remember that in the prehistoric era, the world was very sparsely populated. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s1\\\">According to some estimates, around 15,000 years ago, the population of Europe was only 29,000, and the population of the whole world was less than half a million. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s2\\\">Humans at that time were hunter-gatherers: people who lived by hunting wild animals and collecting wild plants. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s3\\\">With such small population densities, it seems unlikely that prehistoric hunter-gatherer groups had to compete against each other for resources or had any need to develop ruthlessness and competitiveness, or to go to war. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t3')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t3\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p3s0\\\" class=\\\"vi-sent\\\">Điều quan trọng cần nhớ là vào thời tiền sử, thế giới có dân số rất thưa thớt. \\u003c/span>\\u003cspan id=\\\"p3s1\\\" class=\\\"vi-sent\\\">Theo một số ước tính, khoảng 15.000 năm trước, dân số châu Âu chỉ có 29.000 người, còn dân số toàn thế giới chưa đến nửa triệu người. \\u003c/span>\\u003cspan id=\\\"p3s2\\\" class=\\\"vi-sent\\\">Con người thời đó là những người săn bắt hái lượm: con người sống bằng nghề săn bắt động vật hoang dã và thu thập thực vật hoang dã. \\u003c/span>\\u003cspan id=\\\"p3s3\\\" class=\\\"vi-sent\\\">Với mật độ dân số nhỏ như vậy, dường như các nhóm săn bắn hái lượm thời tiền sử không phải cạnh tranh với nhau để giành lấy tài nguyên hoặc có nhu cầu phát triển sự tàn nhẫn và cạnh tranh, hoặc gây chiến. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph E\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s0\\\">There is significant evidence to back this notion from contemporary hunter-gatherer groups, who live in the same way as prehistoric humans did. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s1\\\">As the anthropologist Bruce Knauft has remarked, hunter-gatherers are characterized by ‘extreme political and sexual egalitarianism’. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s2\\\">Knauft has observed that individuals in such groups don’t accumulate property or possessions and have an ethical obligation to share everything. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s3\\\">They also have methods of preserving egalitarianism by ensuring that disparities of status don’t arise. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t4')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t4\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p4s0\\\" class=\\\"vi-sent\\\">Có bằng chứng quan trọng ủng hộ quan điểm này từ các nhóm săn bắn hái lượm đương thời, những người sống giống như con người thời tiền sử. \\u003c/span>\\u003cspan id=\\\"p4s1\\\" class=\\\"vi-sent\\\">Như nhà nhân chủng học Bruce Knauft đã nhận xét, những người săn bắn hái lượm có đặc điểm là “chủ nghĩa quân bình về chính trị và tình dục cực đoan”. \\u003c/span>\\u003cspan id=\\\"p4s2\\\" class=\\\"vi-sent\\\">Knauft đã quan sát thấy rằng các cá nhân trong những nhóm như vậy không tích lũy tài sản hoặc của cải và có nghĩa vụ đạo đức là chia sẻ mọi thứ. \\u003c/span>\\u003cspan id=\\\"p4s3\\\" class=\\\"vi-sent\\\">Họ cũng có những phương pháp bảo tồn chủ nghĩa quân bình bằng cách đảm bảo rằng sự chênh lệch về địa vị không phát sinh. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph F\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s0\\\">The !Kung people of southern Africa, for example, swap arrows before going hunting and when an animal is killed, the acclaim does not go to the person who fired the arrow, but to the person the arrow belongs to. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s1\\\">And if a person becomes too domineering, the other members of the group ostracise them, exiling the offender from society. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s2\\\">Typically in such groups, men do not dictate what women do. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s3\\\">Women in hunter-gatherer groups worldwide often benefit from a high level of autonomy, being able to select their own marriage partners, decide what work they do and work whenever they choose to. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s4\\\">And if a marriage breaks down, they have custody rights over their children. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t5')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t5\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p5s0\\\" class=\\\"vi-sent\\\">Ví dụ, người !Kung ở miền nam châu Phi trao đổi mũi tên trước khi đi săn và khi một con vật bị giết, sự hoan nghênh không thuộc về người bắn mũi tên mà thuộc về người sở hữu mũi tên. \\u003c/span>\\u003cspan id=\\\"p5s1\\\" class=\\\"vi-sent\\\">Và nếu một người trở nên quá độc đoán, các thành viên khác trong nhóm sẽ tẩy chay họ, trục xuất người phạm tội ra khỏi xã hội. \\u003c/span>\\u003cspan id=\\\"p5s2\\\" class=\\\"vi-sent\\\">Thông thường trong những nhóm như vậy, đàn ông không ra lệnh cho phụ nữ làm gì. \\u003c/span>\\u003cspan id=\\\"p5s3\\\" class=\\\"vi-sent\\\">Phụ nữ trong các nhóm săn bắn hái lượm trên toàn thế giới thường được hưởng lợi từ mức độ tự chủ cao, có thể tự lựa chọn bạn đời, quyết định công việc họ làm và làm việc bất cứ khi nào họ chọn. \\u003c/span>\\u003cspan id=\\\"p5s4\\\" class=\\\"vi-sent\\\">Và nếu cuộc hôn nhân tan vỡ, họ có quyền nuôi con. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph G\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s0\\\">Many anthropologists believe that societies such as the !Kung were normal until a few thousand years ago, when population growth led to the development of agriculture and a settled lifestyle. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s1\\\">In view of the above, there seems little reason to assume that traits such as racism, warfare and male domination should have been selected by evolution – as they would have been of little benefit in the prehistoric era. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s2\\\">Individuals who behaved selfishly and ruthlessly would be less likely to survive, since they would have been ostracised from their groups. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t6')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t6\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p6s0\\\" class=\\\"vi-sent\\\">Nhiều nhà nhân chủng học tin rằng các xã hội như !Kung vẫn bình thường cho đến vài nghìn năm trước, khi sự gia tăng dân số dẫn đến sự phát triển của nông nghiệp và lối sống định cư. \\u003c/span>\\u003cspan id=\\\"p6s1\\\" class=\\\"vi-sent\\\">Theo quan điểm trên, dường như có rất ít lý do để cho rằng những đặc điểm như phân biệt chủng tộc, chiến tranh và sự thống trị của nam giới lẽ ra phải được lựa chọn bởi quá trình tiến hóa - vì chúng sẽ ít mang lại lợi ích trong thời kỳ tiền sử. \\u003c/span>\\u003cspan id=\\\"p6s2\\\" class=\\\"vi-sent\\\">Những cá nhân cư xử ích kỷ và tàn nhẫn sẽ ít có khả năng sống sót vì họ sẽ bị tẩy chay khỏi nhóm của mình. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph H\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s0\\\">It makes more sense, then, to see traits such as cooperation, egalitarianism, altruism and peacefulness as innate characteristics of human beings. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s1\\\">These were the traits that were prevalent in human life for tens of thousands of years. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s2\\\">So presumably these traits are still strong in us now. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t7')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t7\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p7s0\\\" class=\\\"vi-sent\\\">Khi đó, sẽ hợp lý hơn khi coi những đặc điểm như hợp tác, chủ nghĩa quân bình, lòng vị tha và sự ôn hòa là những đặc điểm bẩm sinh của con người. \\u003c/span>\\u003cspan id=\\\"p7s1\\\" class=\\\"vi-sent\\\">Đây là những đặc điểm phổ biến trong cuộc sống con người hàng chục nghìn năm. \\u003c/span>\\u003cspan id=\\\"p7s2\\\" class=\\\"vi-sent\\\">Vì vậy, có lẽ bây giờ những đặc điểm này vẫn còn mạnh mẽ trong chúng ta. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph I\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s0\\\">But if prehistoric life wasn’t really as brutal as has often been assumed, why do modern humans behave so selfishly and ruthlessly? \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s1\\\">Perhaps these negative traits should be seen as a later development, the result of environmental and psychological factors. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s2\\\">Research has shown repeatedly that when the natural habitats of primates such as apes and gorillas are disrupted, they tend to become more violent and hierarchical. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t8')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t8\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p8s0\\\" class=\\\"vi-sent\\\">Nhưng nếu cuộc sống thời tiền sử không thực sự tàn bạo như người ta vẫn tưởng thì tại sao con người hiện đại lại cư xử ích kỷ và tàn nhẫn đến vậy? \\u003c/span>\\u003cspan id=\\\"p8s1\\\" class=\\\"vi-sent\\\">Có lẽ những đặc điểm tiêu cực này nên được coi là sự phát triển sau này, là kết quả của các yếu tố môi trường và tâm lý. \\u003c/span>\\u003cspan id=\\\"p8s2\\\" class=\\\"vi-sent\\\">Nghiên cứu đã nhiều lần chỉ ra rằng khi môi trường sống tự nhiên của các loài linh trưởng như vượn người và khỉ đột bị phá vỡ, chúng có xu hướng trở nên hung bạo và phân cấp hơn. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph J\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s0\\\">So, it could well be that the same thing has happened to us. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s1\\\">I believe that the end of the hunter-gatherer lifestyle and the advent of farming was connected to a psychological change that occurred in some groups of people. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s2\\\">There was a new sense of individuality and separateness, which led to a new selfishness, and ultimately to hierarchical societies, patriarchy and warfare. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s3\\\">At any rate, these negative traits appear to have developed so recently that it doesn’t seem feasible to explain them in adaptive or evolutionary terms. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t9')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t9\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p9s0\\\" class=\\\"vi-sent\\\">Vì vậy, rất có thể điều tương tự đã xảy ra với chúng ta. \\u003c/span>\\u003cspan id=\\\"p9s1\\\" class=\\\"vi-sent\\\">Tôi tin rằng sự kết thúc của lối sống săn bắt hái lượm và sự xuất hiện của nghề trồng trọt có liên quan đến sự thay đổi tâm lý xảy ra ở một số nhóm người. \\u003c/span>\\u003cspan id=\\\"p9s2\\\" class=\\\"vi-sent\\\">Có một ý thức mới về tính cá nhân và sự tách biệt, dẫn đến tính ích kỷ mới, và cuối cùng là đến các xã hội có thứ bậc, chế độ phụ hệ và chiến tranh. \\u003c/span>\\u003cspan id=\\\"p9s3\\\" class=\\\"vi-sent\\\">Dù sao đi nữa, những đặc điểm tiêu cực này dường như đã phát triển gần đây đến mức dường như không thể giải thích chúng bằng thuật ngữ thích nghi hoặc tiến hóa. \\u003c/span>\\u003c/div>\\u003c/div>\\u003c/div>\",\"headingsHtml\":\"\",\"qs\":[{\"id\":27,\"type\":\"mcq\",\"text\":\"What is the writer doing in the first paragraph?\",\"options\":[\"A   setting out two opposing views about human nature\",\"B   justifying his opinion about our tendency to be greedy\",\"C   describing a commonly held belief about people’s behaviour\",\"D   explaining why he thinks that humans act in a selfish manner\"],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":27},{\"id\":28,\"type\":\"mcq\",\"text\":\"What point is made about Richard Dawkins’ book The Selfish Gene?\",\"options\":[\"A   Its appeal lay in the radical nature of its ideas.\",\"B   Its success was due to the scientific support it offered.\",\"C   It presented a view that was in line with the attitudes of its time.\",\"D   It took an innovative approach to the analysis of human psychology.\"],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":28},{\"id\":29,\"type\":\"mcq\",\"text\":\"What does the writer suggest about the prehistoric era in the fourth paragraph?\",\"options\":[\"A   Societies were more complex than many people believe.\",\"B   Supplies of natural resources were probably relatively plentiful.\",\"C   Most estimates about population sizes are likely to be inaccurate.\",\"D   Humans moved across continents more than was previously thought.\"],\"correctAnswer\":\"B\",\"location\":\"\",\"_orderId\":29},{\"id\":30,\"type\":\"mcq\",\"text\":\"The writer refers to Bruce Knauft’s work as support for the idea that\",\"options\":[\"A   selfishness is a relatively recent development in human societies.\",\"B   only people in isolated communities can live in an unselfish manner.\",\"C   very few lifestyles have survived unchanged since prehistoric times.\",\"D   hunter-gatherer cultures worldwide are declining in number.\"],\"correctAnswer\":\"A\",\"location\":\"\",\"_orderId\":30},{\"type\":\"gap-fill-block\",\"id\":31,\"text\":\"Complete the summary below.\\nChoose \\u003cb>ONE WORD ONLY\\u003c/b> from the passage for each answer.\\nWrite your answers in boxes 31–35 on your answer sheet.\\n\\u003cb>Contemporary hunter-gatherer societies\\u003c/b>\\nBruce Kauft’s research shows that contemporary hunter-gatherer societies tend to exhibit a high level of 31………………… in all areas of life. In these cultures, distributing resources fairly among all members is a moral obligation. These societies also employ strategies to prevent differences in 32………………… occurring: for example, the !Kung follow a custom whereby the credit for one person’s success at 33………………… is given to another member of the group. Individuals who behave in a 34………………… manner are punished by being excluded from the group, and women have a considerable amount of 35………………… in choices regarding work and marriage.\",\"gapIds\":[31,32,33,34,35],\"answers\":{\"31\":\"egalitarianism\",\"32\":\"status\",\"33\":\"hunting\",\"34\":\"domineering\",\"35\":\"autonomy\"},\"locations\":{},\"_orderId\":31},{\"id\":36,\"type\":\"ynng\",\"text\":\"Some anthropologists are mistaken about the point when the number of societies such as the !Kung began to decline.\",\"options\":[],\"correctAnswer\":\"NOT GIVEN\",\"location\":\"\",\"_orderId\":36},{\"id\":37,\"type\":\"ynng\",\"text\":\"Humans who developed warlike traits in prehistory would have had an advantage over those who did not.\",\"options\":[],\"correctAnswer\":\"NO\",\"location\":\"\",\"_orderId\":37},{\"id\":38,\"type\":\"ynng\",\"text\":\"Being peaceful and cooperative is a natural way for people to behave.\",\"options\":[],\"correctAnswer\":\"YES\",\"location\":\"\",\"_orderId\":38},{\"id\":39,\"type\":\"ynng\",\"text\":\"Negative traits are more apparent in some modern cultures than in others.\",\"options\":[],\"correctAnswer\":\"NOT GIVEN\",\"location\":\"\",\"_orderId\":39},{\"id\":40,\"type\":\"ynng\",\"text\":\"Animal research has failed to reveal a link between changes in the environment and the emergence of aggressive tendencies.\",\"options\":[],\"correctAnswer\":\"NO\",\"location\":\"\",\"_orderId\":40}],\"vocab\":[],\"headings\":[],\"headingKey\":{},\"mifRange\":\"\",\"removeOpt\":false,\"removeFeatureOpt\":false,\"pairs\":[],\"pData\":[{\"en\":[\"There has long been a general assumption that human beings are essentially selfish.\",\"We’re apparently ruthless, with strong impulses to compete against each other for resources and to accumulate power and possessions.\",\"If we are kind to one another, it’s usually because we have ulterior motives.\",\"If we are good, it’s only because we have managed to control and transcend our innate selfishness and brutality.\"],\"vi\":[\"Từ lâu đã có một giả định chung rằng con người về bản chất là ích kỷ.\",\"Rõ ràng chúng ta là những người tàn nhẫn, có động lực mạnh mẽ để cạnh tranh với nhau để giành lấy tài nguyên cũng như tích lũy quyền lực và của cải.\",\"Nếu chúng ta tử tế với nhau, thường là vì chúng ta có những động cơ thầm kín.\",\"Nếu chúng ta tốt thì đó chỉ là do chúng ta đã kiểm soát được và vượt qua được tính ích kỷ và tàn bạo bẩm sinh của mình.\"]},{\"en\":[\"This bleak view of human nature is closely associated with the science writer Richard Dawkins, whose 1976 book The Selfish Gene became popular because it fitted so well with – and helped to justify – the competitive and individualistic ethos that was so prevalent in late 20th-century societies.\",\"Like many others, Dawkins justifies his views with reference to the field of evolutionary psychology.\",\"Evolutionary psychology theorises that present-day human traits developed in prehistoric times, during what is termed the ‘environment of evolutionary adaptedness’.\"],\"vi\":[\"Quan điểm ảm đạm này về bản chất con người gắn liền với nhà văn khoa học Richard Dawkins, người có cuốn sách The Selfish Gene năm 1976 trở nên nổi tiếng vì nó rất phù hợp – và giúp biện minh – cho đặc tính cạnh tranh và chủ nghĩa cá nhân vốn rất phổ biến ở các xã hội cuối thế kỷ 20.\",\"Giống như nhiều người khác, Dawkins biện minh cho quan điểm của mình bằng cách tham khảo lĩnh vực tâm lý học tiến hóa.\",\"Tâm lý học tiến hóa đưa ra giả thuyết rằng những đặc điểm của con người ngày nay đã phát triển từ thời tiền sử, trong thời kỳ được gọi là “môi trường thích nghi tiến hóa”.\"]},{\"en\":[\"Prehistory is usually seen as a period of intense competition, when life was such a brutal battle that only those with traits such as selfishness, aggression and ruthlessness survived.\",\"And because survival depended on access to resources – such as rivers, forests and animals – there was bound to be conflict between rival groups, which led to the development of traits such as racism and warfare.\",\"This seems logical.\",\"But, in fact, the assumption on which this all rests – that prehistoric life was a desperate struggle for survival – is false.\"],\"vi\":[\"Thời tiền sử thường được coi là thời kỳ cạnh tranh khốc liệt, khi cuộc sống là một trận chiến tàn khốc đến mức chỉ những người có những đặc điểm như ích kỷ, hung hãn và tàn nhẫn mới sống sót.\",\"Và bởi vì sự sống còn phụ thuộc vào khả năng tiếp cận các nguồn tài nguyên - như sông, rừng và động vật - nên chắc chắn sẽ xảy ra xung đột giữa các nhóm đối thủ, dẫn đến sự phát triển các đặc điểm như phân biệt chủng tộc và chiến tranh.\",\"Điều này có vẻ hợp lý.\",\"Nhưng trên thực tế, giả định làm cơ sở cho tất cả những điều này - rằng cuộc sống thời tiền sử là một cuộc đấu tranh tuyệt vọng để sinh tồn - là sai lầm.\"]},{\"en\":[\"It’s important to remember that in the prehistoric era, the world was very sparsely populated.\",\"According to some estimates, around 15,000 years ago, the population of Europe was only 29,000, and the population of the whole world was less than half a million.\",\"Humans at that time were hunter-gatherers: people who lived by hunting wild animals and collecting wild plants.\",\"With such small population densities, it seems unlikely that prehistoric hunter-gatherer groups had to compete against each other for resources or had any need to develop ruthlessness and competitiveness, or to go to war.\"],\"vi\":[\"Điều quan trọng cần nhớ là vào thời tiền sử, thế giới có dân số rất thưa thớt.\",\"Theo một số ước tính, khoảng 15.000 năm trước, dân số châu Âu chỉ có 29.000 người, còn dân số toàn thế giới chưa đến nửa triệu người.\",\"Con người thời đó là những người săn bắt hái lượm: con người sống bằng nghề săn bắt động vật hoang dã và thu thập thực vật hoang dã.\",\"Với mật độ dân số nhỏ như vậy, dường như các nhóm săn bắn hái lượm thời tiền sử không phải cạnh tranh với nhau để giành lấy tài nguyên hoặc có nhu cầu phát triển sự tàn nhẫn và cạnh tranh, hoặc gây chiến.\"]},{\"en\":[\"There is significant evidence to back this notion from contemporary hunter-gatherer groups, who live in the same way as prehistoric humans did.\",\"As the anthropologist Bruce Knauft has remarked, hunter-gatherers are characterized by ‘extreme political and sexual egalitarianism’.\",\"Knauft has observed that individuals in such groups don’t accumulate property or possessions and have an ethical obligation to share everything.\",\"They also have methods of preserving egalitarianism by ensuring that disparities of status don’t arise.\"],\"vi\":[\"Có bằng chứng quan trọng ủng hộ quan điểm này từ các nhóm săn bắn hái lượm đương thời, những người sống giống như con người thời tiền sử.\",\"Như nhà nhân chủng học Bruce Knauft đã nhận xét, những người săn bắn hái lượm có đặc điểm là “chủ nghĩa quân bình về chính trị và tình dục cực đoan”.\",\"Knauft đã quan sát thấy rằng các cá nhân trong những nhóm như vậy không tích lũy tài sản hoặc của cải và có nghĩa vụ đạo đức là chia sẻ mọi thứ.\",\"Họ cũng có những phương pháp bảo tồn chủ nghĩa quân bình bằng cách đảm bảo rằng sự chênh lệch về địa vị không phát sinh.\"]},{\"en\":[\"The !Kung people of southern Africa, for example, swap arrows before going hunting and when an animal is killed, the acclaim does not go to the person who fired the arrow, but to the person the arrow belongs to.\",\"And if a person becomes too domineering, the other members of the group ostracise them, exiling the offender from society.\",\"Typically in such groups, men do not dictate what women do.\",\"Women in hunter-gatherer groups worldwide often benefit from a high level of autonomy, being able to select their own marriage partners, decide what work they do and work whenever they choose to.\",\"And if a marriage breaks down, they have custody rights over their children.\"],\"vi\":[\"Ví dụ, người !Kung ở miền nam châu Phi trao đổi mũi tên trước khi đi săn và khi một con vật bị giết, sự hoan nghênh không thuộc về người bắn mũi tên mà thuộc về người sở hữu mũi tên.\",\"Và nếu một người trở nên quá độc đoán, các thành viên khác trong nhóm sẽ tẩy chay họ, trục xuất người phạm tội ra khỏi xã hội.\",\"Thông thường trong những nhóm như vậy, đàn ông không ra lệnh cho phụ nữ làm gì.\",\"Phụ nữ trong các nhóm săn bắn hái lượm trên toàn thế giới thường được hưởng lợi từ mức độ tự chủ cao, có thể tự lựa chọn bạn đời, quyết định công việc họ làm và làm việc bất cứ khi nào họ chọn.\",\"Và nếu cuộc hôn nhân tan vỡ, họ có quyền nuôi con.\"]},{\"en\":[\"Many anthropologists believe that societies such as the !Kung were normal until a few thousand years ago, when population growth led to the development of agriculture and a settled lifestyle.\",\"In view of the above, there seems little reason to assume that traits such as racism, warfare and male domination should have been selected by evolution – as they would have been of little benefit in the prehistoric era.\",\"Individuals who behaved selfishly and ruthlessly would be less likely to survive, since they would have been ostracised from their groups.\"],\"vi\":[\"Nhiều nhà nhân chủng học tin rằng các xã hội như !Kung vẫn bình thường cho đến vài nghìn năm trước, khi sự gia tăng dân số dẫn đến sự phát triển của nông nghiệp và lối sống định cư.\",\"Theo quan điểm trên, dường như có rất ít lý do để cho rằng những đặc điểm như phân biệt chủng tộc, chiến tranh và sự thống trị của nam giới lẽ ra
