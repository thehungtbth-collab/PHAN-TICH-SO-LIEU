 phải được lựa chọn bởi quá trình tiến hóa - vì chúng sẽ ít mang lại lợi ích trong thời kỳ tiền sử.\",\"Những cá nhân cư xử ích kỷ và tàn nhẫn sẽ ít có khả năng sống sót vì họ sẽ bị tẩy chay khỏi nhóm của mình.\"]},{\"en\":[\"It makes more sense, then, to see traits such as cooperation, egalitarianism, altruism and peacefulness as innate characteristics of human beings.\",\"These were the traits that were prevalent in human life for tens of thousands of years.\",\"So presumably these traits are still strong in us now.\"],\"vi\":[\"Khi đó, sẽ hợp lý hơn khi coi những đặc điểm như hợp tác, chủ nghĩa quân bình, lòng vị tha và sự ôn hòa là những đặc điểm bẩm sinh của con người.\",\"Đây là những đặc điểm phổ biến trong cuộc sống con người hàng chục nghìn năm.\",\"Vì vậy, có lẽ bây giờ những đặc điểm này vẫn còn mạnh mẽ trong chúng ta.\"]},{\"en\":[\"But if prehistoric life wasn’t really as brutal as has often been assumed, why do modern humans behave so selfishly and ruthlessly?\",\"Perhaps these negative traits should be seen as a later development, the result of environmental and psychological factors.\",\"Research has shown repeatedly that when the natural habitats of primates such as apes and gorillas are disrupted, they tend to become more violent and hierarchical.\"],\"vi\":[\"Nhưng nếu cuộc sống thời tiền sử không thực sự tàn bạo như người ta vẫn tưởng thì tại sao con người hiện đại lại cư xử ích kỷ và tàn nhẫn đến vậy?\",\"Có lẽ những đặc điểm tiêu cực này nên được coi là sự phát triển sau này, là kết quả của các yếu tố môi trường và tâm lý.\",\"Nghiên cứu đã nhiều lần chỉ ra rằng khi môi trường sống tự nhiên của các loài linh trưởng như vượn người và khỉ đột bị phá vỡ, chúng có xu hướng trở nên hung bạo và phân cấp hơn.\"]},{\"en\":[\"So, it could well be that the same thing has happened to us.\",\"I believe that the end of the hunter-gatherer lifestyle and the advent of farming was connected to a psychological change that occurred in some groups of people.\",\"There was a new sense of individuality and separateness, which led to a new selfishness, and ultimately to hierarchical societies, patriarchy and warfare.\",\"At any rate, these negative traits appear to have developed so recently that it doesn’t seem feasible to explain them in adaptive or evolutionary terms.\"],\"vi\":[\"Vì vậy, rất có thể điều tương tự đã xảy ra với chúng ta.\",\"Tôi tin rằng sự kết thúc của lối sống săn bắt hái lượm và sự xuất hiện của nghề trồng trọt có liên quan đến sự thay đổi tâm lý xảy ra ở một số nhóm người.\",\"Có một ý thức mới về tính cá nhân và sự tách biệt, dẫn đến tính ích kỷ mới, và cuối cùng là đến các xã hội có thứ bậc, chế độ phụ hệ và chiến tranh.\",\"Dù sao đi nữa, những đặc điểm tiêu cực này dường như đã phát triển gần đây đến mức dường như không thể giải thích chúng bằng thuật ngữ thích nghi hoặc tiến hóa.\"]}],\"timeLimit\":20},{\"name\":\"CAM 20 TEST 1 (P2)\",\"articleHtml\":\"\\u003cdiv class=\\\"reading-content\\\">\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph A\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s0\\\">Around 25 million elms, accounting for 90% of all elm trees in the UK, died during the 1960s and ’70s of Dutch elm disease. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s1\\\">In the aftermath, the elm, once so dominant in the British landscape, was largely forgotten. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s2\\\">However, there’s now hope the elm may be reintroduced to the countryside of central and southern England. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s3\\\">Any reintroduction will start from a very low base. ‘The impact of the disease is difficult to picture if you hadn’t seen what was there before,’ says Matt Elliot of the Woodland Trust. ‘You look at old photographs from the 1960s and it’s only then that you realise the impact [elms had] … They were significant, large trees… then they were gone.’ \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t0')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t0\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p0s0\\\" class=\\\"vi-sent\\\">Khoảng 25 triệu cây du, chiếm 90% tổng số cây du ở Anh, đã chết trong những năm 1960 và 1970 vì bệnh cây du Hà Lan. \\u003c/span>\\u003cspan id=\\\"p0s1\\\" class=\\\"vi-sent\\\">Sau đó, cây du, từng chiếm ưu thế trong cảnh quan nước Anh, phần lớn đã bị lãng quên. \\u003c/span>\\u003cspan id=\\\"p0s2\\\" class=\\\"vi-sent\\\">Tuy nhiên, giờ đây người ta hy vọng cây du có thể được đưa trở lại vùng nông thôn miền trung và miền nam nước Anh. \\u003c/span>\\u003cspan id=\\\"p0s3\\\" class=\\\"vi-sent\\\">Bất kỳ sự giới thiệu lại nào cũng sẽ bắt đầu từ mức cơ bản rất thấp. Matt Elliot của Woodland Trust cho biết: “Rất khó để hình dung tác động của căn bệnh này nếu bạn chưa từng thấy những gì đã xảy ra trước đó”. ‘Bạn nhìn vào những bức ảnh cũ từ những năm 1960 và chỉ khi đó bạn mới nhận ra tác động của [cây du]… Chúng là những cây to, có ý nghĩa… rồi chúng biến mất.’ \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph B\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s0\\\">The disease is caused by a fungus that blocks the elms’ vascular (water, nutrient and food transport) system, causing branches to wilt and die. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s1\\\">A first epidemic, which occurred in the 1920s, gradually died down, but in the ’70s a second epidemic was triggered by shipments of elm from Canada. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s2\\\">The wood came in the form of logs destined for boat building and its intact bark was perfect for the elm bark beetles that spread the deadly fungus. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s3\\\">This time, the beetles carried a much more virulent strain that destroyed the vast majority of British elms. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t1')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t1\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p1s0\\\" class=\\\"vi-sent\\\">Bệnh do một loại nấm gây ra làm tắc nghẽn hệ thống mạch máu (vận chuyển nước, chất dinh dưỡng và thức ăn) của cây du, khiến cành bị héo và chết. \\u003c/span>\\u003cspan id=\\\"p1s1\\\" class=\\\"vi-sent\\\">Trận dịch đầu tiên xảy ra vào những năm 1920 và dần dần giảm bớt, nhưng vào những năm 70, trận dịch thứ hai bùng phát do những chuyến hàng cây du từ Canada. \\u003c/span>\\u003cspan id=\\\"p1s2\\\" class=\\\"vi-sent\\\">Gỗ ở dạng khúc gỗ dùng để đóng thuyền và vỏ nguyên vẹn của nó là nơi hoàn hảo để bọ cánh cứng lây lan loại nấm chết người. \\u003c/span>\\u003cspan id=\\\"p1s3\\\" class=\\\"vi-sent\\\">Lần này, bọ cánh cứng mang một chủng độc hại hơn nhiều và đã phá hủy phần lớn cây du ở Anh. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph C\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s0\\\">Today, elms still exist in the southern English countryside but mostly only in low hedgerows between fields. ‘We have millions of small elms in hedgerows but they get targeted by the beetle as soon as they reach a certain size,’ says Karen Russell, co-author of the report ‘Where we are with elm’. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s1\\\">Once the trunk of the elm reaches 10-15 centimetres or so in diameter, it becomes a perfect size for beetles to lay eggs and for the fungus to take hold. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s2\\\">Yet mature specimens have been identified, in counties such as Cambridgeshire, that are hundreds of years old, and have mysteriously escaped the epidemic. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s3\\\">The key, Russell says, is to identify and study those trees that have survived and work out why they stood tall when millions of others succumbed. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s4\\\">Nevertheless, opportunities are limited as the number of these mature survivors is relatively small. ‘What are the reasons for their survival?’ asks Russell. ‘Avoidance, tolerance, resistance? \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s5\\\">We don’t know where the balance lies between the three. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s6\\\">I don’t see how it can be entirely down to luck.’ \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t2')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t2\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p2s0\\\" class=\\\"vi-sent\\\">Ngày nay, cây du vẫn tồn tại ở vùng nông thôn miền nam nước Anh nhưng chủ yếu chỉ tồn tại ở những hàng rào thấp giữa các cánh đồng. Karen Russell, đồng tác giả của báo cáo “Chúng ta đang ở đâu với cây du”, cho biết: “Chúng tôi có hàng triệu cây du nhỏ trong hàng rào nhưng chúng bị bọ cánh cứng nhắm đến ngay khi đạt đến kích thước nhất định”. \\u003c/span>\\u003cspan id=\\\"p2s1\\\" class=\\\"vi-sent\\\">Khi thân cây du đạt đường kính khoảng 10-15 cm, nó sẽ trở thành kích thước hoàn hảo cho bọ cánh cứng đẻ trứng và nấm sinh sôi. \\u003c/span>\\u003cspan id=\\\"p2s2\\\" class=\\\"vi-sent\\\">Tuy nhiên, các mẫu vật trưởng thành đã được xác định ở các quận như Cambridgeshire, có hàng trăm năm tuổi và đã thoát khỏi dịch bệnh một cách bí ẩn. \\u003c/span>\\u003cspan id=\\\"p2s3\\\" class=\\\"vi-sent\\\">Russell nói, điều quan trọng là xác định và nghiên cứu những cây còn sống sót và tìm ra lý do tại sao chúng vẫn đứng vững trong khi hàng triệu cây khác đã chết. \\u003c/span>\\u003cspan id=\\\"p2s4\\\" class=\\\"vi-sent\\\">Tuy nhiên, cơ hội bị hạn chế vì số lượng những người sống sót trưởng thành này tương đối ít. “Lý do cho sự sống sót của họ là gì?” Russell hỏi. ‘Né tránh, bao dung, phản kháng? \\u003c/span>\\u003cspan id=\\\"p2s5\\\" class=\\\"vi-sent\\\">Chúng tôi không biết sự cân bằng giữa ba điều này nằm ở đâu. \\u003c/span>\\u003cspan id=\\\"p2s6\\\" class=\\\"vi-sent\\\">Tôi không hiểu tại sao mọi chuyện lại hoàn toàn phụ thuộc vào may mắn.” \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph D\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s0\\\">For centuries, elm ran a close second to oak as the hardwood tree of choice in Britain and was in many instances the most prominent tree in the landscape. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s1\\\">Not only was elm common in European forests, it became a key component of birch, ash and hazel woodlands. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s2\\\">The use of elm is thought to go back to the Bronze Age, when it was widely used for tools. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s3\\\">Elm was also the preferred material for shields and early swords. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s4\\\">In the 18th century, it was planted more widely and its wood was used for items such as storage crates and flooring. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s5\\\">It was also suitable for items that experienced high levels of impact and was used to build the keel of the 19th-century sailing ship Cutty Sark as well as mining equipment. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t3')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t3\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p3s0\\\" class=\\\"vi-sent\\\">Trong nhiều thế kỷ, cây du đứng thứ hai sau cây sồi với tư cách là loại cây gỗ cứng được lựa chọn ở Anh và trong nhiều trường hợp là loại cây nổi bật nhất trong cảnh quan. \\u003c/span>\\u003cspan id=\\\"p3s1\\\" class=\\\"vi-sent\\\">Cây du không chỉ phổ biến ở các khu rừng châu Âu mà còn trở thành thành phần chính của rừng bạch dương, tần bì và cây phỉ. \\u003c/span>\\u003cspan id=\\\"p3s2\\\" class=\\\"vi-sent\\\">Việc sử dụng cây du được cho là đã có từ thời đồ đồng, khi nó được sử dụng rộng rãi để làm công cụ. \\u003c/span>\\u003cspan id=\\\"p3s3\\\" class=\\\"vi-sent\\\">Elm cũng là vật liệu ưa thích để làm khiên và kiếm thời kỳ đầu. \\u003c/span>\\u003cspan id=\\\"p3s4\\\" class=\\\"vi-sent\\\">Vào thế kỷ 18, nó được trồng rộng rãi hơn và gỗ của nó được sử dụng làm các vật dụng như thùng đựng đồ và sàn nhà. \\u003c/span>\\u003cspan id=\\\"p3s5\\\" class=\\\"vi-sent\\\">Nó cũng thích hợp cho các vật dụng chịu va đập ở mức độ cao và được sử dụng để chế tạo sống tàu buồm Cutty Sark thế kỷ 19 cũng như thiết bị khai thác mỏ. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph E\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s0\\\">Given how ingrained elm is in British culture, it’s unsurprising the tree has many advocates. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s1\\\">Amongst them is Peter Bourne of the National Elm Collection in Brighton. ‘I saw Dutch elm disease unfold as a small boy,’ he says. ‘The elm seemed to be part of rural England, but I remember watching trees just lose their leaves and that really stayed with me.’ Today, the city of Brighton’s elms total about 17,000. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s2\\\">Local factors appear to have contributed to their survival. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s3\\\">Strong winds from the sea make it difficult for the determined elm bark beetle to attack this coastal city’s elm population. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s4\\\">However, the situation is precarious. ‘The beetles can just march in if we’re not careful, as the threat is right on our doorstep,’ says Bourne. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t4')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t4\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p4s0\\\" class=\\\"vi-sent\\\">Do cây du đã ăn sâu vào văn hóa Anh nên không có gì ngạc nhiên khi cây du được nhiều người ủng hộ. \\u003c/span>\\u003cspan id=\\\"p4s1\\\" class=\\\"vi-sent\\\">Trong số đó có Peter Bourne của Bộ sưu tập cây du quốc gia ở Brighton. Ông nói: “Tôi đã chứng kiến ​​bệnh cây du Hà Lan lây lan khi còn là một cậu bé. ‘Cây du dường như là một phần của vùng nông thôn nước Anh, nhưng tôi nhớ đã chứng kiến ​​những cây rụng lá và điều đó thực sự đọng lại trong tôi.’ Ngày nay, tổng số cây du ở thành phố Brighton có khoảng 17.000 cây. \\u003c/span>\\u003cspan id=\\\"p4s2\\\" class=\\\"vi-sent\\\">Các yếu tố địa phương dường như đã góp phần vào sự sống còn của họ. \\u003c/span>\\u003cspan id=\\\"p4s3\\\" class=\\\"vi-sent\\\">Gió mạnh từ biển khiến loài bọ vỏ cây du khó tấn công quần thể cây du của thành phố ven biển này. \\u003c/span>\\u003cspan id=\\\"p4s4\\\" class=\\\"vi-sent\\\">Tuy nhiên, tình hình rất bấp bênh. Bourne nói: “Bọn bọ có thể tiến vào nếu chúng ta không cẩn thận, vì mối đe dọa đang ở ngay trước cửa nhà chúng ta”. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph F\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s0\\\">Any prospect of the elm returning relies heavily on trees being either resistant to, or tolerant of, the disease. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s1\\\">This means a widespread reintroduction would involve existing or new hybrid strains derived from resistant, generally non-native elm species. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s2\\\">A new generation of seedlings have been bred and tested to see if they can withstand the fungus by cutting a small slit on the bark and injecting a tiny amount of the pathogen. ‘The effects are very quick,’ says Russell. ‘You return in four to six weeks and trees that are resistant show no symptoms, whereas those that are susceptible show leaf loss and may even have died completely.’ \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t5')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t5\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p5s0\\\" class=\\\"vi-sent\\\">Bất kỳ triển vọng nào về việc cây du quay trở lại đều phụ thuộc rất nhiều vào việc cây có khả năng kháng cự hoặc chịu đựng được bệnh tật hay không. \\u003c/span>\\u003cspan id=\\\"p5s1\\\" class=\\\"vi-sent\\\">Điều này có nghĩa là việc tái trồng rộng rãi sẽ liên quan đến các chủng lai hiện có hoặc mới có nguồn gốc từ các loài cây du không bản địa có khả năng kháng bệnh. \\u003c/span>\\u003cspan id=\\\"p5s2\\\" class=\\\"vi-sent\\\">Một thế hệ cây con mới đã được nhân giống và thử nghiệm để xem liệu chúng có thể chịu được nấm hay không bằng cách cắt một khe nhỏ trên vỏ cây và tiêm một lượng nhỏ mầm bệnh. Russell nói: “Hiệu quả rất nhanh chóng”. ‘Bạn quay trở lại sau 4 đến 6 tuần và những cây kháng bệnh không có triệu chứng, trong khi những cây mẫn cảm sẽ bị rụng lá và thậm chí có thể chết hoàn toàn.’ \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph G\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s0\\\">All of this raises questions of social acceptance, acknowledges Russell. ‘If we’re putting elm back into the landscape, a small element of it is not native – are we bothered about that?’ For her, the environmental case for reintroducing elm is strong. ‘They will host wildlife, which is a good thing. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s1\\\">Others are more wary. ‘On the face of it, it seems like a good idea,’ says Elliot. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s2\\\">The problem, he suggests, is that, ‘You’re replacing a native species with a horticultural analogue*. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s3\\\">You’re effectively cloning.’ There’s also the risk of introducing new diseases. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s4\\\">Rather than plant new elms, the Woodland Trust emphasises providing space to those elms that have survived independently. ‘Sometimes the best thing you can do is just give nature time to recover over time, you might get resistance,’ says Elliot. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t6')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t6\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p6s0\\\" class=\\\"vi-sent\\\">Russell thừa nhận tất cả những điều này đặt ra câu hỏi về sự chấp nhận của xã hội. ‘Nếu chúng ta đưa cây du trở lại cảnh quan, một phần nhỏ của nó không phải là cây bản địa – chúng ta có bận tâm về điều đó không?’ Đối với cô ấy, trường hợp môi trường để giới thiệu lại cây du là rất mạnh mẽ. ‘Họ sẽ tiếp đón động vật hoang dã, đó là một điều tốt. \\u003c/span>\\u003cspan id=\\\"p6s1\\\" class=\\\"vi-sent\\\">Những người khác thì cảnh giác hơn. “Nhìn bề ngoài thì đó có vẻ là một ý tưởng hay,” Elliot nói. \\u003c/span>\\u003cspan id=\\\"p6s2\\\" class=\\\"vi-sent\\\">Ông gợi ý rằng vấn đề là 'Bạn đang thay thế một loài bản địa bằng một loài tương tự trong nghề làm vườn*. \\u003c/span>\\u003cspan id=\\\"p6s3\\\" class=\\\"vi-sent\\\">Bạn đang nhân bản một cách hiệu quả.’ Ngoài ra còn có nguy cơ gây ra các bệnh mới. \\u003c/span>\\u003cspan id=\\\"p6s4\\\" class=\\\"vi-sent\\\">Thay vì trồng những cây du mới, Woodland Trust nhấn mạnh việc cung cấp không gian cho những cây du sống sót độc lập. Elliot nói: “Đôi khi, điều tốt nhất bạn có thể làm chỉ là cho thiên nhiên thời gian để phục hồi theo thời gian, nếu không bạn có thể gặp phải sự phản kháng. \\u003c/span>\\u003c/div>\\u003c/div>\\u003c/div>\",\"headingsHtml\":\"\",\"qs\":[{\"id\":14,\"type\":\"mif\",\"text\":\"reference to the research problems that arise from there being only a few surviving large elms\",\"options\":[],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":14},{\"id\":15,\"type\":\"mif\",\"text\":\"details of a difference of opinion about the value of reintroducing elms to Britain\",\"options\":[],\"correctAnswer\":\"G\",\"location\":\"\",\"_orderId\":15},{\"id\":16,\"type\":\"mif\",\"text\":\"reference to how Dutch elm disease was brought into Britain\",\"options\":[],\"correctAnswer\":\"B\",\"location\":\"\",\"_orderId\":16},{\"id\":17,\"type\":\"mif\",\"text\":\"a description of the conditions that have enabled a location in Britain to escape Dutch elm disease\",\"options\":[],\"correctAnswer\":\"E\",\"location\":\"\",\"_orderId\":17},{\"id\":18,\"type\":\"mif\",\"text\":\"reference to the stage at which young elms become vulnerable to Dutch elm disease\",\"options\":[],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":18},{\"type\":\"summary\",\"isFeature\":true,\"id\":19,\"text\":\"19 …   If a tree gets infected with Dutch elm disease, the damage rapidly becomes visible.\\n20 …   It may be better to wait and see if the mature elms that have survived continue to flourish.\\n21 …   There must be an explanation for the survival of some mature elms.\\n22 …   We need to be aware that insects carrying Dutch elm disease are not very far away.\\n23 …   You understand the effect Dutch elm disease has had when you see evidence of how prominent the tree once was.\",\"gapIds\":[19,20,21,22,23],\"options\":[\"A.   Matt Elliot\",\"B.   Karen Russell\",\"C.   Peter Bourne\"],\"answers\":{\"19\":\"B\",\"20\":\"A\",\"21\":\"B\",\"22\":\"C\",\"23\":\"A\"},\"locations\":{},\"_orderId\":19},{\"type\":\"gap-fill-block\",\"id\":24,\"text\":\"Choose \\u003cb>ONE WORD ONLY\\u003c/b> from the passage for each answer.\\nWrite your answers in boxes 24–26 on your answer sheet.\\n\\u003cb>Uses of a popular tree\\u003c/b>\\nFor hundreds of years, the only tree that was more popular in Britain than elm was 24__________. Starting in the Bronze Age, many tools were made from elm and people also used it to make weapons. In the 18th century, it was grown to provide wood for boxes and 25__________. Due to its strength, elm was often used for mining equipment and the Cutty Sark’s 26__________ was also constructed from elm.\",\"gapIds\":[24,25,26],\"answers\":{\"24\":\"oak\",\"25\":\"flooring\",\"26\":\"keel\"},\"locations\":{},\"_orderId\":24}],\"vocab\":[],\"headings\":[],\"headingKey\":{},\"mifRange\":\"ABCDEFG\",\"removeOpt\":false,\"removeFeatureOpt\":false,\"pairs\":[],\"pData\":[{\"en\":[\"Around 25 million elms, accounting for 90% of all elm trees in the UK, died during the 1960s and ’70s of Dutch elm disease.\",\"In the aftermath, the elm, once so dominant in the British landscape, was largely forgotten.\",\"However, there’s now hope the elm may be reintroduced to the countryside of central and southern England.\",\"Any reintroduction will start from a very low base. ‘The impact of the disease is difficult to picture if you hadn’t seen what was there before,’ says Matt Elliot of the Woodland Trust. ‘You look at old photographs from the 1960s and it’s only then that you realise the impact [elms had] … They were significant, large trees… then they were gone.’\"],\"vi\":[\"Khoảng 25 triệu cây du, chiếm 90% tổng số cây du ở Anh, đã chết trong những năm 1960 và 1970 vì bệnh cây du Hà Lan.\",\"Sau đó, cây du, từng chiếm ưu thế trong cảnh quan nước Anh, phần lớn đã bị lãng quên.\",\"Tuy nhiên, giờ đây người ta hy vọng cây du có thể được đưa trở lại vùng nông thôn miền trung và miền nam nước Anh.\",\"Bất kỳ sự giới thiệu lại nào cũng sẽ bắt đầu từ mức cơ bản rất thấp. Matt Elliot của Woodland Trust cho biết: “Rất khó để hình dung tác động của căn bệnh này nếu bạn chưa từng thấy những gì đã xảy ra trước đó”. ‘Bạn nhìn vào những bức ảnh cũ từ những năm 1960 và chỉ khi đó bạn mới nhận ra tác động của [cây du]… Chúng là những cây to, có ý nghĩa… rồi chúng biến mất.’\"]},{\"en\":[\"The disease is caused by a fungus that blocks the elms’ vascular (water, nutrient and food transport) system, causing branches to wilt and die.\",\"A first epidemic, which occurred in the 1920s, gradually died down, but in the ’70s a second epidemic was triggered by shipments of elm from Canada.\",\"The wood came in the form of logs destined for boat building and its intact bark was perfect for the elm bark beetles that spread the deadly fungus.\",\"This time, the beetles carried a much more virulent strain that destroyed the vast majority of British elms.\"],\"vi\":[\"Bệnh do một loại nấm gây ra làm tắc nghẽn hệ thống mạch máu (vận chuyển nước, chất dinh dưỡng và thức ăn) của cây du, khiến cành bị héo và chết.\",\"Trận dịch đầu tiên xảy ra vào những năm 1920 và dần dần giảm bớt, nhưng vào những năm 70, trận dịch thứ hai bùng phát do những chuyến hàng cây du từ Canada.\",\"Gỗ ở dạng khúc gỗ dùng để đóng thuyền và vỏ nguyên vẹn của nó là nơi hoàn hảo để bọ cánh cứng lây lan loại nấm chết người.\",\"Lần này, bọ cánh cứng mang một chủng độc hại hơn nhiều và đã phá hủy phần lớn cây du ở Anh.\"]},{\"en\":[\"Today, elms still exist in the southern English countryside but mostly only in low hedgerows between fields. ‘We have millions of small elms in hedgerows but they get targeted by the beetle as soon as they reach a certain size,’ says Karen Russell, co-author of the report ‘Where we are with elm’.\",\"Once the trunk of the elm reaches 10-15 centimetres or so in diameter, it becomes a perfect size for beetles to lay eggs and for the fungus to take hold.\",\"Yet mature specimens have been identified, in counties such as Cambridgeshire, that are hundreds of years old, and have mysteriously escaped the epidemic.\",\"The key, Russell says, is to identify and study those trees that have survived and work out why they stood tall when millions of others succumbed.\",\"Nevertheless, opportunities are limited as the number of these mature survivors is relatively small. ‘What are the reasons for their survival?’ asks Russell. ‘Avoidance, tolerance, resistance?\",\"We don’t know where the balance lies between the three.\",\"I don’t see how it can be entirely down to luck.’\"],\"vi\":[\"Ngày nay, cây du vẫn tồn tại ở vùng nông thôn miền nam nước Anh nhưng chủ yếu chỉ tồn tại ở những hàng rào thấp giữa các cánh đồng. Karen Russell, đồng tác giả của báo cáo “Chúng ta đang ở đâu với cây du”, cho biết: “Chúng tôi có hàng triệu cây du nhỏ trong hàng rào nhưng chúng bị bọ cánh cứng nhắm đến ngay khi đạt đến kích thước nhất định”.\",\"Khi thân cây du đạt đường kính khoảng 10-15 cm, nó sẽ trở thành kích thước hoàn hảo cho bọ cánh cứng đẻ trứng và nấm sinh sôi.\",\"Tuy nhiên, các mẫu vật trưởng thành đã được xác định ở các quận như Cambridgeshire, có hàng trăm năm tuổi và đã thoát khỏi dịch bệnh một cách bí ẩn.\",\"Russell nói, điều quan trọng là xác định và nghiên cứu những cây còn sống sót và tìm ra lý do tại sao chúng vẫn đứng vững trong khi hàng triệu cây khác đã chết.\",\"Tuy nhiên, cơ hội bị hạn chế vì số lượng những người sống sót trưởng thành này tương đối ít. “Lý do cho sự sống sót của họ là gì?” Russell hỏi. ‘Né tránh, bao dung, phản kháng?\",\"Chúng tôi không biết sự cân bằng giữa ba điều này nằm ở đâu.\",\"Tôi không hiểu tại sao mọi chuyện lại hoàn toàn phụ thuộc vào may mắn.”\"]},{\"en\":[\"For centuries, elm ran a close second to oak as the hardwood tree of choice in Britain and was in many instances the most prominent tree in the landscape.\",\"Not only was elm common in European forests, it became a key component of birch, ash and hazel woodlands.\",\"The use of elm is thought to go back to the Bronze Age, when it was widely used for tools.\",\"Elm was also the preferred material for shields and early swords.\",\"In the 18th century, it was planted more widely and its wood was used for items such as storage crates and flooring.\",\"It was also suitable for items that experienced high levels of impact and was used to build the keel of the 19th-century sailing ship Cutty Sark as well as mining equipment.\"],\"vi\":[\"Trong nhiều thế kỷ, cây du đứng thứ hai sau cây sồi với tư cách là loại cây gỗ cứng được lựa chọn ở Anh và trong nhiều trường hợp là loại cây nổi bật nhất trong cảnh quan.\",\"Cây du không chỉ phổ biến ở các khu rừng châu Âu mà còn trở thành thành phần chính của rừng bạch dương, tần bì và cây phỉ.\",\"Việc sử dụng cây du được cho là đã có từ thời đồ đồng, khi nó được sử dụng rộng rãi để làm công cụ.\",\"Elm cũng là vật liệu ưa thích để làm khiên và kiếm thời kỳ đầu.\",\"Vào thế kỷ 18, nó được trồng rộng rãi hơn và gỗ của nó được sử dụng làm các vật dụng như thùng đựng đồ và sàn nhà.\",\"Nó cũng thích hợp cho các vật dụng chịu va đập ở mức độ cao và được sử dụng để chế tạo sống tàu buồm Cutty Sark thế kỷ 19 cũng như thiết bị khai thác mỏ.\"]},{\"en\":[\"Given how ingrained elm is in British culture, it’s unsurprising the tree has many advocates.\",\"Amongst them is Peter Bourne of the National Elm Collection in Brighton. ‘I saw Dutch elm disease unfold as a small boy,’ he says. ‘The elm seemed to be part of rural England, but I remember watching trees just lose their leaves and that really stayed with me.’ Today, the city of Brighton’s elms total about 17,000.\",\"Local factors appear to have contributed to their survival.\",\"Strong winds from the sea make it difficult for the determined elm bark beetle to attack this coastal city’s elm population.\",\"However, the situation is precarious. ‘The beetles can just march in if we’re not careful, as the threat is right on our doorstep,’ says Bourne.\"],\"vi\":[\"Do cây du đã ăn sâu vào văn hóa Anh nên không có gì ngạc nhiên khi cây du được nhiều người ủng hộ.\",\"Trong số đó có Peter Bourne của Bộ sưu tập cây du quốc gia ở Brighton. Ông nói: “Tôi đã chứng kiến ​​bệnh cây du Hà Lan lây lan khi còn là một cậu bé. ‘Cây du dường như là một phần của vùng nông thôn nước Anh, nhưng tôi nhớ đã chứng kiến ​​những cây rụng lá và điều đó thực sự đọng lại trong tôi.’ Ngày nay, tổng số cây du ở thành phố Brighton có khoảng 17.000 cây.\",\"Các yếu tố địa phương dường như đã góp phần vào sự sống còn của họ.\",\"Gió mạnh từ biển khiến loài bọ vỏ cây du khó tấn công quần thể cây du của thành phố ven biển này.\",\"Tuy nhiên, tình hình rất bấp bênh. Bourne nói: “Bọn bọ có thể tiến vào nếu chúng ta không cẩn thận, vì mối đe dọa đang ở ngay trước cửa nhà chúng ta”.\"]},{\"en\":[\"Any prospect of the elm returning relies heavily on trees being either resistant to, or tolerant of, the disease.\",\"This means a widespread reintroduction would involve existing or new hybrid strains derived from resistant, generally non-native elm species.\",\"A new generation of seedlings have been bred and tested to see if they can withstand the fungus by cutting a small slit on the bark and injecting a tiny amount of the pathogen. ‘The effects are very quick,’ says Russell. ‘You return in four to six weeks and trees that are resistant show no symptoms, whereas those that are susceptible show leaf loss and may even have died completely.’\"],\"vi\":[\"Bất kỳ triển vọng nào về việc cây du quay trở lại đều phụ thuộc rất nhiều vào việc cây có khả năng kháng cự hoặc chịu đựng được bệnh tật hay không.\",\"Điều này có nghĩa là việc tái trồng rộng rãi sẽ liên quan đến các chủng lai hiện có hoặc mới có nguồn gốc từ các loài cây du không bản địa có khả năng kháng bệnh.\",\"Một thế hệ cây con mới đã được nhân giống và thử nghiệm để xem liệu chúng có thể chịu được nấm hay không bằng cách cắt một khe nhỏ trên vỏ cây và tiêm một lượng nhỏ mầm bệnh. Russell nói: “Hiệu quả rất nhanh chóng”. ‘Bạn quay trở lại sau 4 đến 6 tuần và những cây kháng bệnh không có triệu chứng, trong khi những cây mẫn cảm sẽ bị rụng lá và thậm chí có thể chết hoàn toàn.’\"]},{\"en\":[\"All of this raises questions of social acceptance, acknowledges Russell. ‘If we’re putting elm back into the landscape, a small element of it is not native – are we bothered about that?’ For her, the environmental case for reintroducing elm is strong. ‘They will host wildlife, which is a good thing.\",\"Others are more wary. ‘On the face of it, it seems like a good idea,’ says Elliot.\",\"The problem, he suggests, is that, ‘You’re replacing a native species with a horticultural analogue*.\",\"You’re effectively cloning.’ There’s also the risk of introducing new diseases.\",\"Rather than plant new elms, the Woodland Trust emphasises providing space to those elms that have survived independently. ‘Sometimes the best thing you can do is just give nature time to recover over time, you might get resistance,’ says Elliot.\"],\"vi\":[\"Russell thừa nhận tất cả những điều này đặt ra câu hỏi về sự chấp nhận của xã hội. ‘Nếu chúng ta đưa cây du trở lại cảnh quan, một phần nhỏ của nó không phải là cây bản địa – chúng ta có bận tâm về điều đó không?’ Đối với cô ấy, trường hợp môi trường để giới thiệu lại cây du là rất mạnh mẽ. ‘Họ sẽ tiếp đón động vật hoang dã, đó là một điều tốt.\",\"Những người khác thì cảnh giác hơn. “Nhìn bề ngoài thì đó có vẻ là một ý tưởng hay,” Elliot nói.\",\"Ông gợi ý rằng vấn đề là 'Bạn đang thay thế một loài bản địa bằng một loài tương tự trong nghề làm vườn*.\",\"Bạn đang nhân bản một cách hiệu quả.’ Ngoài ra còn có nguy cơ gây ra các bệnh mới.\",\"Thay vì trồng những cây du mới, Woodland Trust nhấn mạnh việc cung cấp không gian cho những cây du sống sót độc lập. Elliot nói: “Đôi khi, điều tốt nhất bạn có thể làm chỉ là cho thiên nhiên thời gian để phục hồi theo thời gian, nếu không bạn có thể gặp phải sự phản kháng.\"]}],\"timeLimit\":20},{\"name\":\"CAM 20 TEST 1 (P3)\",\"articleHtml\":\"\\u003cdiv class=\\\"reading-content\\\">\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph A\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s0\\\">Some of the most important decisions of our lives occur while we’re feeling stressed and anxious. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s1\\\">From medical decisions to financial and professional ones, we are all sometimes required to weigh up information under stressful conditions. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p0s2\\\">But do we become better or worse at processing and using information under such circumstances? \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t0')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t0\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p0s0\\\" class=\\\"vi-sent\\\">Một số quyết định quan trọng nhất trong cuộc đời chúng ta xảy ra khi chúng ta đang cảm thấy căng thẳng và lo lắng. \\u003c/span>\\u003cspan id=\\\"p0s1\\\" class=\\\"vi-sent\\\">Từ các quyết định y tế đến các quyết định tài chính và chuyên môn, đôi khi tất cả chúng ta đều phải cân nhắc thông tin trong những điều kiện căng thẳng. \\u003c/span>\\u003cspan id=\\\"p0s2\\\" class=\\\"vi-sent\\\">Nhưng chúng ta xử lý và sử dụng thông tin tốt hơn hay tệ hơn trong những trường hợp như vậy? \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph B\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s0\\\">My colleague and I, both neuroscientists, wanted to investigate how the mind operates under stress, so we visited some local fire stations. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s1\\\">Firefighters’ workdays vary quite a bit. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s2\\\">Some are pretty relaxed; they’ll spend their time washing the truck, cleaning equipment, cooking meals and reading. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s3\\\">Other days can be hectic, with numerous life-threatening incidents to attend to; they’ll enter burning homes to rescue trapped residents, and assist with medical emergencies. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p1s4\\\">These ups and downs presented the perfect setting for an experiment on how people’s ability to use information changes when they feel under pressure. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t1')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t1\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p1s0\\\" class=\\\"vi-sent\\\">Đồng nghiệp của tôi và tôi, cả hai đều là nhà thần kinh học, muốn nghiên cứu cách thức hoạt động của tâm trí khi bị căng thẳng, vì vậy chúng tôi đã đến thăm một số trạm cứu hỏa địa phương. \\u003c/span>\\u003cspan id=\\\"p1s1\\\" class=\\\"vi-sent\\\">Ngày làm việc của lính cứu hỏa thay đổi khá nhiều. \\u003c/span>\\u003cspan id=\\\"p1s2\\\" class=\\\"vi-sent\\\">Một số khá thoải mái; họ sẽ dành thời gian để rửa xe, lau chùi thiết bị, nấu ăn và đọc sách. \\u003c/span>\\u003cspan id=\\\"p1s3\\\" class=\\\"vi-sent\\\">Những ngày khác có thể rất bận rộn, với vô số sự cố nguy hiểm đến tính mạng cần phải giải quyết; họ sẽ vào những ngôi nhà đang cháy để giải cứu những người dân bị mắc kẹt và hỗ trợ các trường hợp khẩn cấp về y tế. \\u003c/span>\\u003cspan id=\\\"p1s4\\\" class=\\\"vi-sent\\\">Những thăng trầm này là bối cảnh hoàn hảo cho một cuộc thử nghiệm về khả năng sử dụng thông tin của con người thay đổi như thế nào khi họ cảm thấy bị áp lực. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph C\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p2s0\\\">We found that perceived threat acted as a trigger for a stress reaction that made the task of processing information easier for the firefighters – but only as long as it conveyed bad news. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t2')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t2\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p2s0\\\" class=\\\"vi-sent\\\">Chúng tôi nhận thấy rằng mối đe dọa được nhận thức đóng vai trò là tác nhân gây ra phản ứng căng thẳng, khiến nhiệm vụ xử lý thông tin trở nên dễ dàng hơn đối với lính cứu hỏa – nhưng chỉ với điều kiện nó truyền tải tin xấu. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph D\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s0\\\">This is how we arrived at these results. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s1\\\">We asked the firefighters to estimate their likelihood of experiencing 40 different adverse events in their life, such as being involved in an accident or becoming a victim of card fraud. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p3s2\\\">We then gave them either good news (that their likelihood of experiencing these events was lower than they’d thought) or bad news (that it was higher) and asked them to provide new estimates. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t3')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t3\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p3s0\\\" class=\\\"vi-sent\\\">Đây là cách chúng tôi đạt được những kết quả này. \\u003c/span>\\u003cspan id=\\\"p3s1\\\" class=\\\"vi-sent\\\">Chúng tôi đã yêu cầu những người lính cứu hỏa ước tính khả năng họ gặp phải 40 sự kiện bất lợi khác nhau trong cuộc đời, chẳng hạn như bị tai nạn hoặc trở thành nạn nhân của một vụ lừa đảo thẻ. \\u003c/span>\\u003cspan id=\\\"p3s2\\\" class=\\\"vi-sent\\\">Sau đó, chúng tôi đưa cho họ tin tốt (rằng khả năng họ gặp phải những sự kiện này thấp hơn họ nghĩ) hoặc tin xấu (rằng khả năng xảy ra cao hơn) và yêu cầu họ đưa ra những ước tính mới. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph E\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s0\\\">People are normally quite optimistic – they will ignore bad news and embrace the good. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s1\\\">This is what happened when the firefighters were relaxed; but when they were under stress, a different pattern emerged. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s2\\\">Under these conditions, they became hyper-vigilant to bad news, even when it had nothing to do with their job (such as learning that the likelihood of card fraud was higher than they’d thought), and altered their beliefs in response. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p4s3\\\">In contrast, stress didn’t change how they responded to good news (such as learning that the likelihood of card fraud was lower than they’d thought). \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t4')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t4\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p4s0\\\" class=\\\"vi-sent\\\">Mọi người thường khá lạc quan – họ sẽ bỏ qua những tin xấu và đón nhận những điều tốt đẹp. \\u003c/span>\\u003cspan id=\\\"p4s1\\\" class=\\\"vi-sent\\\">Đây là điều đã xảy ra khi những người lính cứu hỏa đang thư giãn; nhưng khi họ gặp căng thẳng, một mô hình khác lại xuất hiện. \\u003c/span>\\u003cspan id=\\\"p4s2\\\" class=\\\"vi-sent\\\">Trong những điều kiện này, họ trở nên hết sức cảnh giác trước những tin xấu, ngay cả khi nó không liên quan gì đến công việc của họ (chẳng hạn như biết rằng khả năng xảy ra gian lận thẻ cao hơn họ nghĩ) và thay đổi niềm tin của họ để phản ứng lại. \\u003c/span>\\u003cspan id=\\\"p4s3\\\" class=\\\"vi-sent\\\">Ngược lại, căng thẳng không làm thay đổi cách họ phản ứng với tin tốt (chẳng hạn như biết rằng khả năng gian lận thẻ thấp hơn họ nghĩ). \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph F\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s0\\\">Back in our lab, we observed the same pattern in students who were told they had to give a surprise public speech, which would be judged by a panel, recorded and posted online. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p5s1\\\">Sure enough, their cortisol levels spiked, their heart rates went up and they suddenly became better at processing unrelated, yet alarming, information about rates of disease and violence. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t5')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t5\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p5s0\\\" class=\\\"vi-sent\\\">Trở lại phòng thí nghiệm của chúng tôi, chúng tôi quan sát thấy mô hình tương tự ở những sinh viên được yêu cầu họ phải có một bài phát biểu bất ngờ trước công chúng, bài phát biểu này sẽ được một hội đồng đánh giá, ghi lại và đăng trực tuyến. \\u003c/span>\\u003cspan id=\\\"p5s1\\\" class=\\\"vi-sent\\\">Chắc chắn rồi, nồng độ cortisol của họ tăng vọt, nhịp tim tăng lên và họ đột nhiên xử lý tốt hơn những thông tin không liên quan nhưng đáng báo động về tỷ lệ bệnh tật và bạo lực. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph G\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s0\\\">When we experience stressful events, a physiological change is triggered that causes us to take in warnings and focus on what might go wrong. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p6s1\\\">Brain imaging reveals that this ‘switch’ is related to a sudden boost in a neural signal important for learning, specifically in response to unexpected warning signs, such as faces expressing fear. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t6')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t6\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p6s0\\\" class=\\\"vi-sent\\\">Khi chúng ta trải qua những sự kiện căng thẳng, một sự thay đổi sinh lý được kích hoạt khiến chúng ta phải cảnh báo và tập trung vào những gì có thể xảy ra. \\u003c/span>\\u003cspan id=\\\"p6s1\\\" class=\\\"vi-sent\\\">Hình ảnh chụp não cho thấy ‘công tắc’ này có liên quan đến sự tăng đột ngột của tín hiệu thần kinh quan trọng đối với việc học tập, đặc biệt là để phản ứng với các dấu hiệu cảnh báo bất ngờ, chẳng hạn như khuôn mặt thể hiện sự sợ hãi. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph H\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s0\\\">Such neural engineering could have helped prehistoric humans to survive. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s1\\\">When our ancestors found themselves surrounded by hungry animals, they would have benefited from an increased ability to learn about hazards. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s2\\\">In a safe environment, however, it would have been wasteful to be on high alert constantly. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s3\\\">So, a neural switch that automatically increases or decreases our ability to process warnings in response to changes in our environment could have been useful. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p7s4\\\">In fact, people with clinical depression and anxiety seem unable to switch away from a state in which they absorb all the negative messages around them. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t7')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t7\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p7s0\\\" class=\\\"vi-sent\\\">Kỹ thuật thần kinh như vậy có thể đã giúp con người thời tiền sử tồn tại. \\u003c/span>\\u003cspan id=\\\"p7s1\\\" class=\\\"vi-sent\\\">Khi tổ tiên của chúng ta thấy mình bị bao vây bởi những động vật đói khát, họ sẽ được hưởng lợi từ khả năng tìm hiểu về các mối nguy hiểm ngày càng tăng. \\u003c/span>\\u003cspan id=\\\"p7s2\\\" class=\\\"vi-sent\\\">Tuy nhiên, trong một môi trường an toàn, sẽ thật lãng phí nếu liên tục cảnh giác cao độ. \\u003c/span>\\u003cspan id=\\\"p7s3\\\" class=\\\"vi-sent\\\">Vì vậy, một công tắc thần kinh tự động tăng hoặc giảm khả năng xử lý cảnh báo của chúng ta để ứng phó với những thay đổi trong môi trường của chúng ta có thể hữu ích. \\u003c/span>\\u003cspan id=\\\"p7s4\\\" class=\\\"vi-sent\\\">Trên thực tế, những người bị trầm cảm và lo âu lâm sàng dường như không thể thoát khỏi trạng thái hấp thụ tất cả những thông điệp tiêu cực xung quanh mình. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph I\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s0\\\">It is also important to realise that stress travels rapidly from one person to the next. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s1\\\">If a co-worker is stressed, we are more likely to tense up and feel stressed ourselves. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s2\\\">We don’t even need to be in the same room with someone for their emotions to influence our behaviour. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s3\\\">Studies show that if we observe positive feeds on social media, such as images of a pink sunset, we are more likely to post uplifting messages ourselves. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p8s4\\\">If we observe negative posts, such as complaints about a long queue at the coffee shop, we will in turn create more negative posts. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t8')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t8\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p8s0\\\" class=\\\"vi-sent\\\">Điều quan trọng là phải nhận ra rằng căng thẳng di chuyển nhanh chóng từ người này sang người khác. \\u003c/span>\\u003cspan id=\\\"p8s1\\\" class=\\\"vi-sent\\\">Nếu đồng nghiệp bị căng thẳng, chúng ta sẽ dễ căng thẳng hơn và bản thân cũng cảm thấy căng thẳng. \\u003c/span>\\u003cspan id=\\\"p8s2\\\" class=\\\"vi-sent\\\">Chúng ta thậm chí không cần ở cùng phòng với ai đó để cảm xúc của họ ảnh hưởng đến hành vi của chúng ta. \\u003c/span>\\u003cspan id=\\\"p8s3\\\" class=\\\"vi-sent\\\">Các nghiên cứu cho thấy rằng nếu chúng ta quan sát các nguồn cấp dữ liệu tích cực trên mạng xã hội, chẳng hạn như hình ảnh về hoàng hôn màu hồng, chúng ta có nhiều khả năng tự đăng những thông điệp nâng cao tinh thần hơn. \\u003c/span>\\u003cspan id=\\\"p8s4\\\" class=\\\"vi-sent\\\">Nếu chúng tôi quan sát thấy các bài đăng tiêu cực, chẳng hạn như phàn nàn về việc phải xếp hàng dài ở quán cà phê, thì chúng tôi sẽ tạo ra nhiều bài đăng tiêu cực hơn. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph J\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s0\\\">In some ways, many of us now live as if we are in danger, constantly ready to tackle demanding emails and text messages, and respond to news alerts and comments on social media. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s1\\\">Repeatedly checking your phone, according to a survey conducted by the American Psychological Association, is related to stress. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s2\\\">In other words, a pre-programmed physiological reaction, which evolution has equipped us with to help us avoid famished predators, is now being triggered by an online post. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p9s3\\\">Social media posting, according to one study, raises your pulse, makes you sweat, and enlarges your pupils more than most daily activities. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t9')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t9\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p9s0\\\" class=\\\"vi-sent\\\">Theo một cách nào đó, nhiều người trong chúng ta hiện đang sống như thể mình đang gặp nguy hiểm, liên tục sẵn sàng giải quyết các email và tin nhắn văn bản có yêu cầu cao cũng như trả lời các thông báo tin tức và bình luận trên mạng xã hội. \\u003c/span>\\u003cspan id=\\\"p9s1\\\" class=\\\"vi-sent\\\">Theo một cuộc khảo sát do Hiệp hội Tâm lý Hoa Kỳ thực hiện, việc liên tục kiểm tra điện thoại có liên quan đến căng thẳng. \\u003c/span>\\u003cspan id=\\\"p9s2\\\" class=\\\"vi-sent\\\">Nói cách khác, một phản ứng sinh lý được lập trình sẵn mà quá trình tiến hóa đã trang bị cho chúng ta để giúp chúng ta tránh khỏi những kẻ săn mồi đói khát, hiện đang được kích hoạt bởi một bài đăng trực tuyến. \\u003c/span>\\u003cspan id=\\\"p9s3\\\" class=\\\"vi-sent\\\">Theo một nghiên cứu, việc đăng bài trên mạng xã hội sẽ làm tăng nhịp tim, khiến bạn đổ mồ hôi và đồng tử nở to hơn hầu hết các hoạt động hàng ngày. \\u003c/span>\\u003c/div>\\u003c/div>\\u003cdiv class=\\\"para-box\\\">\\u003cdiv class=\\\"para-header-row\\\">\\u003cdiv class=\\\"para-header\\\">Paragraph K\\u003c/div>\\u003c/div>\\u003cp class=\\\"en-text\\\">\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s0\\\">The fact that stress increases the likelihood that we will focus more on alarming messages, together with the fact that it spreads extremely rapidly, can create collective fear that is not always justified. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s1\\\">After a stressful public event, such as a natural disaster or major financial crash, there is often a wave of alarming information in traditional and social media, which individuals become very aware of. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s2\\\">But that has the effect of exaggerating existing danger. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s3\\\">And so, a reliable pattern emerges – stress is triggered, spreading from one person to the next, which temporarily enhances the likelihood that people will take in negative reports, which increases stress further. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s4\\\">As a result, trips are cancelled, even if the disaster took place across the globe; stocks are sold, even when holding on is the best thing to do. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s5\\\">The good news, however, is that positive emotions, such as hope, are contagious too, and are powerful in inducing people to act to find solutions. \\u003c/span>\\u003cspan class=\\\"sent\\\" data-target=\\\"p10s6\\\">Being aware of the close relationship between people’s emotional state and how they process information can help us frame our messages more effectively and become conscientious agents of change. \\u003c/span>\\u003c/p>\\u003cbutton class=\\\"trans-btn\\\" onclick=\\\"toggleTrans('t10')\\\">Show Translation\\u003c/button>\\u003cdiv id=\\\"t10\\\" class=\\\"vi-text hidden\\\">\\u003cspan id=\\\"p10s0\\\" class=\\\"vi-sent\\\">Thực tế là căng thẳng làm tăng khả năng chúng ta tập trung nhiều hơn vào những thông điệp đáng báo động, cùng với việc nó lây lan cực kỳ nhanh chóng, có thể tạo ra nỗi sợ hãi chung không phải lúc nào cũng chính đáng. \\u003c/span>\\u003cspan id=\\\"p10s1\\\" class=\\\"vi-sent\\\">Sau một sự kiện công cộng căng thẳng, chẳng hạn như thiên tai hoặc khủng hoảng tài chính lớn, thường có một làn sóng thông tin đáng báo động trên các phương tiện truyền thông xã hội và truyền thống mà các cá nhân nhận thức rất rõ ràng. \\u003c/span>\\u003cspan id=\\\"p10s2\\\" class=\\\"vi-sent\\\">Nhưng điều đó có tác dụng phóng đại mối nguy hiểm hiện có. \\u003c/span>\\u003cspan id=\\\"p10s3\\\" class=\\\"vi-sent\\\">Và do đó, một mô hình đáng tin cậy xuất hiện - căng thẳng được kích hoạt, lan truyền từ người này sang người khác, điều này tạm thời làm tăng khả năng mọi người sẽ tiếp nhận những báo cáo tiêu cực, điều này càng làm tăng thêm căng thẳng. \\u003c/span>\\u003cspan id=\\\"p10s4\\\" class=\\\"vi-sent\\\">Kết quả là các chuyến đi bị hủy bỏ, ngay cả khi thảm họa xảy ra trên toàn cầu; cổ phiếu được bán ngay cả khi nắm giữ là điều tốt nhất nên làm. \\u003c/span>\\u003cspan id=\\\"p10s5\\\" class=\\\"vi-sent\\\">Tuy nhiên, tin tốt là những cảm xúc tích cực, chẳng hạn như hy vọng, cũng có tính lây lan và có tác dụng mạnh mẽ trong việc thúc đẩy mọi người hành động để tìm ra giải pháp. \\u003c/span>\\u003cspan id=\\\"p10s6\\\" class=\\\"vi-sent\\\">Nhận thức được mối quan hệ chặt chẽ giữa trạng thái cảm xúc của mọi người và cách họ xử lý thông tin có thể giúp chúng ta sắp xếp thông điệp của mình hiệu quả hơn và trở thành tác nhân tận tâm của sự thay đổi. \\u003c/span>\\u003c/div>\\u003c/div>\\u003c/div>\",\"headingsHtml\":\"\",\"qs\":[{\"id\":27,\"type\":\"mcq\",\"text\":\"In the first paragraph, the writer introduces the topic of the text by\",\"options\":[\"A   defining some commonly used terms.\",\"B   questioning a widely held assumption.\",\"C   mentioning a challenge faced by everyone.\",\"D   specifying a situation which makes us most anxious.\"],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":27},{\"id\":28,\"type\":\"mcq\",\"text\":\"What point does the writer make about firefighters in the second paragraph?\",\"options\":[\"A   The regular changes of stress levels in their working lives make them ideal study subjects.\",\"B   The strategies they use to handle stress are of particular interest to researchers.\",\"C   The stressful nature of their job is typical of many public service professions.\",\"D   Their personalities make them especially well-suited to working under stress.\"],\"correctAnswer\":\"A\",\"location\":\"\",\"_orderId\":28},{\"id\":29,\"type\":\"mcq\",\"text\":\"What is the writer doing in the fourth paragraph?\",\"options\":[\"A   explaining their findings\",\"B   justifying their approach\",\"C   setting out their objectives\",\"D   describing their methodology\"],\"correctAnswer\":\"D\",\"location\":\"\",\"_orderId\":29},{\"id\":30,\"type\":\"mcq\",\"text\":\"In the seventh paragraph, the writer describes a mechanism in the brain which\",\"options\":[\"A   enables people to respond more quickly to stressful situations.\",\"B   results in increased ability to control our levels of anxiety.\",\"C   produces heightened sensitivity to indications of external threats.\",\"D   is activated when there is a need to communicate a sense of danger.\"],\"correctAnswer\":\"C\",\"location\":\"\",\"_orderId\":30},{\"type\":\"summary\",\"isFeature\":true,\"id\":31,\"text\":\"31 …   At times when they were relaxed, the firefighters usually\\n32 …   The researchers noted that when the firefighters were stressed, they\\n33 …   When the firefighters were told good news, they always\\n34 …   The students’ cortisol levels and heart rates were affected when the researchers\\n35 …   In both experiments, negative information was processed better when the subjects\",\"gapIds\":[31,32,33,34,35],\"options\":[\"A   made them feel optimistic.\",\"B   took relatively little notice of bad news.\",\"C   responded to negative and positive information in the same way.\",\"D   were feeling under stress.\",\"E   put them in a stressful situation.\",\"F   behaved in a similar manner, regardless of the circumstances.\",\"G   thought it more likely that they would experience something bad.\"],\"answers\":{\"31\":\"B\",\"32\":\"G\",\"33\":\"F\",\"34\":\"E\",\"35\":\"D\"},\"locations\":{},\"_orderId\":31},{\"id\":36,\"type\":\"ynng\",\"text\":\"The tone of the content we post on social media tends to reflect the nature of the posts in our feeds.\",\"options\":[],\"correctAnswer\":\"YES\",\"location\":\"\",\"_orderId\":36},{\"id\":37,\"type\":\"ynng\",\"text\":\"Phones have a greater impact on our stress levels than other electronic media devices.\",\"options\":[],\"correctAnswer\":\"NOT GIVEN\",\"location\":\"\",\"_orderId\":37},{\"id\":38,\"type\":\"ynng\",\"text\":\"The more we read about a stressful public event on social media, the less able we are to take the information in.\",\"options\":[],\"correctAnswer\":\"N0\",\"location\":\"\",\"_orderId\":38},{\"id\":39,\"type\":\"ynng\",\"text\":\"Stress created by social media posts can lead us to take unnecessary precautions.\",\"options\":[],\"correctAnswer\":\"YES\",\"location\":\"\",\"_orderId\":39},{\"id\":40,\"type\":\"ynng\",\"text\":\"Our tendency to be affected by other people’s moods can be used in a positive way.\",\"options\":[],\"correctAnswer\":\"YES\",\"location\":\"\",\"_orderId\":40}],\"vocab\":[],\"headings\":[],\"headingKey\":{},\"mifRange\":\"\",\"removeOpt\":false,\"removeFeatureOpt\":true,\"pairs\":[],\"pData\":[{\"en\":[\"Some of the most important decisions of our lives occur while we’re feeling stressed and anxious.\",\"From medical decisions to financial and professional ones, we are all sometimes required to weigh up information under stressful conditions.\",\"But do we become better or worse at processing and using information under such circumstances?\"],\"vi\":[\"Một số quyết định quan trọng nhất trong cuộc đời chúng ta xảy ra khi chúng ta đang cảm thấy căng thẳng và lo lắng.\",\"Từ các quyết định y tế đến các quyết định tài chính và chuyên môn, đôi khi tất cả chúng ta đều phải cân nhắc thông tin trong những điều kiện căng thẳng.\",\"Nhưng chúng ta xử lý và sử dụng thông tin tốt hơn hay tệ hơn trong những trường hợp như vậy?\"]},{\"en\":[\"My colleague and I, both neuroscientists, wanted to investigate how the mind operates under stress, so we visited some local fire stations.\",\"Firefighters’ workdays vary quite a bit.\",\"Some are pretty relaxed; they’ll spend their time washing the truck, cleaning equipment, cooking meals and reading.\",\"Other days can be hectic, with numerous life-threatening incidents to attend to; they’ll enter burning homes to rescue trapped residents, and assist with medical emergencies.\",\"These ups and downs presented the perfect setting for an experiment on how people’s ability to use information changes when they feel under pressure.\"],\"vi\":[\"Đồng nghiệp của tôi và tôi, cả hai đều là nhà thần kinh học, muốn nghiên cứu cách thức hoạt động của tâm trí khi bị căng thẳng, vì vậy chúng tôi đã đến thăm một số trạm cứu hỏa địa phương.\",\"Ngày làm việc của lính cứu hỏa thay đổi khá nhiều.\",\"Một số khá thoải mái; họ sẽ dành thời gian để rửa xe, lau chùi thiết bị, nấu ăn và đọc sách.\",\"Những ngày khác có thể rất bận rộn, với vô số sự cố nguy hiểm đến tính mạng cần phải giải quyết; họ sẽ vào những ngôi nhà đang cháy để giải cứu những người dân bị mắc kẹt và hỗ trợ các trường hợp khẩn cấp về y tế.\",\"Những thăng trầm này là bối cảnh hoàn hảo cho một cuộc thử nghiệm về khả năng sử dụng thông tin của con người thay đổi như thế nào khi họ cảm thấy bị áp lực.\"]},{\"en\":[\"We found that perceived threat acted as a trigger for a stress reaction that made the task of processing information easier for the firefighters – but only as long as it conveyed bad news.\"],\"vi\":[\"Chúng tôi nhận thấy rằng mối đe dọa được nhận thức đóng vai trò là tác nhân gây ra phản ứng căng thẳng, khiến nhiệm vụ xử lý thông tin trở nên dễ dàng hơn đối với lính cứu hỏa – nhưng chỉ với điều kiện nó truyền tải tin xấu.\"]},{\"en\":[\"This is how we arrived at these results.\",\"We asked the firefighters to estimate their likelihood of experiencing 40 different adverse events in their life, such as being involved in an accident or becoming a victim of card fraud.\",\"We then gave them either good news (that their likelihood of experiencing these events was lower than they’d thought) or bad news (that it was higher) and asked them to provide new estimates.\"],\"vi\":[\"Đây là cách chúng tôi đạt được những kết quả này.\",\"Chúng tôi đã yêu cầu những người lính cứu hỏa ước tính khả năng họ gặp phải 40 sự kiện bất lợi khác nhau trong cuộc đời, chẳng hạn như bị tai nạn hoặc trở thành nạn nhân của một vụ lừa đảo thẻ.\",\"Sau đó, chúng tôi đưa cho họ tin tốt (rằng khả năng họ gặp phải những sự kiện này thấp hơn họ nghĩ) hoặc tin xấu (rằng khả năng xảy ra cao hơn) và yêu cầu họ đưa ra những ước tính mới.\"]},{\"en\":[\"People are normally quite optimistic – they will ignore bad news and embrace the good.\",\"This is what happened when the firefighters were relaxed; but when they were under stress, a different pattern emerged.\",\"Under these conditions, they became hyper-vigilant to bad news, even when it had nothing to do with their job (such as learning that the likelihood of card fraud was higher than they’d thought), and altered their beliefs in response.\",\"In contrast, stress didn’t change how they responded to good news (such as learning that the likelihood of card fraud was lower than they’d thought).\"],\"vi\":[\"Mọi người thường khá lạc quan – họ sẽ bỏ qua những tin xấu và đón nhận những điều tốt đẹp.\",\"Đây là điều đã xảy ra khi những người lính cứu hỏa đang thư giãn; nhưng khi họ gặp căng thẳng, một mô hình khác lại xuất hiện.\",\"Trong những điều kiện này, họ trở nên hết sức cảnh giác trước những tin xấu, ngay cả khi nó không liên quan gì đến công việc của họ (chẳng hạn như biết rằng khả năng xảy ra gian lận thẻ cao hơn họ nghĩ) và thay đổi niềm tin của họ để phản ứng lại.\",\"Ngược lại, căng thẳng không làm thay đổi cách họ phản ứng với tin tốt (chẳng hạn như biết rằng khả năng gian lận thẻ thấp hơn họ nghĩ).\"]},{\"en\":[\"Back in our lab, we observed the same pattern in students who were told they had to give a surprise public speech, which would be judged by a panel, recorded and posted online.\",\"Sure enough, their cortisol levels spiked, their heart rates went up and they suddenly became better at processing unrelated, yet alarming, information about rates of disease and violence.\"],\"vi\":[\"Trở lại phòng thí nghiệm của chúng tôi, chúng tôi quan sát thấy mô hình tương tự ở những sinh viên được yêu cầu họ phải có một bài phát biểu bất ngờ trước công chúng, bài phát biểu này sẽ được một hội đồng đánh giá, ghi lại và đăng trực tuyến.\",\"Chắc chắn rồi, nồng độ cortisol của họ tăng vọt, nhịp tim tăng lên và họ đột nhiên xử lý tốt hơn những thông tin không liên quan nhưng đáng báo động về tỷ lệ bệnh tật và bạo lực.\"]},{\"en\":[\"When we experience stressful events, a physiological change is triggered that causes us to take in warnings and focus on what might go wrong.\",\"Brain imaging reveals that this ‘switch’ is related to a sudden boost in a neural signal important for learning, specifically in response to unexpected warning signs, such as faces expressing fear.\"],\"vi\":[\"Khi chúng ta trải qua những sự kiện căng thẳng, một sự thay đổi sinh lý được kích hoạt khiến chúng ta phải cảnh báo và tập trung vào những gì có thể xảy ra.\",\"Hình ảnh chụp não cho thấy ‘công tắc’ này có liên quan đến sự tăng đột ngột của tín hiệu thần kinh quan trọng đối với việc học tập, đặc biệt là để phản ứng với các dấu hiệu cảnh báo bất ngờ, chẳng hạn như khuôn mặt thể hiện sự sợ hãi.\"]},{\"en\":[\"Such neural engineering could have helped prehistoric humans to survive.\",\"When our ancestors found themselves surrounded by hungry animals, they would have benefited from an increased ability to learn about hazards.\",\"In a safe environment, however, it would have been wasteful to be on high alert constantly.\",\"So, a neural switch that automatically increases or decreases our ability to process warnings in response to changes in our environment could have been useful.\",\"In fact, people with clinical depression and anxiety seem unable to switch away from a state in which they absorb all the negative messages around them.\"],\"vi\":[\"Kỹ thuật thần kinh như vậy có thể đã giúp con người thời tiền sử tồn tại.\",\"Khi tổ tiên của chúng ta thấy mình bị bao vây bởi những động vật đói khát, họ sẽ được hưởng lợi từ khả năng tìm hiểu về các mối nguy hiểm ngày càng tăng.\",\"Tuy nhiên, trong một môi trường an toàn, sẽ thật lãng phí nếu liên tục cảnh giác cao độ.\",\"Vì vậy, một công tắc thần kinh tự động tăng hoặc giảm khả năng xử lý cảnh báo của chúng ta để ứng phó với những thay đổi trong môi trường của chúng ta có thể hữu ích.\",\"Trên thực tế, những người bị trầm cảm và lo âu lâm sàng dường như không thể thoát khỏi trạng thái hấp thụ tất cả những thông điệp tiêu cực xung quanh mình.\"]},{\"en\":[\"It is also important to realise that stress travels rapidly from one person to the next.\",\"If a co-worker is stressed, we are more likely to tense up and feel stressed ourselves.\",\"We don’t even need to be in the same room with someone for their emotions to influence our behaviour.\",\"Studies show that if we observe positive feeds on social media, such as images of a pink sunset, we are more likely to post uplifting messages ourselves.\",\"If we observe negative posts, such as complaints about a long queue at the coffee shop, we will in turn create more negative posts.\"],\"vi\":[\"Điều quan trọng là phải nhận ra rằng căng thẳng di chuyển nhanh chóng từ người này sang người khác.\",\"Nếu đồng nghiệp bị căng thẳng, chúng ta sẽ dễ căng thẳng hơn và bản thân cũng cảm thấy căng thẳng.\",\"Chúng ta thậm chí không cần ở cùng phòng với ai đó để cảm xúc của họ ảnh hưởng đến hành vi của chúng ta.\",\"Các nghiên cứu cho thấy rằng nếu chúng ta quan sát các nguồn cấp dữ liệu tích cực trên mạng xã hội, chẳng hạn như hình ảnh về hoàng hôn màu hồng, chúng ta có nhiều khả năng tự đăng những thông điệp nâng cao tinh thần hơn.\",\"Nếu chúng tôi quan sát thấy các bài đăng tiêu cực, chẳng hạn như phàn nàn về việc phải xếp hàng dài ở quán cà phê, thì chúng tôi sẽ tạo ra nhiều bài đăng tiêu cực hơn.\"]},{\"en\":[\"In some ways, many of us now live as if we are in danger, constantly ready to tackle demanding emails and text messages, and respond to news alerts and comments on social media.\",\"Repeatedly checking your phone, according to a survey conducted by the American Psychological Association, is related to stress.\",\"In other words, a pre-programmed physiological reaction, which evolution has equipped us with to help us avoid famished predators, is now being triggered by an online post.\",\"Social media posting, according to one study, raises your pulse, makes you sweat, and enlarges your pupils more than most daily activities.\"],\"vi\":[\"Theo một cách nào đó, nhiều người trong chúng ta hiện đang sống như thể mình đang gặp nguy hiểm, liên tục sẵn sàng giải quyết các email và tin nhắn văn bản có yêu cầu cao cũng như trả lời các thông báo tin tức và bình luận trên mạng xã hội.\",\"Theo một cuộc khảo sát do Hiệp hội Tâm lý Hoa Kỳ thực hiện, việc liên tục kiểm tra điện thoại có liên quan đến căng thẳng.\",\"Nói cách khác, một phản ứng sinh lý được lập trình sẵn mà quá trình tiến hóa đã trang bị cho chúng ta để giúp chúng ta tránh khỏi những kẻ săn mồi đói khát, hiện đang được kích hoạt bởi một bài đăng trực tuyến.\",\"Theo một nghiên cứu, việc đăng bài trên mạng xã hội sẽ làm tăng nhịp tim, khiến bạn đổ mồ hôi và đồng tử nở to hơn hầu hết các hoạt động hàng ngày.\"]},{\"en\":[\"The fact that stress increases the likelihood that we will focus more on alarming messages, together with the fact that it spreads extremely rapidly, can create collective fear that is not always justified.\",\"After a stressful public event, such as a natural disaster or major financial crash, there is often a wave of alarming information in traditional and social media, which individuals become very aware of.\",\"But that has the effect of exaggerating existing danger.\",\"And so, a reliable pattern emerges – stress is triggered, spreading from one person to the next, which temporarily enhances the likelihood that people will take in negative reports, which increases stress further.\",\"As a result, trips are cancelled, even if the disaster took place across the globe; stocks are sold, even when holding on is the best thing to do.\",\"The good news, however, is that positive emotions, such as hope, are contagious too, and are powerful in inducing people to act to find solutions.\",\"Being aware of the close relationship between people’s emotional state and how they process information can help us frame our messages more effectively and become conscientious agents of change.\"],\"vi\":[\"Thực tế là căng thẳng làm tăng khả năng chúng ta tập trung nhiều hơn vào những thông điệp đáng báo động, cùng với việc nó lây lan cực kỳ nhanh chóng, có thể tạo ra nỗi sợ hãi chung không phải lúc nào cũng chính đáng.\",\"Sau một sự kiện công cộng căng thẳng, chẳng hạn như thiên tai hoặc khủng hoảng tài chính lớn, thường có một làn sóng thông tin đáng báo động trên các phương tiện truyền thông xã hội và truyền thống mà các cá nhân nhận thức rất rõ ràng.\",\"Nhưng điều đó có tác dụng phóng đại mối nguy hiểm hiện có.\",\"Và do đó, một mô hình đáng tin cậy xuất hiện - căng thẳng được kích hoạt, lan truyền từ người này sang người khác, điều này tạm thời làm tăng khả năng mọi người sẽ tiếp nhận những báo cáo tiêu cực, điều này càng làm tăng thêm căng thẳng.\",\"Kết quả là các chuyến đi bị hủy bỏ, ngay cả khi thảm họa xảy ra trên toàn cầu; cổ phiếu được bán ngay cả khi nắm giữ là điều tốt nhất nên làm.\",\"Tuy nhiên, tin tốt là những cảm xúc tích cực, chẳng hạn như hy vọng, cũng có tính lây lan và có tác dụng mạnh mẽ trong việc thúc đẩy mọi người hành động để tìm ra giải pháp.\",\"Nhận thức được mối quan hệ chặt chẽ giữa trạng thái cảm xúc của mọi người và cách họ xử lý thông tin có thể giúp chúng ta sắp xếp thông điệp của mình hiệu quả hơn và trở thành tác nhân tận tâm của sự thay đổi.\"]}],\"timeLimit\":20}];\n\nlet currentLessonIndex = 0;\nlet qs, vocab, headings, headingKey, mifRange, removeOpt, removeFeatureOpt, pairs, pData;\n\nlet timeLeft = 0;\nlet timerInterval;\nconst timerEl = document.getElementById('timer');\n\nfunction startTimer() {\n    timerInterval = setInterval(() => {\n        if(timeLeft <= 0) {\n            clearInterval(timerInterval);\n            timerEl.innerText = \"00:00\";\n            alert(\"Time is up!\");\n            return;\n        }\n        timeLeft--;\n        const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');\n        const s = (timeLeft % 60).toString().padStart(2, '0');\n        timerEl.innerText = `${m}:${s}`;\n    }, 1000);\n}\n\nfunction switchLesson(idx) {\n    currentLessonIndex = parseInt(idx);\n    const l = lessonsData[currentLessonIndex];\n    qs = l.qs; vocab = l.vocab; headings = l.headings; headingKey = l.headingKey;\n    mifRange = l.mifRange; removeOpt = l.removeOpt; removeFeatureOpt = l.removeFeatureOpt;\n    pairs = l.pairs; pData = l.pData;\n\n    // Reset UI\n    document.getElementById('articleArea').innerHTML = l.articleHtml;\n    document.getElementById('headingsArea').innerHTML = l.headingsHtml;\n    document.getElementById('qs').innerHTML = '';\n    document.getElementById('progressBar').innerHTML = '';\n    document.getElementById('saveBtn').style.display = 'none';\n    \n    // Reset Timer\n    clearInterval(timerInterval);\n    timeLeft = l.timeLimit * 60;\n    timerEl.innerText = \"--:--\";\n    startTimer();\n\n    // Render Questions & Attach Events\n    renderStudentQuestions();\n    attachEvents();\n\n    // Manage Views\n    if(document.getElementById('game-view').style.display === 'block') initGame();\n    if(document.getElementById('mif-view').style.display === 'flex') {\n        document.getElementById('mif-view').style.display = 'none';\n    }\n}\n\n// --- RENDERING QUESTIONS ---\nfunction renderStudentQuestions() {\n    const qDiv=document.getElementById('qs');\n    qDiv.innerHTML = '';\n    \n    qs.forEach(q=>{\n      if(q.type==='text-only'){ qDiv.innerHTML+=`<div class=\"text-only\">${q.text}</div>`; }\n      else if(q.type==='summary') { \n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          let txt = q.text.replace(/\\n/g, '<br>');\n          q.gapIds.forEach(gid => {\n              const isFeat = q.isFeature ? 'true' : 'false';\n              const dz = `<span class=\"drop-zone\" id=\"dz-${gid}\" data-gid=\"${gid}\" data-isfeat=\"${isFeat}\" ondragover=\"allowDrop(event)\" ondrop=\"drop(event)\" onclick=\"clearDrop(${gid})\"></span><span class=\"q-num\" style=\"vertical-align:super;font-size:10px\">${gid}</span>&nbsp;`;\n              let replaced = txt.replace(new RegExp(`${gid}\\\\s*([._…-]{2,}|_{2,}|…+)`), dz);\n              if(replaced === txt) replaced = txt.replace(new RegExp(`${gid}[.]\\\\s+`), dz + ' ');\n              txt = replaced;\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n          h += `<div style=\"line-height:2;font-size:15px\">${txt}</div><div style=\"margin-top:15px;display:flex;flex-wrap:wrap;gap:8px;padding-top:10px;border-top:1px dashed #e2e8f0\">`;\n          q.options.forEach(optLine => {\n              const m = optLine.match(/^([A-Z])\\s*[.)]?\\s*(.+)/);\n              if(m) h += `<div class=\"heading-item\" id=\"opt-${q.id}-${m[1]}\" style=\"display:inline-flex;width:auto;margin:0\" draggable=\"true\" ondragstart=\"drag(event)\" data-val=\"${m[1]}\"><span style=\"font-weight:bold;color:#2563eb\">${m[1]}</span> ${m[2]}</div>`;\n          });\n          h += `</div><div id=\"fb-${q.id}\" style=\"margin-top:10px; font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n      } \n      else if(q.type==='gap-fill-block') { \n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          let txt = q.text.replace(/\\n/g, '<br>'); \n          q.gapIds.forEach(gid => {\n              const loc = (q.locations && q.locations[gid]) ? q.locations[gid] : \"\";\n              const locBtn = loc ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${gid})\">📍</button>` : \"\";\n              const inp = `<span class=\"q-num\">${gid}</span><input type=\"text\" class=\"gap-input\" data-gid=\"${gid}\" oninput=\"upd(${gid})\">${locBtn}&nbsp;`;\t\n              txt = txt.replace(new RegExp(`${gid}[\\\\s:.)]*(?:[_….\\\\-]\\\\s*){2,}`), inp);\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n          h += `<div style=\"line-height:2.2;font-size:16px\">${txt}</div><div id=\"fb-${q.id}\" style=\"margin-top:10px; font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n      }\n      else if(q.type==='mcq-multi') {\n          let h = `<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n          const locBtn1 = (q.locations && q.locations[q.gapIds[0]]) ? `<button class=\"loc-btn\" onclick=\"showLoc(${q.id}, ${q.gapIds[0]})\">📍</button>` : \"\";\n          h += `<div style=\"display:flex;align-items:baseline;margin-bottom:8px;\"><span class=\"q-num\">${q.gapIds[0]}-${q.gapIds[q.gapIds.length-1]}</span> <span>${q.text}</span> ${locBtn1}</div>`;\n          q.options.forEach((o, i) => {\n              const optLetterMatch = o.match(/^([A-Z])/i);\n              const optLetter = optLetterMatch ? optLetterMatch[1].toUpperCase() : o.trim()[0].toUpperCase();\n              h += `<label style=\"display:block;margin:5px 0;cursor:pointer;transition:all 0.2s;\">\n                      <input type=\"checkbox\" name=\"mcq_${q.id}\" value=\"${optLetter}\" onchange=\"updMcqMulti(${q.id}, '${q.gapIds.join(',')}', event)\"> ${o} <span id=\"mcq-mark-${q.id}-${i}\" class=\"mcq-mark\"></span>\n                    </label>`;\n          });\n          h += `<div id=\"fb-${q.id}\" class=\"feedback\" style=\"margin-top:8px;font-size:13px\"></div></div>`;\n          qDiv.innerHTML += h;\n          q.gapIds.forEach(gid => {\n              const d=document.createElement('div'); d.className='progress-circle'; d.id='prog-'+gid; d.innerText=gid;\n              d.onclick=()=>document.getElementById('q-card-'+q.id).scrollIntoView({behavior:'smooth',block:'center'});\n              document.getElementById('progressBar').appendChild(d);\n          });\n      }\n      else { \n        let h=`<div class=\"q-block\" id=\"q-card-${q.id}\">`;\n        const loc = q.location || \"\";\n        const locBtn = loc ? `<button class=\"loc-btn\" onclick=
